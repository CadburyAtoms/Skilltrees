name: Validate atlas data

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/validate.js'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate.js'

jobs:
  validate:
    name: scripts/validate.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate data/*.json
        run: node scripts/validate.js
