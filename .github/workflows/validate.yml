name: Validate atlas data

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'module-src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'source-materials/maps/**'
      - 'EDHA_*.md'
      - 'TODO_*.md'
      - 'TRIAGE_PLAYTEST_PC_MANUALS.md'
      - 'FORCED_MOVEMENT_PILOT.md'
      - 'docs/PM_BOARD.md'
      - 'EDHA_DASHBOARD.html'
      - 'EDHA_CANON_CODEX.html'
      - '.claude/skills/leyline-tree-authoring/audit.py'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'module-src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'source-materials/maps/**'
      - 'EDHA_*.md'
      - 'TODO_*.md'
      - 'TRIAGE_PLAYTEST_PC_MANUALS.md'
      - 'FORCED_MOVEMENT_PILOT.md'
      - 'docs/PM_BOARD.md'
      - 'EDHA_DASHBOARD.html'
      - 'EDHA_CANON_CODEX.html'
      - '.claude/skills/leyline-tree-authoring/audit.py'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    name: gates (syntax, schema, refs, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # scripts/gates.js is the ONE gate list (item 20) — the same ordered set CLAUDE.md iron
      # rule 4 requires before every commit, run here with --ci for the two gates that need an
      # optional local dependency (Pillow for the map lint, classic-level for the compiled-pack
      # validators — both still installed just-in-time, inside gates.js, exactly as before).
      # `node scripts/gates.js --list` prints the ordered list without running anything.
      - name: Run gates (node scripts/gates.js --ci)
        env:
          EDHA_DATA: ${{ github.workspace }}/data       # foundry-build.js DATA defaults to Ben's Windows path
          EDHA_MODROOT: ${{ runner.temp }}/edha-packs   # write the scratch packs off the repo tree
        run: node scripts/gates.js --ci
