e a willing creature within reach. After one uninterrupted hour of instruction, it gains Red Leyline Attunement (Rank 1 only). A creature may benefit from only one Leyline Instruction at a time.", "Flavor Text": "", "Tags": "instruction; universal"}, {"Color": "Red", "Tree": "Attunement", "Talent Name": "Unstoppable", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Reckless Momentum; Attunement 3+", "Description": "When you deal damage on a Fast turn, move up to half your Speed without provoking Reactions. Once per turn.", "Flavor Text": "You stop when they do.", "Tags": "fast_turn; movement; momentum; terminal"}, {"Color": "Red", "Tree": "Physical", "Talent Name": "Volatile Strike", "Action Type": "Special", "Cost": "—", "Prerequisites": "—", "Description": "When you hit with a melee attack, add half [Die] Impact damage. Lose HP equal to half [Die] to add [Die] instead.", "Flavor Text": "Hit harder. Always harder.", "Tags": "melee; impact; hp_optional"}, {"Color": "Red", "Tree": "Physical", "Talent Name": "Shockwave Slam", "Action Type": "Special", "Cost": "—", "Prerequisites": "Volatile Strike", "Description": "When you hit with a melee Physical test, push the target up to [Size] ft. Collision with an obstacle deals half [Die] Impact.", "Flavor Text": "They move when you tell them to move.", "Tags": "push; collision; melee; rider"}, {"Color": "Red", "Tree": "Physical", "Talent Name": "Explosive Leap", "Action Type": "Free Action", "Cost": "—", "Prerequisites": "Volatile Strike", "Description": "Move up to [Size] ft without provoking Reactions. Creatures within 5 ft of where you land test Physical or fall Prone.", "Flavor Text": "Arrive like a meteor.", "Tags": "movement; aoe; prone"}, {"Color": "Red", "Tree": "Physical", "Talent Name": "Flame Surge", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Shockwave Slam or Explosive Leap; Attunement 2+", "Description": "Each creature within [Size] of a point in Attunement Range tests Physical. On failure, take [Die] Energy damage.", "Flavor Text": "Everything in range burns.", "Tags": "aoe; energy; investiture"}, {"Color": "Red", "Tree": "Physical", "Talent Name": "Backblast", "Action Type": "Reaction", "Cost": "—", "Prerequisites": "Flame Surge", "Description": "When a creature hits you with a melee attack, deal half [Die] Energy damage to it.", "Flavor Text": "Touch fire and fire touches back.", "Tags": "retaliation; energy; reaction"}, {"Color": "Red", "Tree": "Physical", "Talent Name": "Surefooted", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Flame Surge", "Description": "Increase your Speed by 10 ft. Reduce damage from falls and difficult terrain by half [Die].", "Flavor Text": "Momentum is a kind of armor.", "Tags": "speed; shared_passive"}, {"Color": "Red", "Tree": "Physical", "Talent Name": "Afterburn", "Action Type": "Special", "Cost": "Opportunity", "Prerequisites": "Backblast or Surefooted", "Description": "When you deal Energy damage with a Red Physical talent, spend Opportunity to inflict Afflicted[half [Die] Energy] on the target.", "Flavor Text": "The flames linger in the wound.", "Tags": "afflicted; energy; opportunity"}, {"Color": "Red", "Tree": "Physical", "Talent Name": "Chain Detonation", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Afterburn; Attunement 3+", "Description": "When you reduce a creature to 0 HP with a Red Physical talent, deal half [Die] Energy damage to each creature within 5 ft.", "Flavor Text": "When one falls, the fire finds the next.", "Tags": "kill_splash; energy; aoe; terminal"}, {"Color": "Red", "Tree": "Cognitive", "Talent Name": "Incite", "Action Type": "1 Action", "Cost": "1 Investiture", "Prerequisites": "—", "Description": "Test Influence vs. Spiritual Defense on a creature in Attunement Range. On success, it must Strike the nearest creature or lose its Reaction.", "Flavor Text": "Fight. Fight them. Fight anything.", "Tags": "influence; forced_action; investiture"}, {"Color": "Red", "Tree": "Cognitive", "Talent Name": "Emotional Overload", "Action Type": "Special", "Cost": "—", "Prerequisites": "Incite", "Description": "When a creature within Attunement Range gains Advantage from any source, it suffers Disadvantage on its next non-attack test.", "Flavor Text": "Power without control is just another vulnerability.", "Tags": "advantage_punish; disadvantage; rider"}, {"Color": "Red", "Tree": "Cognitive", "Talent Name": "Battle Fever", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Incite", "Description": "Each time damage is dealt within Attunement Range, you and allies gain +1 to your next test (max = Rank). Resets at start of your turn.", "Flavor Text": "Violence in the air sharpens every blade.", "Tags": "stacking_bonus; damage; allies"}, {"Color": "Red", "Tree": "Cognitive", "Talent Name": "Shatter Focus", "Action Type": "Reaction", "Cost": "—", "Prerequisites": "Emotional Overload or Battle Fever; Attunement 2+", "Description": "When a creature within Attunement Range fails a test, it loses 1 Focus. Once per round.", "Flavor Text": "Failure cracks the mind wide open.", "Tags": "focus_drain; failure; reaction"}, {"Color": "Red", "Tree": "Cognitive", "Talent Name": "Reckless Gambit", "Action Type": "Special", "Cost": "Opportunity", "Prerequisites": "Shatter Focus", "Description": "When a creature within Attunement Range takes damage, spend Opportunity to grant it Advantage on its next test. It then suffers Exhausted[2].", "Flavor Text": "Give them everything. Then take it all back.", "Tags": "advantage_grant; exhausted; opportunity"}, {"Color": "Red", "Tree": "Cognitive", "Talent Name": "Contagious Fury", "Action Type": "Special", "Cost": "—", "Prerequisites": "Shatter Focus", "Description": "When you succeed on an Influence test that forces a creature to act, the next creature to attack that target rolls the Plot Die.", "Flavor Text": "Rage spreads. Let it.", "Tags": "plot_die; forced_action; spread"}, {"Color": "Red", "Tree": "Cognitive", "Talent Name": "Frenzied Tempo", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Reckless Gambit or Contagious Fury", "Description": "When you take a Fast turn, your Influence tests gain Advantage until end of turn.", "Flavor Text": "Speed is its own kind of persuasion.", "Tags": "fast_turn; influence; advantage"}, {"Color": "Red", "Tree": "Cognitive", "Talent Name": "Tyrant's Crescendo", "Action Type": "Special", "Cost": "—", "Prerequisites": "Frenzied Tempo; Attunement 3+", "Description": "When a creature within Attunement Range takes damage for the second time in a round, it becomes Disoriented.", "Flavor Text": "The beating grows louder. The will grows weaker.", "Tags": "disoriented; escalation; terminal"}, {"Color": "Green", "Tree": "Attunement", "Talent Name": "Leyline Attunement", "Action Type": "Passive", "Cost": "—", "Prerequisites": "—", "Description": "When you Draw Mana, create difficult terrain within [Size] of a point in Attunement Range.", "Flavor Text": "The green lines remember what the world was.", "Tags": "draw_mana; difficult_terrain"}, {"Color": "Green", "Tree": "Attunement", "Talent Name": "Primal Awareness", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Leyline Attunement", "Description": "You can't be Surprised on natural terrain. Gain Advantage on Perception tests to detect or track creatures.", "Flavor Text": "The wild does not forgive inattention.", "Tags": "surprise; perception; tracking"}, {"Color": "Green", "Tree": "Attunement", "Talent Name": "Root and Branch", "Action Type": "Special", "Cost": "—", "Prerequisites": "Primal Awareness", "Description": "When two or more enemies end their turn adjacent to each other within Attunement Range, gain Temporary HP equal to Tier.", "Flavor Text": "Let them cluster. Your strength grows with their foolishness.", "Tags": "temp_hp; cluster; adjacency"}, {"Color": "Green", "Tree": "Attunement", "Talent Name": "Territorial Instinct", "Action Type": "Special", "Cost": "Opportunity", "Prerequisites": "Primal Awareness", "Description": "When an enemy in your Attunement Range tries to Disengage, spend Opportunity to reduce its movement to 0 this turn.", "Flavor Text": "Nothing leaves your territory without your permission.", "Tags": "movement_denial; disengage; opportunity"}, {"Color": "Green", "Tree": "Attunement", "Talent Name": "Verdant Resilience", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Root and Branch or Territorial Instinct; Attunement 2+", "Description": "At the start of your turn, if you didn't move on your last turn, regain HP equal to your Tier.", "Flavor Text": "Stillness is not weakness. It is the earth reclaiming you.", "Tags": "regen; stillness; hp"}, {"Color": "Green", "Tree": "Attunement", "Talent Name": "Pack Sense", "Action Type": "Special", "Cost": "—", "Prerequisites": "Verdant Resilience", "Description": "When an ally tests against a creature in your difficult terrain, they add half [Die] to the result.", "Flavor Text": "The pack hunts with your knowledge.", "Tags": "ally; terrain; bonus"}, {"Color": "Green", "Tree": "Attunement", "Talent Name": "Leyline Instruction", "Action Type": "2 Actions", "Cost": "2 Investiture", "Prerequisites": "Verdant Resilience", "Description": "Choose a willing creature within reach. After one uninterrupted hour of instruction, it gains Green Leyline Attunement (Rank 1 only). A creature may benefit from only one Leyline Instruction at a time.", "Flavor Text": "", "Tags": "instruction; universal"}, {"Color": "Green", "Tree": "Attunement", "Talent Name": "Apex Predator", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Pack Sense; Attunement 3+", "Description": "While three or more enemies are within your Attunement Range, gain Advantage on all Physical and Cognitive tests.", "Flavor Text": "Surrounded by prey, you become what they fear most.", "Tags": "advantage; cluster; terminal"}, {"Color": "Green", "Tree": "Physical", "Talent Name": "Verdant Mend", "Action Type": "1 Action", "Cost": "1 Investiture", "Prerequisites": "—", "Description": "Touch a willing creature and restore HP equal to [Die] x 2.", "Flavor Text": "Green mana remembers what the body should be.", "Tags": "healing; touch; investiture"}, {"Color": "Green", "Tree": "Physical", "Talent Name": "Pack Pressure", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Verdant Mend", "Description": "When you and an ally are both adjacent to a creature, gain Advantage on Physical tests against it and add half [Die] damage.", "Flavor Text": "Two predators are more than twice the threat of one.", "Tags": "adjacency; advantage; damage"}, {"Color": "Green", "Tree": "Physical", "Talent Name": "Thorn Field", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Verdant Mend", "Description": "Your difficult terrain deals half [Die] Keen damage to creatures that enter it or start their turn in it.", "Flavor Text": "The land itself bites.", "Tags": "terrain; keen; damage"}, {"Color": "Green", "Tree": "Physical", "Talent Name": "Grasping Vines", "Action Type": "Special", "Cost": "—", "Prerequisites": "Pack Pressure or Thorn Field", "Description": "When you hit a creature in your difficult terrain with a Physical test, it is also Restrained until end of your next turn.", "Flavor Text": "The earth holds what you have caught.", "Tags": "restrained; terrain; rider"}, {"Color": "Green", "Tree": "Physical", "Talent Name": "Natural Recovery", "Action Type": "Special", "Cost": "—", "Prerequisites": "Grasping Vines", "Description": "When you restore HP with a Green Physical talent, also remove one condition: Disoriented, Weakened, or Prone.", "Flavor Text": "Healing purges what sickness cannot hide.", "Tags": "condition_removal; healing; rider"}, {"Color": "Green", "Tree": "Physical", "Talent Name": "Hardy", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Grasping Vines", "Description": "Gain +1 maximum HP per level, including previous levels.", "Flavor Text": "The wild rewards those built to endure.", "Tags": "max_health; shared_passive"}, {"Color": "Green", "Tree": "Physical", "Talent Name": "Reknit Form", "Action Type": "2 Actions", "Cost": "1 Investiture, 1 Focus", "Prerequisites": "Natural Recovery or Hardy; Attunement 2+", "Description": "Touch a creature to remove one Injury. Shallow: automatic. Vicious: DC 15. Permanent: DC 20.", "Flavor Text": "Bone remembers its shape. You remind it.", "Tags": "injury; healing; focus"}, {"Color": "Green", "Tree": "Physical", "Talent Name": "Vital Surge", "Action Type": "Special", "Cost": "—", "Prerequisites": "Reknit Form; Attunement 3+", "Description": "When you restore HP to a creature below half HP, it also gains Temporary HP equal to half [Die].", "Flavor Text": "When the body breaks, green mana answers with excess.", "Tags": "healing; temp_hp; terminal"}, {"Color": "Green", "Tree": "Cognitive", "Talent Name": "Predator's Instinct", "Action Type": "Passive", "Cost": "—", "Prerequisites": "—", "Description": "Gain Advantage tracking wounded or Injured creatures. You sense fear in conversation without testing.", "Flavor Text": "You smell weakness the way others smell smoke.", "Tags": "tracking; advantage; fear"}, {"Color": "Green", "Tree": "Cognitive", "Talent Name": "Pack Hunter", "Action Type": "Special", "Cost": "—", "Prerequisites": "Predator's Instinct", "Description": "When you or an ally moves adjacent to a creature another ally is adjacent to, both gain Advantage on their next test against it.", "Flavor Text": "The pack closes in. The prey has nowhere to turn.", "Tags": "adjacency; advantage; pack"}, {"Color": "Green", "Tree": "Cognitive", "Talent Name": "Scent the Weak", "Action Type": "Special", "Cost": "—", "Prerequisites": "Predator's Instinct", "Description": "You know which creature within Attunement Range has the lowest HP. Your first test against it each round gains Advantage.", "Flavor Text": "Blood calls to you. The weakest always bleeds loudest.", "Tags": "lowest_hp; advantage; tracking"}, {"Color": "Green", "Tree": "Cognitive", "Talent Name": "Territorial Claim", "Action Type": "Special", "Cost": "Opportunity", "Prerequisites": "Pack Hunter or Scent the Weak; Attunement 2+", "Description": "When you create difficult terrain, spend Opportunity to prevent creatures in it from willingly moving away until end of your next turn.", "Flavor Text": "Fortune stakes your claim. Nothing leaves.", "Tags": "terrain; movement_denial; opportunity"}, {"Color": "Green", "Tree": "Cognitive", "Talent Name": "Primal Sight", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Territorial Claim", "Description": "You are immune to magical illusions and concealment within Attunement Range. Automatically detect deceptive Influence targeting you or adjacent allies.", "Flavor Text": "Artifice and illusion wither under the gaze of nature.", "Tags": "anti_illusion; anti_deception; immunity"}, {"Color": "Green", "Tree": "Cognitive", "Talent Name": "Surefooted", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Territorial Claim", "Description": "Increase your Speed by 10 ft. Reduce damage from falls and difficult terrain by half [Die].", "Flavor Text": "The wild shapes your stride to match its own.", "Tags": "speed; terrain; shared_passive"}, {"Color": "Green", "Tree": "Cognitive", "Talent Name": "Packmate's Warning", "Action Type": "Reaction", "Cost": "—", "Prerequisites": "Primal Sight or Surefooted", "Description": "When an ally within 10 ft is targeted by an attack they can't see, grant them +2 to their defense against it.", "Flavor Text": "You sense the threat before it strikes your kin.", "Tags": "ally; defense; unseen"}, {"Color": "Green", "Tree": "Cognitive", "Talent Name": "Natural Order", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Packmate's Warning; Attunement 3+", "Description": "Enemies within your Attunement Range cannot benefit from illusions, magical concealment, or Advantage gained from deception.", "Flavor Text": "In your domain, nothing hides. Nothing cheats. Nothing deceives.", "Tags": "anti_illusion; anti_deception; terminal"}],
  domain: [{"Deity": "Morrath", "Domain": "Death", "Colors": "Black/Green", "Tree": "Death", "Talent Name": "Death's Threshold", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Green Rank 2; Black Rank 2", "Description": "When you reduce a creature to 0 HP, recover Investiture equal to your Tier. You can sense living creatures within your Attunement Range that are below half their maximum HP.", "Flavor Text": "The Shepherd sees the flock thinning.", "Tags": "base; root"}, {"Deity": "Morrath", "Domain": "Death", "Colors": "Black/Green", "Tree": "Death", "Talent Name": "Withering Touch", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Black Rank 3; Death's Threshold", "Description": "Melee attack. On hit, deal Vital damage equal to [Die] + Willpower. The target cannot regain HP until the start of your next turn.", "Flavor Text": "Flesh remembers that it was always meant to fail.", "Tags": "entropy; entry"}, {"Deity": "Morrath", "Domain": "Death", "Colors": "Black/Green", "Tree": "Death", "Talent Name": "Consuming Decay", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Willpower 3; Withering Touch", "Description": "Choose a creature in Attunement Range that is Weakened or below half HP. It takes Vital damage equal to [Die] at the start of each of its turns for the scene. You heal HP equal to half the Vital damage dealt. One instance per creature.", "Flavor Text": "What rots feeds what remains.", "Tags": "entropy; fork a"}, {"Deity": "Morrath", "Domain": "Death", "Colors": "Black/Green", "Tree": "Death", "Talent Name": "Necrotic Cascade", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Black Rank 4; Withering Touch", "Description": "When a creature in your Attunement Range drops to 0 HP, each enemy within 10 ft of it takes Spirit damage equal to [Die]. Triggers automatically after initial activation.", "Flavor Text": "Death is contagious.", "Tags": "entropy; fork b"}, {"Deity": "Morrath", "Domain": "Death", "Colors": "Black/Green", "Tree": "Death", "Talent Name": "Gentle Passage", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Green Rank 3; Death's Threshold", "Description": "Touch a willing or unconscious creature. Remove one Injury. The creature falls into restful sleep for 1 minute (or until damaged). On waking, it regains HP equal to [Die] + Awareness.", "Flavor Text": "Rest now. The cycle will carry you.", "Tags": "cycle's end; entry"}, {"Deity": "Morrath", "Domain": "Death", "Colors": "Black/Green", "Tree": "Death", "Talent Name": "Compost", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Awareness 3; Gentle Passage", "Description": "Target a dead creature or destroyed object in Attunement Range. Over 1 minute, it decomposes entirely. You and each ally within 15 ft regain HP equal to Tier + [Die]. Lush difficult terrain appears in the space.", "Flavor Text": "From the fallen, the forest drinks.", "Tags": "cycle's end; fork a"}, {"Deity": "Morrath", "Domain": "Death", "Colors": "Black/Green", "Tree": "Death", "Talent Name": "Natural Conclusion", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Green Rank 4; Gentle Passage", "Description": "Choose a creature in Attunement Range suffering from a disease, curse, or persistent magical effect. End one such effect. If the effect was sustained by another creature's Investiture, that creature takes Spirit damage equal to [Die].", "Flavor Text": "All things end. Even the things that were never meant to be.", "Tags": "cycle's end; fork b"}, {"Deity": "Morrath", "Domain": "Death", "Colors": "Black/Green", "Tree": "Death", "Talent Name": "Speak with the Fallen", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Green Rank 3; Black Rank 3; Death's Threshold", "Description": "Touch the remains of a creature that died within the last 24 hours. Ask up to 3 questions; the spirit answers truthfully but briefly. Each additional use on the same remains within 24 hours costs +2 Investiture.", "Flavor Text": "The dead remember. They simply have no reason to lie.", "Tags": "shepherd's gate; entry"}, {"Deity": "Morrath", "Domain": "Death", "Colors": "Black/Green", "Tree": "Death", "Talent Name": "Raise Dead", "Action Type": "3 Actions", "Cost": "5 Investiture", "Prerequisites": "Black Rank 4; Willpower 4; Speak with the Fallen", "Description": "Touch a creature that died within the last hour. It returns to life with 1 HP and one additional Injury. The raised creature acts on your initiative and is Disoriented (Disadvantage on all tests) until end of its next turn. Once per scene.", "Flavor Text": "Come back. The Shepherd has not called you yet.", "Tags": "shepherd's gate; fork a"}, {"Deity": "Morrath", "Domain": "Death", "Colors": "Black/Green", "Tree": "Death", "Talent Name": "Death Ward", "Action Type": "2 Actions", "Cost": "4 Investiture", "Prerequisites": "Green Rank 4; Presence 3; Speak with the Fallen", "Description": "Choose a creature in Attunement Range. For the scene, the first time it would drop to 0 HP, it instead drops to 1 HP and gains temporary HP equal to [Die] + Presence. Effect then ends.", "Flavor Text": "Not yet. The gate remains shut.", "Tags": "shepherd's gate; fork b"}, {"Deity": "Maelith", "Domain": "Chaos", "Colors": "Black/Blue", "Tree": "Chaos", "Talent Name": "Chaos Attunement", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Black Rank 2; Blue Rank 2", "Description": "When you activate a Chaos talent, roll a d6. On 5-6, Investiture cost reduced by 1 (min 1). On 1, the effect also targets you or an ally (GM determines how). You sense sustained magical effects within Attunement Range.", "Flavor Text": "Chaos doesn't play favorites. That's the point.", "Tags": "base; root"}, {"Deity": "Maelith", "Domain": "Chaos", "Colors": "Black/Blue", "Tree": "Chaos", "Talent Name": "Unravel", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Black Rank 3; Chaos Attunement", "Description": "Target a creature in Attunement Range benefiting from a magical buff, stance, or sustained ability. Intellect test vs target's Spiritual Defense. On success, end one such effect; target takes Spirit damage equal to [Die].", "Flavor Text": "Every system has a thread. Pull it.", "Tags": "dissolution; entry"}, {"Deity": "Maelith", "Domain": "Chaos", "Colors": "Black/Blue", "Tree": "Chaos", "Talent Name": "Entropic Field", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Black Rank 4; Unravel", "Description": "Create a 15 ft radius zone at a point in Attunement Range. For the scene, no creature in the zone can benefit from Advantage, and all sustained magical effects in the zone cost +1 Investiture per turn to maintain.", "Flavor Text": "Order costs more than it's worth in here.", "Tags": "dissolution; fork a"}, {"Deity": "Maelith", "Domain": "Chaos", "Colors": "Black/Blue", "Tree": "Chaos", "Talent Name": "Sever the Pattern", "Action Type": "Active (Reaction)", "Cost": "2 Investiture", "Prerequisites": "Willpower 3; Unravel", "Description": "When a creature in Attunement Range activates a talent, use Reaction to force a Willpower test vs your Cognitive Defense. On failure, the talent activates but targets a random valid target (including caster's allies).", "Flavor Text": "You meant to do that. You just didn't mean to do it to them.", "Tags": "dissolution; fork b"}, {"Deity": "Maelith", "Domain": "Chaos", "Colors": "Black/Blue", "Tree": "Chaos", "Talent Name": "Probability Spike", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Blue Rank 3; Chaos Attunement", "Description": "Choose a creature in Attunement Range. Its next test is altered: if the result is even, add [Die]; if odd, subtract [Die]. The creature is unaware until it manifests.", "Flavor Text": "Luck is just math you haven't seen yet.", "Tags": "calculated madness; entry"}, {"Deity": "Maelith", "Domain": "Chaos", "Colors": "Black/Blue", "Tree": "Chaos", "Talent Name": "Chaos Theory", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Intellect 4; Probability Spike", "Description": "For the remainder of this round, when any creature in Attunement Range rolls a die, you may swap the result with the next die rolled by any creature in range. Usable a number of times equal to your Intellect modifier.", "Flavor Text": "The system is deterministic. I just changed the inputs.", "Tags": "calculated madness; fork a"}, {"Deity": "Maelith", "Domain": "Chaos", "Colors": "Black/Blue", "Tree": "Chaos", "Talent Name": "Madman's Insight", "Action Type": "1 Action", "Cost": "1 Investiture", "Prerequisites": "Blue Rank 4; Probability Spike", "Description": "Once per round, when you fail a Cognitive test, reroll it (must accept new result). If the reroll also fails, gain Advantage on your next Physical test as your mind reroutes through instinct.", "Flavor Text": "Wrong answers are just right answers to different questions.", "Tags": "calculated madness; fork b"}, {"Deity": "Maelith", "Domain": "Chaos", "Colors": "Black/Blue", "Tree": "Chaos", "Talent Name": "Twist Fate", "Action Type": "Active (Reaction)", "Cost": "3 Investiture", "Prerequisites": "Black Rank 3; Blue Rank 3; Chaos Attunement", "Description": "When a creature in Attunement Range makes a test, use Reaction to force a reroll. You choose which result is used. Cannot target the same creature more than once per scene.", "Flavor Text": "The Laughing Dark laughs because it already knows.", "Tags": "wild card; entry"}, {"Deity": "Maelith", "Domain": "Chaos", "Colors": "Black/Blue", "Tree": "Chaos", "Talent Name": "Reality Stutter", "Action Type": "2 Actions", "Cost": "4 Investiture", "Prerequisites": "Intellect 3, Willpower 3; Twist Fate", "Description": "Choose a point in Attunement Range. Every creature within 15 ft is teleported to a random unoccupied space within 30 ft. Teleported creatures are Disoriented (Disadvantage on next test). You may exclude yourself.", "Flavor Text": "Where you were isn't where you are.", "Tags": "wild card; fork a"}, {"Deity": "Maelith", "Domain": "Chaos", "Colors": "Black/Blue", "Tree": "Chaos", "Talent Name": "Schrodinger's Gambit", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Black Rank 4; Blue Rank 4; Twist Fate", "Description": "Declare two different legal actions. Roll d6: on 1-3 the first occurs, on 4-6 the second. Whichever occurs has one attribute doubled (damage, healing, range, or duration — choose one). Occurs immediately.", "Flavor Text": "Both things are true until one of them happens.", "Tags": "wild card; fork b"}, {"Deity": "Tyrith", "Domain": "Power", "Colors": "Black/Red", "Tree": "Power", "Talent Name": "Will to Power", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Black Rank 2; Red Rank 2", "Description": "When you deal damage and reduce a creature below half max HP for the first time, gain 1 temporary HP per Tier. Gain Advantage on Presence tests to intimidate, command, or lead.", "Flavor Text": "Authority is not given. It is demonstrated.", "Tags": "base; root"}, {"Deity": "Tyrith", "Domain": "Power", "Colors": "Black/Red", "Tree": "Power", "Talent Name": "Kneel", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Black Rank 3; Will to Power", "Description": "Choose a creature in Attunement Range. Presence test vs Cognitive Defense. On success, target is Compelled (must use next action to move toward you or do nothing) until start of your next turn.", "Flavor Text": "This is not a request.", "Tags": "domination; entry"}, {"Deity": "Tyrith", "Domain": "Power", "Colors": "Black/Red", "Tree": "Power", "Talent Name": "Crown of Thorns", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Presence 4; Kneel", "Description": "For the scene, whenever a creature in Attunement Range fails a test against your Cognitive Defense, it takes Spirit damage equal to your Presence. This damage cannot be reduced.", "Flavor Text": "Defy me. See what it costs.", "Tags": "domination; fork a"}, {"Deity": "Tyrith", "Domain": "Power", "Colors": "Black/Red", "Tree": "Power", "Talent Name": "Absolute Authority", "Action Type": "2 Actions", "Cost": "4 Investiture", "Prerequisites": "Black Rank 4; Willpower 3; Kneel", "Description": "Choose a Compelled, Frightened, or Weakened creature in range. Willpower test vs your Spiritual Defense. On failure, you choose its next turn's action (cannot directly self-harm). On success, Weakened until end of its next turn.", "Flavor Text": "Your will was always borrowed. I'm taking it back.", "Tags": "domination; fork b"}, {"Deity": "Tyrith", "Domain": "Power", "Colors": "Black/Red", "Tree": "Power", "Talent Name": "Momentum of Victory", "Action Type": "1 Action", "Cost": "1 Investiture", "Prerequisites": "Red Rank 3; Will to Power", "Description": "When you reduce a creature to 0 HP or score a critical hit, immediately move up to 15 ft and make a free melee attack against a different creature in reach. This attack deals bonus damage equal to Tier.", "Flavor Text": "The crown is taken in motion.", "Tags": "conquest; entry"}, {"Deity": "Tyrith", "Domain": "Power", "Colors": "Black/Red", "Tree": "Power", "Talent Name": "Warlord's Fury", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Strength 3; Momentum of Victory", "Description": "For the scene, melee attacks deal additional damage equal to the number of creatures you've reduced to 0 HP this scene (max bonus = Tier x 2).", "Flavor Text": "Each one that falls makes the next fall faster.", "Tags": "conquest; fork a"}, {"Deity": "Tyrith", "Domain": "Power", "Colors": "Black/Red", "Tree": "Power", "Talent Name": "Unstoppable Advance", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Red Rank 4; Momentum of Victory", "Description": "Until end of your next turn, you cannot be slowed, immobilized, or knocked prone. You may move through enemy spaces. Each enemy you move through takes Impact damage equal to [Die].", "Flavor Text": "Step aside or be a stepping stone.", "Tags": "conquest; fork b"}, {"Deity": "Tyrith", "Domain": "Power", "Colors": "Black/Red", "Tree": "Power", "Talent Name": "Investiture of Command", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Black Rank 3; Red Rank 3; Will to Power", "Description": "Choose up to 3 allies in Attunement Range. Each gains temporary HP equal to [Die] and Advantage on next attack. You take Spirit damage equal to your Tier (cannot be reduced).", "Flavor Text": "A true leader bleeds first.", "Tags": "ascendancy; entry"}, {"Deity": "Tyrith", "Domain": "Power", "Colors": "Black/Red", "Tree": "Power", "Talent Name": "Mantle of the Aspirant", "Action Type": "Active (Scene)", "Cost": "5 Investiture", "Prerequisites": "Red Rank 4; Presence 4; Investiture of Command", "Description": "For the scene: +2 to all Defenses, melee attacks deal bonus Spirit damage equal to Tier, allies in Attunement Range gain +1 to all tests. When you take damage, may redirect up to Tier in damage to willing allies in range.", "Flavor Text": "The crown is not worn. It is become.", "Tags": "ascendancy; fork a"}, {"Deity": "Tyrith", "Domain": "Power", "Colors": "Black/Red", "Tree": "Power", "Talent Name": "Usurper's Claim", "Action Type": "2 Actions", "Cost": "4 Investiture", "Prerequisites": "Black Rank 4; Willpower 4; Investiture of Command", "Description": "Target a creature in range sustaining a magical effect. Willpower test vs its Spiritual Defense. On success, seize control of that effect for the scene — you choose targets, parameters, and when it ends. Original caster cannot end it.", "Flavor Text": "What was yours is mine. What was mine was always mine.", "Tags": "ascendancy; fork b"}, {"Deity": "Verdannis", "Domain": "Nature", "Colors": "Black/White", "Tree": "Nature", "Talent Name": "Cycle's Balance", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Black Rank 2; White Rank 2", "Description": "At the start of each turn, choose one: one enemy in Attunement Range loses temporary HP equal to Tier, OR one ally in Attunement Range gains temporary HP equal to Tier. You are immune to disease.", "Flavor Text": "What grows must decay. What decays must nourish.", "Tags": "base; root"}, {"Deity": "Verdannis", "Domain": "Nature", "Colors": "Black/White", "Tree": "Nature", "Talent Name": "Controlled Rot", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Black Rank 3; Cycle's Balance", "Description": "Choose a 10 ft square in Attunement Range. Objects rapidly age. Creatures in area take Vital damage equal to [Die] at start of their turn. Persists 3 rounds. If a creature drops to 0 HP in area, an ally within 30 ft heals [Die] HP.", "Flavor Text": "The forest floor is built from the dead.", "Tags": "decay & renewal; entry"}, {"Deity": "Verdannis", "Domain": "Nature", "Colors": "Black/White", "Tree": "Nature", "Talent Name": "Autumn's Harvest", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Awareness 3; Controlled Rot", "Description": "When a creature in Attunement Range drops to 0 HP, harvest its essence. Gain +1 to a stat of your choice for the scene (max 3 harvests, each a different stat).", "Flavor Text": "The tree that falls feeds ten saplings.", "Tags": "decay & renewal; fork a"}, {"Deity": "Verdannis", "Domain": "Nature", "Colors": "Black/White", "Tree": "Nature", "Talent Name": "Blight", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Black Rank 4; Controlled Rot", "Description": "Choose a creature in Attunement Range. Its maximum HP is reduced by [Die] + Willpower until end of scene. If max HP falls below current HP, excess is lost immediately. Stacks up to twice.", "Flavor Text": "Even the strongest oak hollows from within.", "Tags": "decay & renewal; fork b"}, {"Deity": "Verdannis", "Domain": "Nature", "Colors": "Black/White", "Tree": "Nature", "Talent Name": "Season's Mandate", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "White Rank 3; Cycle's Balance", "Description": "Declare a season for a 30 ft radius centered on you (scene): Spring (allies heal [Die] on Draw Mana), Summer (+1 Physical tests for allies), Autumn (-5 ft enemy movement), Winter (difficult terrain for enemies). Change season once/round as free action.", "Flavor Text": "The world turns because I say it turns.", "Tags": "natural law; entry"}, {"Deity": "Verdannis", "Domain": "Nature", "Colors": "Black/White", "Tree": "Nature", "Talent Name": "Equilibrium", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "White Rank 4; Season's Mandate", "Description": "Choose two creatures in Attunement Range. Average their current HP totals (round down). Both are set to the new total. Cannot reduce below 1 HP or raise above maximum. One creature must be willing or unconscious.", "Flavor Text": "Nature demands balance. I enforce it.", "Tags": "natural law; fork a"}, {"Deity": "Verdannis", "Domain": "Nature", "Colors": "Black/White", "Tree": "Nature", "Talent Name": "Warden's Mandate", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Presence 3; Season's Mandate", "Description": "Choose up to 3 creatures in Attunement Range affected by Season's Mandate. For the scene, they cannot leave the area voluntarily. If forced out, must use next action to return.", "Flavor Text": "The forest does not release its own.", "Tags": "natural law; fork b"}, {"Deity": "Verdannis", "Domain": "Nature", "Colors": "Black/White", "Tree": "Nature", "Talent Name": "Tap the Root Network", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Black Rank 3; White Rank 3; Cycle's Balance", "Description": "Extend senses through leyline network. For 1 minute, sense location and emotional state of every creature touching the ground within 120 ft. Learn locations of leyline nexuses within 1 mile.", "Flavor Text": "The roots carry everything. You only need to listen.", "Tags": "deep root; entry"}, {"Deity": "Verdannis", "Domain": "Nature", "Colors": "Black/White", "Tree": "Nature", "Talent Name": "Rootfather's Judgment", "Action Type": "Active (Scene)", "Cost": "5 Investiture", "Prerequisites": "Black Rank 4; White Rank 4; Tap the Root Network", "Description": "For the scene, at start of each turn, designate one creature in Attunement Range as 'in season' (heals [Die] HP) or 'out of season' (takes Vital damage equal to [Die]). You control the cycle.", "Flavor Text": "I am the Rootfather. I decide what grows.", "Tags": "deep root; fork a"}, {"Deity": "Verdannis", "Domain": "Nature", "Colors": "Black/White", "Tree": "Nature", "Talent Name": "Leyline Anchor", "Action Type": "2 Actions", "Cost": "4 Investiture", "Prerequisites": "Awareness 4, Presence 3; Tap the Root Network", "Description": "Choose a point in Attunement Range. A leyline anchor manifests for the scene. Allies within 15 ft regain +1 Investiture on Draw Mana. Enemy leyline talents within 15 ft cost +1 Investiture.", "Flavor Text": "The roots grow deepest where I plant them.", "Tags": "deep root; fork b"}, {"Deity": "Anaveth", "Domain": "Life", "Colors": "Blue/Green", "Tree": "Life", "Talent Name": "Pulse of Life", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Blue Rank 2; Green Rank 2", "Description": "When you heal a creature, it gains temporary HP equal to Tier. You can sense current HP and Injury status of any creature within Attunement Range.", "Flavor Text": "She feels every heartbeat in the room. Every one of them is too loud.", "Tags": "base; root"}, {"Deity": "Anaveth", "Domain": "Life", "Colors": "Blue/Green", "Tree": "Life", "Talent Name": "Surgical Precision", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Blue Rank 3; Pulse of Life", "Description": "Touch a creature. Intellect test (DC 15). On success, heal [Die] x 2 and remove one condition (Weakened, Disoriented, or Slowed). On failure, heal [Die] only. May self-target.", "Flavor Text": "The body is a system. Systems can be repaired.", "Tags": "biological mastery; entry"}, {"Deity": "Anaveth", "Domain": "Life", "Colors": "Blue/Green", "Tree": "Life", "Talent Name": "Immunological Purge", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Intellect 4; Surgical Precision", "Description": "Touch a creature with disease, poison, or parasitic effect. End all such effects. For the scene, the creature is immune to further applications of those specific effects.", "Flavor Text": "I've mapped the invader. It will not enter again.", "Tags": "biological mastery; fork a"}, {"Deity": "Anaveth", "Domain": "Life", "Colors": "Blue/Green", "Tree": "Life", "Talent Name": "Vital Diagram", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Blue Rank 4; Surgical Precision", "Description": "Choose a creature in Attunement Range. For the scene, know its exact HP, max HP, conditions, and Physical/Spiritual Defenses. You and allies attacking it deal bonus Vital damage equal to your Intellect.", "Flavor Text": "Now I see exactly where you're weakest.", "Tags": "biological mastery; fork b"}, {"Deity": "Anaveth", "Domain": "Life", "Colors": "Blue/Green", "Tree": "Life", "Talent Name": "Overgrowth", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Green Rank 3; Pulse of Life", "Description": "Choose a creature in Attunement Range. It regains [Die] + Awareness HP and grows natural armor (+1 Deflect until end of scene, stacks to 3). If at full HP, excess becomes temporary HP.", "Flavor Text": "The body doesn't just heal. It improves.", "Tags": "wild vitality; entry"}, {"Deity": "Anaveth", "Domain": "Life", "Colors": "Blue/Green", "Tree": "Life", "Talent Name": "Primal Regeneration", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Green Rank 4; Overgrowth", "Description": "Touch a willing creature. For the scene, at start of each turn it regains Tier + 1 HP. Regeneration ends if it takes Vital or Spirit damage. Also regrows missing limbs/organs over 1 hour.", "Flavor Text": "What was broken remembers what it was.", "Tags": "wild vitality; fork a"}, {"Deity": "Anaveth", "Domain": "Life", "Colors": "Blue/Green", "Tree": "Life", "Talent Name": "Bloom of Excess", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Awareness 3; Overgrowth", "Description": "When you heal a creature at full HP, excess erupts outward. Each creature within 10 ft heals half the excess. If no allies in range, target gains temporary HP equal to the full excess.", "Flavor Text": "There is too much life. It has to go somewhere.", "Tags": "wild vitality; fork b"}, {"Deity": "Anaveth", "Domain": "Life", "Colors": "Blue/Green", "Tree": "Life", "Talent Name": "Vessel's Blessing", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Blue Rank 3; Green Rank 3; Pulse of Life", "Description": "Touch a willing creature. Its max HP increases by [Die] for the scene. It gains +1 Strength and +1 Speed until end of scene. When effect ends, creature is Fatigued (Disadvantage on Physical tests, 1 minute).", "Flavor Text": "The Overflowing reaches through you. Can your body hold it?", "Tags": "overflow; entry"}, {"Deity": "Anaveth", "Domain": "Life", "Colors": "Blue/Green", "Tree": "Life", "Talent Name": "Champion of Life", "Action Type": "Active (Scene)", "Cost": "5 Investiture", "Prerequisites": "Green Rank 4; Presence 4; Vessel's Blessing", "Description": "Touch a willing creature (may be self). For scene: regenerate [Die] HP per turn, immune to disease and poison, natural attacks deal bonus Energy damage equal to Tier. When effect ends, target takes an Injury.", "Flavor Text": "You are the vessel. The river flows through you now.", "Tags": "overflow; fork a"}, {"Deity": "Anaveth", "Domain": "Life", "Colors": "Blue/Green", "Tree": "Life", "Talent Name": "Lifeline", "Action Type": "1 Action", "Cost": "3 Investiture", "Prerequisites": "Blue Rank 4; Willpower 3; Vessel's Blessing", "Description": "Choose a creature in Attunement Range. For the scene, when it takes damage, you may take up to half instead (Spirit damage, bypasses Deflect). When you take damage this way, target heals HP equal to Tier.", "Flavor Text": "I will carry your weight. That is what the river does.", "Tags": "overflow; fork b"}, {"Deity": "Razkael", "Domain": "Destruction", "Colors": "Blue/Red", "Tree": "Destruction", "Talent Name": "Ruin Sight", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Blue Rank 2; Red Rank 2", "Description": "Identify structural weakness of any object/construct in Attunement Range (1 round study or touch). Attacks vs objects deal double damage. When you damage a creature, learn its Deflect value.", "Flavor Text": "Everything falls. I simply know where to push.", "Tags": "base; root"}, {"Deity": "Razkael", "Domain": "Destruction", "Colors": "Blue/Red", "Tree": "Destruction", "Talent Name": "Exploit Weakness", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Blue Rank 3; Ruin Sight", "Description": "Choose a creature in Attunement Range you've damaged this scene. Your next attack ignores Deflect and deals bonus Keen damage equal to Intellect.", "Flavor Text": "There. That's the load-bearing wall.", "Tags": "structural analysis; entry"}, {"Deity": "Razkael", "Domain": "Destruction", "Colors": "Blue/Red", "Tree": "Destruction", "Talent Name": "Cascading Failure", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Intellect 4; Exploit Weakness", "Description": "When you damage a creature and reduce it past an HP threshold (full, 3/4, 1/2, 1/4), its Deflect is permanently reduced by 1 for the scene. Stacks.", "Flavor Text": "One crack becomes two. Two becomes collapse.", "Tags": "structural analysis; fork a"}, {"Deity": "Razkael", "Domain": "Destruction", "Colors": "Blue/Red", "Tree": "Destruction", "Talent Name": "Precision Demolition", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Blue Rank 4; Exploit Weakness", "Description": "Choose an object, barrier, or terrain feature in Attunement Range. Destroyed instantly if HP < [Die] x 3. If it survives, takes triple damage from your next attack. Works on magical barriers.", "Flavor Text": "I don't destroy everything. Just the part that matters.", "Tags": "structural analysis; fork b"}, {"Deity": "Razkael", "Domain": "Destruction", "Colors": "Blue/Red", "Tree": "Destruction", "Talent Name": "Shatter", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Red Rank 3; Ruin Sight", "Description": "Melee or ranged attack. On hit, deal normal damage plus bonus Energy damage equal to [Die]. Target pushed 10 ft. If target collides with object or creature, both take Impact damage equal to Tier.", "Flavor Text": "The rubble will tell the story.", "Tags": "cataclysm; entry"}, {"Deity": "Razkael", "Domain": "Destruction", "Colors": "Blue/Red", "Tree": "Destruction", "Talent Name": "Detonation Point", "Action Type": "2 Actions", "Cost": "4 Investiture", "Prerequisites": "Red Rank 4; Strength 3; Shatter", "Description": "Choose a point in Attunement Range. 20 ft radius explosion deals Energy damage equal to [Die] x 2. Creatures failing a Speed test are knocked prone. Objects under 20 HP are destroyed.", "Flavor Text": "Nothing personal. Just physics.", "Tags": "cataclysm; fork a"}, {"Deity": "Razkael", "Domain": "Destruction", "Colors": "Blue/Red", "Tree": "Destruction", "Talent Name": "Walking Ruin", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Speed 3; Shatter", "Description": "For the scene, spaces you move through become difficult terrain. Creatures starting turns in your trail take Impact damage equal to Tier. You gain +10 ft movement speed.", "Flavor Text": "The road behind me doesn't exist anymore.", "Tags": "cataclysm; fork b"}, {"Deity": "Razkael", "Domain": "Destruction", "Colors": "Blue/Red", "Tree": "Destruction", "Talent Name": "Controlled Demolition", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Blue Rank 3; Red Rank 3; Ruin Sight", "Description": "Choose a 15 ft area in Attunement Range. Selectively destroy chosen objects/terrain/barriers while leaving others untouched. Chosen creatures take Energy damage equal to [Die]. Excluded creatures are unharmed.", "Flavor Text": "Destruction is not chaos. Destruction is surgery.", "Tags": "necessary ruin; entry"}, {"Deity": "Razkael", "Domain": "Destruction", "Colors": "Blue/Red", "Tree": "Destruction", "Talent Name": "The Unmooring", "Action Type": "Active (Scene)", "Cost": "5 Investiture", "Prerequisites": "Blue Rank 4; Red Rank 4; Controlled Demolition", "Description": "For the scene, once per turn when you destroy an object/barrier or reduce a creature to 0 HP, choose: an ally within 30 ft heals [Die] HP, OR create 10 ft of clear stable ground (removing hazards/terrain).", "Flavor Text": "What I tear down, the world rebuilds. That was always the purpose.", "Tags": "necessary ruin; fork a"}, {"Deity": "Razkael", "Domain": "Destruction", "Colors": "Blue/Red", "Tree": "Destruction", "Talent Name": "Fault Line", "Action Type": "2 Actions", "Cost": "4 Investiture", "Prerequisites": "Intellect 3, Strength 3; Controlled Demolition", "Description": "60 ft line, 5 ft wide from you. Creatures in line take Energy damage equal to [Die] + Strength, Speed test or fall prone. Line becomes difficult terrain for the scene. Structures along line take triple damage.", "Flavor Text": "The earth remembers where Razkael walked.", "Tags": "necessary ruin; fork b"}, {"Deity": "Tessavain", "Domain": "Order", "Colors": "Blue/White", "Tree": "Order", "Talent Name": "Lawkeeper's Eye", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Blue Rank 2; White Rank 2", "Description": "Sense lies spoken within Attunement Range (feel dissonance, don't learn truth). Creatures that break a promise or oath in range are Marked (you know their location for 1 hour).", "Flavor Text": "The Covenant Keeper remembers every word.", "Tags": "base; root"}, {"Deity": "Tessavain", "Domain": "Order", "Colors": "Blue/White", "Tree": "Order", "Talent Name": "Binding Clause", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Blue Rank 3; Lawkeeper's Eye", "Description": "Choose a creature in Attunement Range. Declare a prohibited action. Willpower test vs your Cognitive Defense. On failure, the prohibited action costs 2 Focus. Lasts until scene end or creature succeeds Willpower test at start of its turn.", "Flavor Text": "The clause is entered into the record.", "Tags": "divine law; entry"}, {"Deity": "Tessavain", "Domain": "Order", "Colors": "Blue/White", "Tree": "Order", "Talent Name": "Contempt of Court", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Intellect 3; Binding Clause", "Description": "When a creature violates a Binding Clause or breaks a witnessed oath, it takes Spirit damage equal to [Die] x 2 and is Stunned until end of its next turn. Triggers automatically, no Reaction needed.", "Flavor Text": "The court finds you in contempt.", "Tags": "divine law; fork a"}, {"Deity": "Tessavain", "Domain": "Order", "Colors": "Blue/White", "Tree": "Order", "Talent Name": "Legal Precedent", "Action Type": "1 Action", "Cost": "1 Investiture", "Prerequisites": "Blue Rank 4; Binding Clause", "Description": "When you successfully apply Binding Clause, apply the same clause to one additional creature in range as free action (same test required). Your Binding Clauses cannot be dispelled by non-deity magic.", "Flavor Text": "The ruling applies broadly.", "Tags": "divine law; fork b"}, {"Deity": "Tessavain", "Domain": "Order", "Colors": "Blue/White", "Tree": "Order", "Talent Name": "Chain of Command", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "White Rank 3; Lawkeeper's Eye", "Description": "Choose up to 3 allies in Attunement Range. For the scene, when you Assist one, all designated creatures gain the benefit. Designated creatures gain +1 to tests when adjacent to another designated creature.", "Flavor Text": "Structure is strength. Alone, you are a person. Together, you are an institution.", "Tags": "sacred structure; entry"}, {"Deity": "Tessavain", "Domain": "Order", "Colors": "Blue/White", "Tree": "Order", "Talent Name": "Institutional Authority", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Presence 4; Chain of Command", "Description": "For the scene, allies in Attunement Range that can see you gain +1 to all Defenses. Bonus increases to +2 if also affected by Chain of Command.", "Flavor Text": "The institution protects its own.", "Tags": "sacred structure; fork a"}, {"Deity": "Tessavain", "Domain": "Order", "Colors": "Blue/White", "Tree": "Order", "Talent Name": "Collective Discipline", "Action Type": "Active (Reaction)", "Cost": "2 Investiture", "Prerequisites": "White Rank 4; Chain of Command", "Description": "When an ally in Attunement Range would fail a Cognitive test, use Reaction: it uses your Willpower modifier instead. Usable Presence times per scene.", "Flavor Text": "Your discipline is my discipline. The chain holds.", "Tags": "sacred structure; fork b"}, {"Deity": "Tessavain", "Domain": "Order", "Colors": "Blue/White", "Tree": "Order", "Talent Name": "Sacred Oath", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Blue Rank 3; White Rank 3; Lawkeeper's Eye", "Description": "You and a willing creature in touch range swear a Sacred Oath (defined at casting). For the scene, both gain +1 to all tests while pursuing the oath's goal. Acting against the oath deals [Die] x 2 Spirit damage and ends it.", "Flavor Text": "Speak the words. Mean them. The Covenant is listening.", "Tags": "covenant; entry"}, {"Deity": "Tessavain", "Domain": "Order", "Colors": "Blue/White", "Tree": "Order", "Talent Name": "Divine Judgment", "Action Type": "Active (Scene)", "Cost": "5 Investiture", "Prerequisites": "Blue Rank 4; White Rank 4; Sacred Oath", "Description": "Choose a creature in range that has broken an oath, lied to you, or violated a declared law. For the scene: Disadvantage on all tests, -2 Defenses, cannot benefit from magical healing. Ends if creature publicly confesses and accepts your penalty.", "Flavor Text": "The court has reached its verdict.", "Tags": "covenant; fork a"}, {"Deity": "Tessavain", "Domain": "Order", "Colors": "Blue/White", "Tree": "Order", "Talent Name": "Unbreakable Pact", "Action Type": "2 Actions", "Cost": "4 Investiture", "Prerequisites": "Willpower 4, Presence 3; Sacred Oath", "Description": "Upgrade an existing Sacred Oath. Both oath-sworn share telepathic link, can spend each other's Investiture (with permission). When one drops to 0 HP, the other takes a free turn. Cannot be broken except by mutual consent.", "Flavor Text": "This bond will outlast us both.", "Tags": "covenant; fork b"}, {"Deity": "Gnothis", "Domain": "Knowledge", "Colors": "Green/Red", "Tree": "Knowledge", "Talent Name": "Seeker's Flame", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Green Rank 2; Red Rank 2", "Description": "The first time each scene you attempt something you've never done before (GM discretion), gain Advantage. You can sense when a creature or object in Attunement Range is concealing information.", "Flavor Text": "The Ember Sage lit the first fire by asking 'what if I touch it?'", "Tags": "base; root"}, {"Deity": "Gnothis", "Domain": "Knowledge", "Colors": "Green/Red", "Tree": "Knowledge", "Talent Name": "Pattern Recognition", "Action Type": "1 Action", "Cost": "1 Investiture", "Prerequisites": "Green Rank 3; Seeker's Flame", "Description": "After observing a creature for 1 round, learn one (your choice): highest stat, most damaging attack, or one vulnerability/resistance. Each subsequent round reveals an additional fact.", "Flavor Text": "Watch long enough and everything tells you what it is.", "Tags": "instinctual knowledge; entry"}, {"Deity": "Gnothis", "Domain": "Knowledge", "Colors": "Green/Red", "Tree": "Knowledge", "Talent Name": "Predator's Taxonomy", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Awareness 4; Pattern Recognition", "Description": "After using Pattern Recognition on a creature, for the scene: you and allies in Attunement Range gain +1 to attacks vs that creature. First hit each round deals bonus damage equal to Awareness.", "Flavor Text": "I've classified you. Now I can unmake you.", "Tags": "instinctual knowledge; fork a"}, {"Deity": "Gnothis", "Domain": "Knowledge", "Colors": "Green/Red", "Tree": "Knowledge", "Talent Name": "Environmental Reading", "Action Type": "1 Action", "Cost": "1 Investiture", "Prerequisites": "Green Rank 4; Pattern Recognition", "Description": "Sense ecological history of current location. Learn: creatures that passed through in last 24 hours, environmental hazards within 120 ft, hidden passages/traps/buried objects within 60 ft.", "Flavor Text": "The land remembers everything. You just have to speak its language.", "Tags": "instinctual knowledge; fork b"}, {"Deity": "Gnothis", "Domain": "Knowledge", "Colors": "Green/Red", "Tree": "Knowledge", "Talent Name": "Reckless Experiment", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Red Rank 3; Seeker's Flame", "Description": "Declare a hypothesis about a creature/situation. Act to test it. If correct, Advantage on all related tests for the scene. If wrong, take [Die] damage but learn the correct answer.", "Flavor Text": "Wrong answers teach faster than right ones.", "Tags": "trial by fire; entry"}, {"Deity": "Gnothis", "Domain": "Knowledge", "Colors": "Green/Red", "Tree": "Knowledge", "Talent Name": "Trial and Error", "Action Type": "1 Action", "Cost": "1 Investiture", "Prerequisites": "Speed 3; Reckless Experiment", "Description": "When you fail a test, gain cumulative +1 to that type of test for the scene (max +3). Bonus resets on success.", "Flavor Text": "Failure is data. I collect a lot of data.", "Tags": "trial by fire; fork a"}, {"Deity": "Gnothis", "Domain": "Knowledge", "Colors": "Green/Red", "Tree": "Knowledge", "Talent Name": "Passionate Breakthrough", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Red Rank 4; Reckless Experiment", "Description": "Once per scene, on a critical hit or critical success: regain 2 Investiture, Advantage on next two tests, and learn one secret about the target or situation (GM provides significant hidden information).", "Flavor Text": "THAT'S what it does. I knew it. I KNEW it.", "Tags": "trial by fire; fork b"}, {"Deity": "Gnothis", "Domain": "Knowledge", "Colors": "Green/Red", "Tree": "Knowledge", "Talent Name": "Shared Revelation", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Green Rank 3; Red Rank 3; Seeker's Flame", "Description": "Share something learned through Pattern Recognition, Reckless Experiment, or similar. Up to 3 allies in Attunement Range gain the same knowledge and associated mechanical benefits for the scene.", "Flavor Text": "Listen. I figured it out. And now so have you.", "Tags": "ember; entry"}, {"Deity": "Gnothis", "Domain": "Knowledge", "Colors": "Green/Red", "Tree": "Knowledge", "Talent Name": "The Eureka Moment", "Action Type": "Active (Scene)", "Cost": "5 Investiture", "Prerequisites": "Red Rank 4; Intellect 3; Shared Revelation", "Description": "For the scene, whenever you or an ally in Attunement Range learns new information (talents, tests, observation), all allies in range heal 1 HP and gain +1 to next test.", "Flavor Text": "Every answer is a flame. The Ember Sage burns brightest in a room full of questions.", "Tags": "ember; fork a"}, {"Deity": "Gnothis", "Domain": "Knowledge", "Colors": "Green/Red", "Tree": "Knowledge", "Talent Name": "Forbidden Knowledge", "Action Type": "2 Actions", "Cost": "4 Investiture", "Prerequisites": "Green Rank 4; Willpower 3; Shared Revelation", "Description": "Ask the GM one question about the current scene, encounter, or creature. The GM must answer truthfully and completely. You take Spirit damage equal to [Die] (cannot be reduced or prevented). Knowledge is permanent.", "Flavor Text": "Some things cost. I'm paying.", "Tags": "ember; fork b"}, {"Deity": "Olvarra", "Domain": "Fate", "Colors": "Green/White", "Tree": "Fate", "Talent Name": "Thread Sight", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Green Rank 2; White Rank 2", "Description": "At the start of each scene, the GM privately tells you one true statement about what will happen during this scene (vague but accurate). You cannot be Surprised.", "Flavor Text": "The threads are fraying. But they still tell stories.", "Tags": "base; root"}, {"Deity": "Olvarra", "Domain": "Fate", "Colors": "Green/White", "Tree": "Fate", "Talent Name": "Read the Threads", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Green Rank 3; Thread Sight", "Description": "Choose a creature in Attunement Range. Glimpse its immediate future: know what action it intends next turn. Gain +2 to Defenses against that creature until end of your next turn.", "Flavor Text": "I saw this coming. I always see it coming.", "Tags": "natural patterns; entry"}, {"Deity": "Olvarra", "Domain": "Fate", "Colors": "Green/White", "Tree": "Fate", "Talent Name": "Inevitable Outcome", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Awareness 4; Read the Threads", "Description": "After you or an ally in Attunement Range makes a test (before GM announces result), declare success. Costs 1 Focus in addition to Investiture. Once per scene.", "Flavor Text": "That was always going to happen.", "Tags": "natural patterns; fork a"}, {"Deity": "Olvarra", "Domain": "Fate", "Colors": "Green/White", "Tree": "Fate", "Talent Name": "Prescient Dodge", "Action Type": "Passive (Reaction)", "Cost": "1 Investiture", "Prerequisites": "Green Rank 4; Read the Threads", "Description": "When hit by a creature you've used Read the Threads on, spend 1 Investiture to reduce damage by [Die] + Awareness. If reduced to 0, move 5 ft without provoking.", "Flavor Text": "I was never standing there.", "Tags": "natural patterns; fork b"}, {"Deity": "Olvarra", "Domain": "Fate", "Colors": "Green/White", "Tree": "Fate", "Talent Name": "Prophecy of Order", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "White Rank 3; Thread Sight", "Description": "Declare a prediction about the scene. If it comes true, all allies who heard it gain Advantage on next test and heal Tier HP. If it fails, you lose 1 Focus.", "Flavor Text": "I have spoken. The threads will comply.", "Tags": "structural foresight; entry"}, {"Deity": "Olvarra", "Domain": "Fate", "Colors": "Green/White", "Tree": "Fate", "Talent Name": "Ordained Formation", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "White Rank 4; Prophecy of Order", "Description": "Designate up to 4 specific spaces in Attunement Range. Allies in those positions gain +1 to all Defenses and +1 to attack tests. Lasts for scene or until ally moves away.", "Flavor Text": "Stand here. Not there. Here. Trust the pattern.", "Tags": "structural foresight; fork a"}, {"Deity": "Olvarra", "Domain": "Fate", "Colors": "Green/White", "Tree": "Fate", "Talent Name": "Fate's Shield", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Presence 3; Prophecy of Order", "Description": "Choose an ally in Attunement Range. Next time it takes damage this scene, reduce by [Die] + Presence. If source was predicted by Thread Sight, reduce by additional [Die].", "Flavor Text": "I saw this blow before it was thrown. It was never going to land.", "Tags": "structural foresight; fork b"}, {"Deity": "Olvarra", "Domain": "Fate", "Colors": "Green/White", "Tree": "Fate", "Talent Name": "Weave the Thread", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Green Rank 3; White Rank 3; Thread Sight", "Description": "Choose two willing creatures in Attunement Range. Fates linked for scene: when one takes damage, other may take up to half instead. When one is healed, other heals half the amount.", "Flavor Text": "Your threads are intertwined now. What happens to one happens to both.", "Tags": "loom; entry"}, {"Deity": "Olvarra", "Domain": "Fate", "Colors": "Green/White", "Tree": "Fate", "Talent Name": "Rewrite Fate", "Action Type": "Active (Scene)", "Cost": "5 Investiture", "Prerequisites": "Green Rank 4; White Rank 4; Weave the Thread", "Description": "Once this scene, after any die roll by any creature in Attunement Range, replace the result with any value from 1 to die maximum. The roller is unaware fate intervened.", "Flavor Text": "The Loom was broken. I'm mending it by hand.", "Tags": "loom; fork a"}, {"Deity": "Olvarra", "Domain": "Fate", "Colors": "Green/White", "Tree": "Fate", "Talent Name": "Thread of Inevitability", "Action Type": "2 Actions", "Cost": "4 Investiture", "Prerequisites": "Willpower 4, Awareness 3; Weave the Thread", "Description": "Choose a creature in Attunement Range. Declare one thing that WILL happen to it this scene. The first time it could naturally occur, it automatically succeeds (no test). Wasted if it never naturally occurs.", "Flavor Text": "I didn't make it happen. I simply ensured it would.", "Tags": "loom; fork b"}, {"Deity": "Kethane", "Domain": "Civilization", "Colors": "Red/White", "Tree": "Civilization", "Talent Name": "Builder's Oath", "Action Type": "Passive", "Cost": "—", "Prerequisites": "Red Rank 2; White Rank 2", "Description": "Repair mundane objects by touch (1 min per repair). Deal double damage to structures/constructs. Allies in Attunement Range gain +1 HP when completing a short rest.", "Flavor Text": "The Hearthwright builds in the rain because the city needs walls by morning.", "Tags": "base; root"}, {"Deity": "Kethane", "Domain": "Civilization", "Colors": "Red/White", "Tree": "Civilization", "Talent Name": "Emergency Repairs", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Red Rank 3; Builder's Oath", "Description": "Touch an object, weapon, or armor — fully repaired. If on creature wearing damaged armor, Deflect restored to max. Alternatively, create a temporary weapon/tool from materials (1 hour, standard weapon of choice).", "Flavor Text": "Hand me that. I'll have it fixed before the next wave.", "Tags": "the forge; entry"}, {"Deity": "Kethane", "Domain": "Civilization", "Colors": "Red/White", "Tree": "Civilization", "Talent Name": "Forge of Will", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Strength 3; Emergency Repairs", "Description": "Create a temporary fortification in 10 ft area within touch range: barricade, wall, or bridge. HP equal to [Die] x 3 + Strength x 2, provides full cover. Lasts for scene.", "Flavor Text": "I don't need a quarry. I need ten minutes and something to be angry about.", "Tags": "the forge; fork a"}, {"Deity": "Kethane", "Domain": "Civilization", "Colors": "Red/White", "Tree": "Civilization", "Talent Name": "Tempered Edge", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Red Rank 4; Emergency Repairs", "Description": "Touch a weapon (yours or ally's). For scene, deals bonus Energy damage equal to Tier and counts as magical. Crits deal additional [Die] Energy.", "Flavor Text": "The forge-fire burns hot enough when the builder cares enough.", "Tags": "the forge; fork b"}, {"Deity": "Kethane", "Domain": "Civilization", "Colors": "Red/White", "Tree": "Civilization", "Talent Name": "Fortify Position", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "White Rank 3; Builder's Oath", "Description": "15 ft radius area in Attunement Range. For scene, allies gain +1 Physical Defense. Enemies treat area as difficult terrain. Area visually marked (glowing foundation lines).", "Flavor Text": "This ground is claimed. This ground is held.", "Tags": "the foundation; entry"}, {"Deity": "Kethane", "Domain": "Civilization", "Colors": "Red/White", "Tree": "Civilization", "Talent Name": "Siege Ward", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "White Rank 4; Fortify Position", "Description": "Fortified Position enhanced: objects/structures in area have double HP. Ranged attacks targeting creatures in area have Disadvantage. Physical Defense bonus increases to +2.", "Flavor Text": "Let them come. The walls will hold.", "Tags": "the foundation; fork a"}, {"Deity": "Kethane", "Domain": "Civilization", "Colors": "Red/White", "Tree": "Civilization", "Talent Name": "Infrastructure", "Action Type": "1 Action", "Cost": "2 Investiture", "Prerequisites": "Presence 3; Fortify Position", "Description": "While in Fortified Position, allies that Draw Mana regain +1 Investiture. Allies using Recover action regain additional HP equal to your Presence.", "Flavor Text": "A city with good infrastructure makes everything easier.", "Tags": "the foundation; fork b"}, {"Deity": "Kethane", "Domain": "Civilization", "Colors": "Red/White", "Tree": "Civilization", "Talent Name": "Hearthfire", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Red Rank 3; White Rank 3; Builder's Oath", "Description": "Create a Hearthfire at a point in touch range. For scene, allies within 15 ft gain +1 to Willpower tests. Adjacent allies may spend 1 Action to regain [Die] HP. Extinguished by 10+ Energy damage.", "Flavor Text": "Come to the fire. The city starts here.", "Tags": "hearth; entry"}, {"Deity": "Kethane", "Domain": "Civilization", "Colors": "Red/White", "Tree": "Civilization", "Talent Name": "Bonds of Community", "Action Type": "Active (Scene)", "Cost": "5 Investiture", "Prerequisites": "Red Rank 4; White Rank 4; Hearthfire", "Description": "For scene, allies in Attunement Range are 'citizens.' Citizens use Help at 30 ft range. When a citizen drops to 0 HP, all others gain Tier temporary HP and Advantage on next test.", "Flavor Text": "We are more than individuals. We are a city.", "Tags": "hearth; fork a"}, {"Deity": "Kethane", "Domain": "Civilization", "Colors": "Red/White", "Tree": "Civilization", "Talent Name": "Trade Routes", "Action Type": "2 Actions", "Cost": "3 Investiture", "Prerequisites": "Presence 4, Awareness 3; Hearthfire", "Description": "Establish a route between two points in Attunement Range (max 60 ft apart). For scene, allies teleport between points as free action once per turn. Items passed instantaneously.", "Flavor Text": "Civilization is connection. The road matters more than the wall.", "Tags": "hearth; fork b"}],

<!-- Layout engine -->
<script>
// Sugiyama-style layered layout for normalized talents.
// Exports window.Layout = { layoutTree, splitPrereqs }

function splitPrereqs(s) {
  if (!s || s === '—' || s === '-') return [];
  return s.split(/,|;|\sand\s|\sor\s/).map(x => x.trim()).filter(Boolean);
}

function layoutTree(talents) {
  const N = talents.length;
  const nameIdx = {};
  talents.forEach((t, i) => { nameIdx[t.name.toLowerCase()] = i; });

  const prereqs = talents.map(t => {
    const raw = splitPrereqs(t.prereqs);
    return raw
      .map(p => nameIdx[p.toLowerCase()])
      .filter(x => x !== undefined);
  });

  // Depth via memoized DFS, cycle-safe.
  const depth = new Array(N).fill(-1);
  function computeDepth(i, stack) {
    if (depth[i] !== -1) return depth[i];
    if (stack.has(i)) return 0;
    stack.add(i);
    if (prereqs[i].length === 0) { depth[i] = 0; stack.delete(i); return 0; }
    const dd = 1 + Math.max(...prereqs[i].map(p => computeDepth(p, stack)));
    depth[i] = dd;
    stack.delete(i);
    return dd;
  }
  for (let i = 0; i < N; i++) computeDepth(i, new Set());

  // Group by depth
  const maxDepth = Math.max(0, ...depth);
  const byDepth = [];
  for (let d = 0; d <= maxDepth; d++) byDepth.push([]);
  depth.forEach((d, i) => byDepth[d].push(i));

  // Children lookup
  const children = talents.map(() => []);
  prereqs.forEach((ps, i) => ps.forEach(p => children[p].push(i)));

  // Initial order within each layer: by index
  let order = byDepth.map(row => row.slice());

  // Assign x-positions (evenly spaced) given current order
  function xOf(row, n) {
    return row.map((_, idx) => n === 1 ? 0.5 : (idx + 0.5) / n);
  }

  // Sugiyama: iteratively reorder using barycenter of neighbors.
  // Sweep down (use parents), sweep up (use children), alternate.
  const ITERATIONS = 24;
  for (let iter = 0; iter < ITERATIONS; iter++) {
    const downPass = iter % 2 === 0;
    if (downPass) {
      for (let d = 1; d <= maxDepth; d++) {
        const prevRow = order[d - 1];
        const prevPos = {};
        prevRow.forEach((node, k) => { prevPos[node] = k; });
        const row = order[d];
        row.sort((a, b) => bary(a) - bary(b));
        function bary(node) {
          const ps = prereqs[node];
          if (!ps.length) return row.indexOf(node);
          const ks = ps.map(p => prevPos[p]).filter(k => k !== undefined);
          if (!ks.length) return row.indexOf(node);
          return ks.reduce((s, k) => s + k, 0) / ks.length;
        }
      }
    } else {
      for (let d = maxDepth - 1; d >= 0; d--) {
        const nextRow = order[d + 1];
        const nextPos = {};
        nextRow.forEach((node, k) => { nextPos[node] = k; });
        const row = order[d];
        row.sort((a, b) => bary(a) - bary(b));
        function bary(node) {
          const cs = children[node];
          if (!cs.length) return row.indexOf(node);
          const ks = cs.map(c => nextPos[c]).filter(k => k !== undefined);
          if (!ks.length) return row.indexOf(node);
          return ks.reduce((s, k) => s + k, 0) / ks.length;
        }
      }
    }
  }

  // Final x: evenly distribute each layer
  const pos = new Array(N);
  for (let d = 0; d <= maxDepth; d++) {
    const row = order[d];
    const n = row.length;
    row.forEach((node, idx) => {
      const x = n === 1 ? 0.5 : (idx + 1) / (n + 1);
      const y = maxDepth === 0 ? 0.5 : d / maxDepth;
      pos[node] = { x, y };
    });
  }

  return {
    positions: pos,
    depth,
    maxDepth,
    prereqs,
    children,
    edges: prereqs.flatMap((ps, i) => ps.map(p => [p, i])),
  };
}

window.Layout = { layoutTree, splitPrereqs };

</script>

<script>
/* Dataset normalizer — turns the 4 datasets into a unified atlas structure.
   Each tree = { atlas, color, group, name, subtitle, talents[], prereqKey }
   Each talent has normalized field names: name, action, cost, prereqs, description, flavor, tags, sourceAtlas
*/

const HEROIC_PATHS = ['Agent', 'Envoy', 'Hunter', 'Leader', 'Scholar', 'Warrior'];
const RADIANT_ORDERS = ['Dustbringer','Edgedancer','Elsecaller','Lightweaver','Skybreaker','Stoneward','Truthwatcher','Willshaper','Windrunner'];

// Color mapping for Heroic/Radiant/Deity (for theming)
const HEROIC_COLOR = {
  Agent: 'blue', Envoy: 'white', Hunter: 'green',
  Leader: 'white', Scholar: 'blue', Warrior: 'red',
};
const RADIANT_COLOR = {
  Dustbringer: 'red', Edgedancer: 'green', Elsecaller: 'blue',
  Lightweaver: 'white', Skybreaker: 'black', Stoneward: 'green',
  Truthwatcher: 'blue', Willshaper: 'red', Windrunner: 'white',
};
// Deity: use first color from 'Colors' field as theme color, default white
function deityColor(colorsStr) {
  if (!colorsStr) return 'white';
  const c = colorsStr.split(/[\/,]/)[0].trim().toLowerCase();
  if (['white','blue','black','red','green'].includes(c)) return c;
  return 'white';
}

function normalizeTalent(raw, atlas, extra = {}) {
  return {
    name:        raw['Talent Name'] || raw.Name,
    action:      raw['Action Type'] || raw.Action || '',
    cost:        raw.Cost || '—',
    prereqs:     raw.Prerequisites || '',
    description: raw.Description || '',
    flavor:      raw['Flavor Text'] || '',
    tags:        raw.Tags || '',
    atlas,
    ...extra,
  };
}

function normalizeLeyline(leyline) {
  const trees = [];
  const colors = ['White','Blue','Black','Red','Green'];
  const treeNames = ['Attunement','Physical','Cognitive'];
  for (const color of colors) {
    for (const tn of treeNames) {
      const rows = leyline.filter(t => t.Color === color && t.Tree === tn);
      trees.push({
        id: `leyline/${color}/${tn}`,
        atlas: 'leyline',
        color: color.toLowerCase(),
        group: color,      // e.g. "White"
        groupLabel: `${color} Leyline`,
        name: tn,          // "Attunement"
        fullName: `${color} ${tn}`,
        talents: rows.map(r => normalizeTalent(r, 'leyline', {
          color: color.toLowerCase(),
          group: color,
          tree: tn,
        })),
      });
    }
  }
  return trees;
}

function normalizeHeroic(cosmere) {
  const trees = [];
  // Filter to heroic paths (cosmere rows with Path in HEROIC_PATHS)
  const byPath = {};
  for (const r of cosmere) {
    if (!HEROIC_PATHS.includes(r.Path)) continue;
    (byPath[r.Path] = byPath[r.Path] || []).push(r);
  }
  for (const path of HEROIC_PATHS) {
    const rows = byPath[path] || [];
    const keyTalent = rows.find(r => r.Specialty === 'Key');
    const specialties = [...new Set(rows.filter(r => r.Specialty !== 'Key').map(r => r.Specialty))];
    for (const spec of specialties) {
      const specRows = rows.filter(r => r.Specialty === spec);
      // Include Key as root of each specialty tree (so prereq chains work)
      const allRows = keyTalent ? [keyTalent, ...specRows] : specRows;
      trees.push({
        id: `heroic/${path}/${spec}`,
        atlas: 'heroic',
        color: HEROIC_COLOR[path] || 'white',
        group: path,
        groupLabel: `${path} Path`,
        name: spec,
        fullName: `${path} · ${spec}`,
        talents: allRows.map(r => normalizeTalent(r, 'heroic', {
          color: HEROIC_COLOR[path] || 'white',
          group: path,
          tree: spec,
        })),
      });
    }
  }
  return trees;
}

function normalizeRadiant(cosmere) {
  const trees = [];
  const byPath = {};
  for (const r of cosmere) {
    if (!RADIANT_ORDERS.includes(r.Path)) continue;
    (byPath[r.Path] = byPath[r.Path] || []).push(r);
  }
  for (const order of RADIANT_ORDERS) {
    const rows = byPath[order] || [];
    const keyTalent = rows.find(r => r.Specialty === 'Key');
    const specialties = [...new Set(rows.filter(r => r.Specialty !== 'Key').map(r => r.Specialty))];
    for (const spec of specialties) {
      const specRows = rows.filter(r => r.Specialty === spec);
      const allRows = keyTalent ? [keyTalent, ...specRows] : specRows;
      trees.push({
        id: `radiant/${order}/${spec}`,
        atlas: 'radiant',
        color: RADIANT_COLOR[order] || 'white',
        group: order,
        groupLabel: `${order} Radiants`,
        name: spec,
        fullName: `${order} · ${spec}`,
        talents: allRows.map(r => normalizeTalent(r, 'radiant', {
          color: RADIANT_COLOR[order] || 'white',
          group: order,
          tree: spec,
        })),
      });
    }
  }
  return trees;
}

function normalizeDeity(domain) {
  const trees = [];
  const byDeity = {};
  for (const r of domain) {
    (byDeity[r.Deity] = byDeity[r.Deity] || []).push(r);
  }
  for (const deity of Object.keys(byDeity).sort()) {
    const rows = byDeity[deity];
    const domainName = rows[0].Domain;
    const colorsStr = rows[0].Colors;
    const color = deityColor(colorsStr);
    const treeNames = [...new Set(rows.map(r => r.Tree))];
    for (const tn of treeNames) {
      const tr = rows.filter(r => r.Tree === tn);
      trees.push({
        id: `deity/${deity}/${tn}`,
        atlas: 'deity',
        color,
        colorsStr,         // "Blue/Green" — for displaying dual-color badge
        group: deity,
        groupLabel: `${deity} · ${domainName}`,
        domain: domainName,
        name: tn,
        fullName: `${deity} · ${tn}`,
        talents: tr.map(r => normalizeTalent(r, 'deity', {
          color,
          group: deity,
          domain: domainName,
          colorsStr,
          tree: tn,
        })),
      });
    }
  }
  return trees;
}

function buildAtlases({ leyline, cosmere, domain }) {
  const leylineTrees = normalizeLeyline(leyline);
  const heroicTrees = normalizeHeroic(cosmere);
  const radiantTrees = normalizeRadiant(cosmere);
  const deityTrees = normalizeDeity(domain);
  return {
    leyline:  { id: 'leyline',  name: 'Leyline',  subtitle: 'Mortal arcana — five colors of the ley',             trees: leylineTrees },
    heroic:   { id: 'heroic',   name: 'Heroic',   subtitle: 'Skilled practitioners — six paths of mundane mastery', trees: heroicTrees },
    radiant:  { id: 'radiant',  name: 'Radiant',  subtitle: 'Sworn to spren — nine orders of surgebinding',          trees: radiantTrees },
    deity:    { id: 'deity',    name: 'Deity',    subtitle: 'Divine dominion — ten deities, thirty domains',          trees: deityTrees },
  };
}

window.Atlases = { buildAtlases, HEROIC_PATHS, RADIANT_ORDERS, HEROIC_COLOR, RADIANT_COLOR };

</script>

function classifyCost(cost) {
  if (!cost || cost === '—' || cost === '-' || cost.toLowerCase() === 'none') return ['free'];
  const c = cost.toLowerCase();
  const out = [];
  if (c.includes('investiture')) out.push('investiture');
  if (c.includes('focus')) out.push('focus');
  if (c.includes('hp') || c.includes('lose hp') || c.includes('health')) out.push('hp');
  if (c.includes('opportunity')) out.push('opportunity');
  if (!out.length) out.push('other');
  return out;
}
