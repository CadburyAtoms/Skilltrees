<!-- TreeView (Fix 2: onConnChange; Fix 3: cycle block) -->
<script type="text/babel">
/* TreeView — normalized talent shape + drag-to-reposition edit mode */

const { useMemo: useM_tv, useState: useS_tv, useRef: useR_tv, useEffect: useE_tv, useCallback: useC_tv } = React;

function TalentIcon({ actionType, size = 28 }) {
  // Render the action glyph itself in serifed type — these are designed as icons.
  // Backwards compat: if a legacy text label slips through, map to a glyph.
  const map = {
    'passive': '∞', 'reaction': '★', 'special': '★', 'recurring': '⟲',
    'free action': '◇', '1 action': '▶', '2 actions': '▶▶', '3 actions': '▶▶▶',
  };
  const raw = (actionType || '').trim();
  const glyph = map[raw.toLowerCase()] || raw || '∞';
  const fontSize = glyph.length >= 3 ? size * 0.55 : (glyph.length === 2 ? size * 0.7 : size * 0.95);
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      width: size, height: size, fontSize, lineHeight: 1, fontFamily: 'serif',
      letterSpacing: glyph.length > 1 ? '-0.05em' : 0,
    }}>{glyph}</span>
  );
}

// Snap to a 5% grid (light)
const SNAP = 0.025;
function snap(v) { return Math.round(v / SNAP) * SNAP; }

function loadOverrides(treeId) {
  try { return JSON.parse(localStorage.getItem(`skilltrees:layout:${treeId}`) || '{}'); }
  catch { return {}; }
}
function saveOverrides(treeId, obj) {
  localStorage.setItem(`skilltrees:layout:${treeId}`, JSON.stringify(obj));
}

// Connection overrides: array of [srcTid, tgtTid] pairs. When present, REPLACES original prereqs.
// Legacy form was [srcIdx, tgtIdx] — auto-migrated below.
function loadConnections(treeId) {
  try {
    const raw = localStorage.getItem(`skilltrees:conns:${treeId}`);
    return raw ? JSON.parse(raw) : null; // null = use original
  } catch { return null; }
}
function saveConnections(treeId, arr) {
  if (arr == null) localStorage.removeItem(`skilltrees:conns:${treeId}`);
  else localStorage.setItem(`skilltrees:conns:${treeId}`, JSON.stringify(arr));
}

// One-time migration: rewrite legacy name-keyed / index-based edits under tids.
// Idempotent. Skips if a `__tidsv` marker is present in each store.
window.migrateEditsToTids = function(treeId, talents) {
  if (!talents || !talents.length) return;
  const nameToTid = {};
  for (const t of talents) if (t.tid) nameToTid[t.name] = t.tid;

  // 1. Layout overrides: { name|tid: {x,y} } → { tid: {x,y} }
  try {
    const raw = localStorage.getItem(`skilltrees:layout:${treeId}`);
    if (raw) {
      const obj = JSON.parse(raw);
      if (!obj.__tidsv) {
        const next = { __tidsv: 1 };
        for (const [k, v] of Object.entries(obj)) {
          if (k === '__tidsv') continue;
          // already a tid? keep
          if (/^[a-z]{3}\d{3}$/.test(k)) next[k] = v;
          else if (nameToTid[k]) next[nameToTid[k]] = v;
          // else: orphaned; drop silently
        }
        localStorage.setItem(`skilltrees:layout:${treeId}`, JSON.stringify(next));
      }
    }
  } catch {}

  // 2. Connections: [[srcIdx, tgtIdx], ...] OR [[srcTid, tgtTid], ...]
  try {
    const raw = localStorage.getItem(`skilltrees:conns:${treeId}`);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length) {
        const isTid = typeof arr[0][0] === 'string' && /^[a-z]{3}\d{3}$/.test(arr[0][0]);
        if (!isTid && typeof arr[0][0] === 'number') {
          // index-based legacy: convert via current talent order (best effort)
          const next = arr
            .map(([s, t]) => [talents[s] && talents[s].tid, talents[t] && talents[t].tid])
            .filter(([s, t]) => s && t);
          localStorage.setItem(`skilltrees:conns:${treeId}`, JSON.stringify(next));
        }
      }
    }
  } catch {}

  // 3. Talent edits: { name: {patch} } → { tid: {patch} }
  try {
    const raw = localStorage.getItem(`skilltrees:talents:${treeId}`);
    if (raw) {
      const obj = JSON.parse(raw);
      if (!obj.__tidsv) {
        const next = { __tidsv: 1 };
        for (const [k, v] of Object.entries(obj)) {
          if (k === '__tidsv') continue;
          if (k.startsWith('__new__')) { next[k] = v; continue; } // new talents stay as __new__-time keys
          if (/^[a-z]{3}\d{3}$/.test(k)) next[k] = v;
          else if (nameToTid[k]) next[nameToTid[k]] = v;
          else next['__orphan__' + k] = v; // preserve orphaned edits so they're not lost
        }
        localStorage.setItem(`skilltrees:talents:${treeId}`, JSON.stringify(next));
      }
    }
  } catch {}
};

// Detect cycle after adding edge src -> tgt in current graph
function wouldCreateCycle(edges, src, tgt, N) {
  // BFS from tgt; if we can reach src, adding src->tgt creates a cycle
  const adj = Array.from({ length: N }, () => []);
  for (const [p, c] of edges) adj[p].push(c);
  adj[src].push(tgt); // hypothetical
  const seen = new Set([tgt]);
  const stack = [tgt];
  while (stack.length) {
    const n = stack.pop();
    if (n === src) return true;
    for (const m of adj[n]) if (!seen.has(m)) { seen.add(m); stack.push(m); }
  }
  return false;
}

function TreeView({ tree, selected, onSelect, allocated, allocationMode, onAllocate, editMode, onResetLayout, onResetConnections, onExport, onConnChange, connectMode, onConnectComplete }) {
  const talents = tree.talents;
  const layout = useM_tv(() => window.Layout.layoutTree(talents), [talents]);
  const wrapRef = useR_tv(null);
  const svgRef = useR_tv(null);
  const [dims, setDims] = useS_tv({ w: 720, h: 540 });
  // Layout overrides: stored by tid; in-state we keep the same shape (tid -> {x,y})
  const [overrides, setOverrides] = useS_tv(() => loadOverrides(tree.id));
  const [dragIdx, setDragIdx] = useS_tv(null);
  // Connections: null = use layout's prereq edges; else array of [srcTid,tgtTid] pairs.
  // We resolve to indices for rendering via tidToIdx below.
  const [connOverride, setConnOverride] = useS_tv(() => loadConnections(tree.id));
  const [selectedEdge, setSelectedEdge] = useS_tv(null); // "src->tgt" of edge selected for deletion (indices)
  const [cycleWarn, setCycleWarn] = useS_tv(null);

  // Reload overrides when tree changes
  useE_tv(() => {
    setOverrides(loadOverrides(tree.id));
    setConnOverride(loadConnections(tree.id));
    setDragIdx(null); setSelectedEdge(null); setCycleWarn(null);
  }, [tree.id]);

  // tid <-> index helpers
  const tidToIdx = useM_tv(() => {
    const m = {};
    talents.forEach((t, i) => { if (t.tid) m[t.tid] = i; });
    return m;
  }, [talents]);
  const connectSourceIdx = (connectMode && connectMode.sourceTid != null) ? tidToIdx[connectMode.sourceTid] : null;
  const connectSource = (connectSourceIdx != null) ? connectSourceIdx : null;

  // Expose reset via ref
  useE_tv(() => {
    if (onResetLayout) onResetLayout.current = () => {
      setOverrides({});
      localStorage.removeItem(`skilltrees:layout:${tree.id}`);
    };
  }, [tree.id, onResetLayout]);
  useE_tv(() => {
    if (onResetConnections) onResetConnections.current = () => {
      setConnOverride(null);
      saveConnections(tree.id, null);
      setSelectedEdge(null);
    };
  }, [tree.id, onResetConnections]);
  useE_tv(() => {
    if (onExport) onExport.current = () => {
      const effEdgesRaw = connOverride != null
        ? connOverride
            .map(([s, t]) => [tidToIdx[s], tidToIdx[t]])
            .filter(([s, t]) => s != null && t != null)
        : layout.edges;
      const positions = {};
      talents.forEach((t, i) => {
        const p = (t.tid && overrides[t.tid]) || layout.positions[i];
        positions[t.name] = { x: +p.x.toFixed(4), y: +p.y.toFixed(4) };
      });
      return {
        tree: { id: tree.id, name: tree.fullName || tree.name, atlas: tree.atlas, group: tree.group, color: tree.color },
        talents: talents.map(t => ({
          tid: t.tid,
          name: t.name,
          action: t.action,
          cost: t.cost,
          description: t.description,
          flavor: t.flavor,
          tags: t.tags,
        })),
        connections: effEdgesRaw.map(([s, t]) => ({ prereq: talents[s] && talents[s].name, talent: talents[t] && talents[t].name })),
        positions,
      };
    };
  }, [tree, talents, layout, connOverride, overrides, onExport, tidToIdx]);

  useE_tv(() => {
    const el = wrapRef.current;
    if (!el) return;
    const ro = new ResizeObserver(() => {
      setDims({ w: el.clientWidth, h: el.clientHeight });
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // Delete key removes selected edge
  useE_tv(() => {
    if (!editMode || !selectedEdge) return;
    function onKey(e) {
      if (e.key === 'Delete' || e.key === 'Backspace') {
        removeEdge(selectedEdge);
      } else if (e.key === 'Escape') {
        setSelectedEdge(null);
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [editMode, selectedEdge]);

  // Esc cancels connect mode
  useE_tv(() => {
    if (!connectMode) return;
    function onKey(e) {
      if (e.key === 'Escape' && onConnectComplete) onConnectComplete();
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [connectMode, onConnectComplete]);

  // Effective edges (resolved to indices for rendering)
  const effEdges = useM_tv(() => {
    if (connOverride != null) {
      return connOverride
        .map(([s, t]) => [tidToIdx[s], tidToIdx[t]])
        .filter(([s, t]) => s != null && t != null);
    }
    return layout.edges.slice();
  }, [connOverride, layout, tidToIdx]);

  const effPrereqs = useM_tv(() => {
    const out = talents.map(() => []);
    for (const [s, t] of effEdges) out[t].push(s);
    return out;
  }, [effEdges, talents]);

  const chain = useM_tv(() => {
    if (selected == null) return { nodes: new Set(), edges: new Set() };
    const nodes = new Set([selected]);
    const edges = new Set();
    const up = [selected];
    const seenUp = new Set([selected]);
    while (up.length) {
      const n = up.pop();
      for (const p of effPrereqs[n]) {
        edges.add(`${p}->${n}`);
        if (!seenUp.has(p)) { seenUp.add(p); nodes.add(p); up.push(p); }
      }
    }
    const down = [selected];
    const seenDn = new Set([selected]);
    while (down.length) {
      const n = down.pop();
      for (const [s, t] of effEdges) if (s === n && !seenDn.has(t)) {
        seenDn.add(t); nodes.add(t); edges.add(`${n}->${t}`); down.push(t);
      }
    }
    return { nodes, edges };
  }, [selected, effEdges, effPrereqs]);

  const pad = { top: 50, bottom: 50, left: 60, right: 60 };
  const W = dims.w, H = dims.h;
  const innerW = W - pad.left - pad.right;
  const innerH = H - pad.top - pad.bottom;
  function px(x) { return pad.left + x * innerW; }
  function py(y) { return pad.top + y * innerH; }

  const n = talents.length;
  const R = Math.max(20, Math.min(32, Math.sqrt(innerW * innerH / n) / 3.5));

  const gradId = `grad-${tree.color}-${tree.id.replace(/[^a-z0-9]/gi, '-')}`;

  // Effective position: override (keyed by tid) falls back to auto layout
  function getPos(i) {
    const t = talents[i];
    if (t && t.tid && overrides[t.tid]) return overrides[t.tid];
    return layout.positions[i];
  }

  // Convert client (pixel) coords to normalized (0..1) within inner area
  function clientToNorm(clientX, clientY) {
    const svg = svgRef.current;
    if (!svg) return null;
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const local = pt.matrixTransform(ctm.inverse()); // in viewBox coords = pixels
    const nx = (local.x - pad.left) / innerW;
    const ny = (local.y - pad.top) / innerH;
    return { x: Math.max(0, Math.min(1, nx)), y: Math.max(0, Math.min(1, ny)) };
  }

  const onPointerDown = useC_tv((e, i) => {
    if (!editMode) return;
    e.stopPropagation();
    setDragIdx(i);
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
  }, [editMode]);

  const onPointerMove = useC_tv((e) => {
    if (dragIdx == null) return;
    const n = clientToNorm(e.clientX, e.clientY);
    if (!n) return;
    const tid = talents[dragIdx] && talents[dragIdx].tid;
    if (!tid) return;
    setOverrides(prev => ({
      ...prev,
      [tid]: { x: snap(n.x), y: snap(n.y) },
    }));
  }, [dragIdx, talents]);

  const onPointerUp = useC_tv((e) => {
    if (dragIdx == null) return;
    setDragIdx(null);
    // Persist
    setOverrides(prev => {
      // strip __tidsv before saving cleanly
      const out = { __tidsv: 1 };
      for (const [k, v] of Object.entries(prev)) if (k !== '__tidsv') out[k] = v;
      saveOverrides(tree.id, out);
      return prev;
    });
  }, [dragIdx, tree.id]);

  // Current edges as array-of-arrays (for cycle check; index-form)
  function currentEdges() { return effEdges.map(e => [e[0], e[1]]); }

  // Persist current effEdges (index form) to localStorage as tid pairs
  function persistEdges(idxEdges) {
    const tidEdges = idxEdges
      .map(([s, t]) => [talents[s] && talents[s].tid, talents[t] && talents[t].tid])
      .filter(([s, t]) => s && t);
    setConnOverride(tidEdges);
    saveConnections(tree.id, tidEdges);
    if (onConnChange) onConnChange();
  }

  function addEdge(src, tgt) {
    if (src === tgt) return;
    const edges = currentEdges();
    if (edges.some(([s, t]) => s === src && t === tgt)) return; // dup
    if (wouldCreateCycle(edges, src, tgt, talents.length)) {
      setCycleWarn(`⛔ Blocked: wiring ${talents[src].name} → ${talents[tgt].name} would create a cycle.`);
      setTimeout(() => setCycleWarn(null), 4000);
      if (onConnectComplete) onConnectComplete();
      return;
    }
    persistEdges([...edges, [src, tgt]]);
  }

  function removeEdge(edgeKey) {
    const [s, t] = edgeKey.split('->').map(Number);
    persistEdges(currentEdges().filter(([a, b]) => !(a === s && b === t)));
    setSelectedEdge(null);
  }

  function handleNodeClick(i) {
    // Connect mode (driven by editor sidebar) — applies whether or not editMode is also on
    if (connectMode && connectSource != null) {
      if (i === connectSource) {
        if (onConnectComplete) onConnectComplete(); // cancel
        return;
      }
      // direction: 'addPrereq' = connectSource is the talent receiving a prereq → src=i, tgt=sourceIdx
      // 'makePrereqOf' = connectSource is the talent acting as prereq → src=sourceIdx, tgt=i
      if (connectMode.direction === 'addPrereq') {
        addEdge(i, connectSource);
      } else {
        addEdge(connectSource, i);
      }
      if (onConnectComplete) onConnectComplete();
      return;
    }
    // Otherwise: select / allocate (works in both edit and non-edit mode)
    setSelectedEdge(null);
    if (allocationMode && !editMode) { onAllocate(i); }
    else { onSelect(i === selected ? null : i); }
  }

  // Grid lines for edit mode
  const gridLines = [];
  if (editMode) {
    for (let i = 0; i <= 1 / SNAP; i++) {
      const t = i * SNAP;
      gridLines.push(['v', px(t)]);
      gridLines.push(['h', py(t)]);
    }
  }

  return (
    <div ref={wrapRef} className={`tree-svg-wrap ${editMode ? 'edit-mode' : ''}`} data-color={tree.color}>
      <svg ref={svgRef} width="100%" height="100%" viewBox={`0 0 ${W} ${H}`}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerLeave={onPointerUp}>
        <defs>
          <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" />
            <feOffset dy="1" />
            <feColorMatrix values="0 0 0 0 0.15  0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0.45 0" />
            <feBlend in2="SourceGraphic" />
          </filter>
          <radialGradient id={gradId} cx="30%" cy="30%">
            <stop offset="0%" stopColor="var(--parch-0)" />
            <stop offset="60%" stopColor="var(--accent-1)" />
            <stop offset="100%" stopColor="var(--accent-2)" />
          </radialGradient>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink-3)" strokeWidth="1" opacity="0.4" />
          </pattern>
        </defs>

        {/* Grid (edit mode) */}
        {editMode && gridLines.map(([dir, v], i) => (
          dir === 'v'
            ? <line key={`gv${i}`} x1={v} x2={v} y1={pad.top} y2={H - pad.bottom} stroke="var(--parch-4)" strokeWidth="0.5" opacity="0.35" />
            : <line key={`gh${i}`} x1={pad.left} x2={W - pad.right} y1={v} y2={v} stroke="var(--parch-4)" strokeWidth="0.5" opacity="0.35" />
        ))}

        {/* Depth guide lines (only when NOT in edit mode — they'd clash with grid) */}
        {!editMode && Array.from({ length: layout.maxDepth + 1 }).map((_, d) => {
          const y = py(d / Math.max(1, layout.maxDepth));
          return (
            <line key={d} x1={pad.left * 0.4} x2={W - pad.right * 0.4} y1={y} y2={y}
              stroke="var(--parch-4)" strokeWidth="0.5" opacity="0.3" strokeDasharray="2 4" />
          );
        })}

        {/* Edges — bezier */}
        {effEdges.map(([p, c], i) => {
          const pp = getPos(p), cp = getPos(c);
          const x1 = px(pp.x), y1 = py(pp.y);
          const x2 = px(cp.x), y2 = py(cp.y);
          const dx = x2 - x1, dy = y2 - y1;
          const vertical = Math.abs(dy) > Math.abs(dx);
          const c1x = vertical ? x1 : x1 + dx * 0.3;
          const c1y = vertical ? y1 + dy * 0.5 : y1;
          const c2x = vertical ? x2 : x2 - dx * 0.3;
          const c2y = vertical ? y2 - dy * 0.5 : y2;
          const path = `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`;
          const key = `${p}->${c}`;
          const isChain = chain.edges.has(key);
          const isEdgeSel = selectedEdge === key;
          let stroke = isChain ? 'var(--accent-2)' : 'var(--ink-3)';
          if (isEdgeSel) stroke = '#c0392b';
          const w = isEdgeSel ? 3 : (isChain ? 2.4 : 1.2);
          const opacity = (selected != null && !isChain && !isEdgeSel) ? 0.2 : 0.65;
          return (
            <g key={i}>
              {/* wide invisible hitbox for click (edit mode) */}
              {editMode && (
                <path d={path} fill="none" stroke="transparent" strokeWidth="14"
                  style={{ cursor: 'pointer' }}
                  onClick={(e) => { e.stopPropagation(); setSelectedEdge(isEdgeSel ? null : key); }} />
              )}
              <path d={path} fill="none" stroke={stroke} strokeWidth={w} opacity={opacity} strokeLinecap="round"
                style={{ pointerEvents: 'none' }} />
              {/* Arrowhead near target */}
              <EdgeArrow x1={x1} y1={y1} x2={x2} y2={y2} stroke={stroke} opacity={opacity} r={R} />
            </g>
          );
        })}

        {/* In-progress connect line */}
        {connectMode && connectSource != null && (
          <ConnectPreview source={getPos(connectSource)} svgRef={svgRef} px={px} py={py} pad={pad} innerW={innerW} innerH={innerH} />
        )}

        {/* Nodes */}
        {talents.map((t, i) => {
          const { x, y } = getPos(i);
          const cx = px(x), cy = py(y);
          const isSel = selected === i;
          const isChain = chain.nodes.has(i);
          const isLearned = allocated && allocated.has(i);
          const canLearn = allocationMode && effPrereqs[i].every(p => allocated.has(p));
          const dim = selected != null && !isChain;
          const isDragging = dragIdx === i;
          const hasOverride = !!(t.tid && overrides[t.tid]);
          const isConnectSrc = connectSource === i;

          return (
            <g key={i}
              className={`talent-node ${isLearned ? 'learned' : ''} ${!canLearn && allocationMode ? 'locked' : ''} ${editMode ? 'draggable' : ''} ${isDragging ? 'dragging' : ''}`}
              transform={`translate(${cx},${cy})`}
              opacity={dim ? 0.45 : 1}
              style={{ cursor: editMode ? (isDragging ? 'grabbing' : 'pointer') : 'pointer' }}
              onPointerDown={(e) => onPointerDown(e, i)}
              onClick={(e) => {
                e.stopPropagation();
                // Differentiate drag vs click: only treat as click if we didn't move far
                handleNodeClick(i);
              }}>
              <circle r={R} fill={`url(#${gradId})`}
                stroke={isConnectSrc ? '#c0392b' : (isSel ? 'var(--ink-1)' : 'var(--accent-2)')}
                strokeWidth={isConnectSrc ? 3 : (isSel ? 3 : 1.6)}
                className="node-ring"
                filter="url(#paper-shadow)" />
              <circle r={R - 6} fill="var(--parch-1)" stroke="var(--accent-2)" strokeWidth="0.6" opacity="0.95" className="node-body" />
              {allocationMode && !isLearned && !canLearn && (
                <circle r={R - 6} fill="url(#hatch)" opacity="0.6" />
              )}
              {hasOverride && editMode && (
                <circle r={R + 5} fill="none" stroke="var(--accent-2)" strokeWidth="1" strokeDasharray="2 3" opacity="0.7" />
              )}
              {isConnectSrc && (
                <circle r={R + 9} fill="none" stroke="#c0392b" strokeWidth="1.5" strokeDasharray="3 3" opacity="0.85">
                  <animate attributeName="r" values={`${R+6};${R+11};${R+6}`} dur="1.2s" repeatCount="indefinite" />
                </circle>
              )}
              <g style={{ color: 'var(--accent-ink)' }} transform="translate(-14,-14)">
                <TalentIcon actionType={t.action} size={28} />
              </g>
              <text y={R + 18} textAnchor="middle"
                style={{ fontFamily: "'IM Fell English SC', serif", fontSize: '14px', fill: 'var(--ink-1)', letterSpacing: '0.04em', pointerEvents: 'none' }}>
                {t.name}
              </text>
              {t.cost && t.cost !== '—' && t.cost !== '-' && (
                <text y={R + 34} textAnchor="middle"
                  style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: '11px', fill: 'var(--accent-ink)', opacity: 0.8, pointerEvents: 'none' }}>
                  {t.cost.length > 26 ? t.cost.slice(0, 24) + '…' : t.cost}
                </text>
              )}
            </g>
          );
        })}
      </svg>
      {editMode && (
        <div className="edit-hint">
          {connectMode && connectSource != null
            ? (connectMode.direction === 'addPrereq'
                ? `Click a node to add as prereq for "${talents[connectSource].name}". Esc cancels.`
                : `Click a node to set "${talents[connectSource].name}" as its prereq. Esc cancels.`)
            : selectedEdge
              ? 'Edge selected. Delete key (or ✕) to remove. Esc to deselect.'
              : 'Click a node to open editor · Drag to reposition · Click a line to select it'}
        </div>
      )}
      {editMode && selectedEdge && (
        <button className="edge-delete-btn" onClick={() => removeEdge(selectedEdge)}>✕ Delete Edge</button>
      )}
      {cycleWarn && <div className="cycle-warn">{cycleWarn}</div>}
    </div>
  );
}

function EdgeArrow({ x1, y1, x2, y2, stroke, opacity, r }) {
  const dx = x2 - x1, dy = y2 - y1;
  const L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L;
  // Arrow tip sits just outside target node (at distance r from target)
  const tipX = x2 - ux * r;
  const tipY = y2 - uy * r;
  const size = 7;
  const baseX = tipX - ux * size;
  const baseY = tipY - uy * size;
  const pX = -uy, pY = ux; // perpendicular
  const l = { x: baseX + pX * size * 0.5, y: baseY + pY * size * 0.5 };
  const ri = { x: baseX - pX * size * 0.5, y: baseY - pY * size * 0.5 };
  return (
    <path d={`M ${tipX} ${tipY} L ${l.x} ${l.y} L ${ri.x} ${ri.y} Z`}
      fill={stroke} opacity={opacity} style={{ pointerEvents: 'none' }} />
  );
}

function ConnectPreview({ source, svgRef, px, py, pad, innerW, innerH }) {
  const [mouse, setMouse] = useS_tv(null);
  useE_tv(() => {
    function onMove(e) {
      const svg = svgRef.current;
      if (!svg) return;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const ctm = svg.getScreenCTM();
      if (!ctm) return;
      const local = pt.matrixTransform(ctm.inverse());
      setMouse({ x: local.x, y: local.y });
    }
    window.addEventListener('pointermove', onMove);
    return () => window.removeEventListener('pointermove', onMove);
  }, [svgRef]);
  if (!mouse) return null;
  const x1 = px(source.x), y1 = py(source.y);
  return (
    <line x1={x1} y1={y1} x2={mouse.x} y2={mouse.y}
      stroke="#c0392b" strokeWidth="1.5" strokeDasharray="4 4" opacity="0.8"
      style={{ pointerEvents: 'none' }} />
  );
}

Object.assign(window, { TreeView, TalentIcon });

</script>

<!-- Panels (Fix 4: delete talent) -->
<script type="text/babel">
/* Detail panel, filter bar, stats */

const { useMemo: useM_p } = React;

function TalentDetail({ talent, onClose, allocationMode, isLearned, canLearn, onToggleLearn, editMode, onEdit, origName, hasEdits, onResetTalent, onDelete, talents, effPrereqs, effEdges, onStartConnect, onRemoveEdge }) {
  if (!talent) {
    return (
      <div className="detail-placeholder">
        <div>
          <div style={{ fontSize: '2rem', opacity: 0.4, marginBottom: 8 }}>✶</div>
          Select a node to read the talent.
        </div>
      </div>
    );
  }
  const cost = talent.cost && talent.cost !== '—' && talent.cost !== '-' ? talent.cost : 'No cost';
  const tags = (talent.tags || '').split(/[;,]/).map(t => t.trim()).filter(Boolean);
  const prereqList = (talent.prereqs || '').split(/[,;]/).map(t => t.trim()).filter(s => s && s !== '—' && s !== '-');

  // Classify each prereq: color rank, stat requirement, or talent reference
  const STAT_NAMES = ['strength','dexterity','intellect','willpower','awareness','presence','vigor','speed','might','constitution'];
  const COLOR_NAMES = ['white','blue','black','red','green'];
  function classifyPrereq(s) {
    const lower = s.toLowerCase();
    const colorMatch = COLOR_NAMES.find(c => lower.startsWith(c));
    if (colorMatch && /rank\s*\d/i.test(lower)) {
      const rank = (lower.match(/rank\s*(\d)/i) || [])[1];
      return { kind: 'color', color: colorMatch, rank, text: s };
    }
    const statMatch = STAT_NAMES.find(st => lower.startsWith(st));
    if (statMatch && /\d/.test(lower)) {
      return { kind: 'stat', text: s };
    }
    return { kind: 'talent', text: s };
  }
  const classifiedPrereqs = prereqList.map(classifyPrereq);

  if (editMode) {
    return (
      <TalentEditor talent={talent} origName={origName} hasEdits={hasEdits}
        onClose={onClose} onEdit={onEdit} onResetTalent={onResetTalent}
        onDelete={onDelete}
        tags={tags} prereqList={prereqList}
        talents={talents} effPrereqs={effPrereqs} effEdges={effEdges}
        onStartConnect={onStartConnect} onRemoveEdge={onRemoveEdge} />
    );
  }

  return (
    <div className="talent-detail fade-in">
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 10 }}>
        <div>
          <div className="prereq-path">{talent.group} · {talent.tree || ''}{origName && origName !== talent.name ? ` · was "${origName}"` : ''}</div>
          <h3 className="rubric">{talent.name}</h3>
        </div>
        <button className="btn btn-ghost" onClick={onClose} title="Close"
          style={{ padding: '2px 10px', fontSize: '0.9rem' }}>✕</button>
      </div>

      <div className="action-cost" style={{ marginTop: 10 }}>
        <span className="pill">{talent.action}</span>
        <span className="pill cost">{cost}</span>
      </div>

      {classifiedPrereqs.length > 0 && (
        <div className="prereq-block prereq-block-top">
          <span className="label">Requires</span>
          <div className="prereq-chips">
            {classifiedPrereqs.map((p, i) => {
              if (p.kind === 'color') {
                return (
                  <span key={i} className={'prereq-chip prereq-color pip-' + p.color}>
                    <span className={'color-pip pip-' + p.color} aria-hidden="true" />
                    <span className="prereq-chip-label">{p.color[0].toUpperCase() + p.color.slice(1)}</span>
                    <span className="prereq-rank">R{p.rank}</span>
                  </span>
                );
              }
              if (p.kind === 'stat') {
                return <span key={i} className="prereq-chip prereq-stat">{p.text}</span>;
              }
              return <span key={i} className="prereq-chip prereq-talent">↳ {p.text}</span>;
            })}
          </div>
        </div>
      )}

      <p className="desc">{talent.description}</p>

      {talent.flavor && (
        <div className="flavor">"{talent.flavor}"</div>
      )}

      {tags.length > 0 && (
        <div className="tags">
          {tags.map((t, i) => <span key={i} className="tag-chip">{t}</span>)}
        </div>
      )}

      {allocationMode && (
        <div style={{ marginTop: 14, display: 'flex', gap: 10 }}>
          {isLearned ? (
            <button className="btn" onClick={onToggleLearn}>Unlearn Talent</button>
          ) : (
            <button className="btn" disabled={!canLearn}
              style={{ opacity: canLearn ? 1 : 0.5, cursor: canLearn ? 'pointer' : 'not-allowed' }}
              onClick={onToggleLearn}>
              {canLearn ? 'Learn Talent' : 'Prerequisites Locked'}
            </button>
          )}
        </div>
      )}
    </div>
  );
}

const ACTION_OPTIONS = ['∞','★','⟲','◇','▶','▶▶','▶▶▶'];

function TalentEditor({ talent, origName, hasEdits, onClose, onEdit, onResetTalent, onDelete, tags, prereqList, talents, effPrereqs, effEdges, onStartConnect, onRemoveEdge }) {
  // local draft state — commit on blur / change
  const [name, setName] = React.useState(talent.name);
  const [action, setAction] = React.useState(talent.action || '∞');
  const [cost, setCost] = React.useState(talent.cost || '');
  const [description, setDescription] = React.useState(talent.description || '');
  const [flavor, setFlavor] = React.useState(talent.flavor || '');
  const [tagsStr, setTagsStr] = React.useState((talent.tags || '').toString());

  // when a different talent is selected, reset local state
  React.useEffect(() => {
    setName(talent.name);
    setAction(talent.action || '∞');
    setCost(talent.cost || '');
    setDescription(talent.description || '');
    setFlavor(talent.flavor || '');
    setTagsStr((talent.tags || '').toString());
  }, [origName]);

  function commit(patch) { onEdit(patch); }

  return (
    <div className="talent-detail talent-editor fade-in">
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 10 }}>
        <div style={{ flex: 1 }}>
          <div className="prereq-path">
            EDITING · {talent.group} · {talent.tree || ''}
            {hasEdits && <span style={{ color: 'var(--rubric)', marginLeft: 8 }}>● modified</span>}
          </div>
          <input
            className="edit-input edit-name rubric"
            type="text"
            value={name}
            onChange={e => setName(e.target.value)}
            onBlur={() => name !== talent.name && commit({ name })}
            placeholder="Talent name"
          />
        </div>
        <button className="btn btn-ghost" onClick={onClose} title="Close"
          style={{ padding: '2px 10px', fontSize: '0.9rem' }}>✕</button>
      </div>

      <div className="edit-row">
        <label className="edit-label">Action</label>
        <select className="edit-select" value={action}
          onChange={e => { setAction(e.target.value); commit({ action: e.target.value }); }}>
          {ACTION_OPTIONS.map(a => <option key={a} value={a}>{a}</option>)}
        </select>
      </div>

      <div className="edit-row">
        <label className="edit-label">Cost</label>
        <input
          className="edit-input"
          type="text"
          value={cost}
          onChange={e => setCost(e.target.value)}
          onBlur={() => cost !== (talent.cost || '') && commit({ cost })}
          placeholder="e.g. 2 Investiture, 1 Focus, —"
        />
      </div>

      <div className="edit-row">
        <label className="edit-label">Description</label>
        <textarea
          className="edit-textarea"
          value={description}
          rows={4}
          onChange={e => setDescription(e.target.value)}
          onBlur={() => description !== (talent.description || '') && commit({ description })}
          placeholder="Mechanical effect…"
        />
      </div>

      <div className="edit-row">
        <label className="edit-label">Flavor</label>
        <textarea
          className="edit-textarea edit-flavor"
          value={flavor}
          rows={2}
          onChange={e => setFlavor(e.target.value)}
          onBlur={() => flavor !== (talent.flavor || '') && commit({ flavor })}
          placeholder="Italic in-world quote (optional)"
        />
      </div>

      <div className="edit-row">
        <label className="edit-label">Tags <span style={{ opacity: 0.6 }}>(semicolon-separated)</span></label>
        <input
          className="edit-input"
          type="text"
          value={tagsStr}
          onChange={e => setTagsStr(e.target.value)}
          onBlur={() => tagsStr !== (talent.tags || '').toString() && commit({ tags: tagsStr })}
          placeholder="e.g. draw_mana; healing; allies"
        />
        {tagsStr && (
          <div className="tags" style={{ marginTop: 6 }}>
            {tagsStr.split(/[;,]/).map(t => t.trim()).filter(Boolean).map((t, i) =>
              <span key={i} className="tag-chip">{t}</span>
            )}
          </div>
        )}
      </div>

      {(() => {
        if (!talents || !effEdges) return null;
        const myIdx = talents.findIndex(t => t._origKey === origName);
        if (myIdx < 0) return null;
        const myPrereqs = effEdges.filter(([s, t]) => t === myIdx).map(([s]) => s);
        const myDependents = effEdges.filter(([s, t]) => s === myIdx).map(([_, t]) => t);
        return (
          <div className="conn-block">
            <div className="conn-header">Connections</div>

            <div className="conn-row">
              <div className="conn-row-label">Prerequisites of this talent</div>
              <div className="conn-pills">
                {myPrereqs.length === 0 && <span className="conn-empty">None</span>}
                {myPrereqs.map(srcIdx => (
                  <span key={srcIdx} className="conn-pill">
                    {talents[srcIdx] ? talents[srcIdx].name : `#${srcIdx}`}
                    <button className="conn-pill-x"
                      title="Remove this prerequisite"
                      onClick={() => onRemoveEdge && onRemoveEdge(srcIdx, myIdx)}>×</button>
                  </span>
                ))}
              </div>
              <button className="btn btn-ghost conn-btn"
                onClick={() => onStartConnect && onStartConnect('addPrereq')}>
                ⤴ Add prereq…
              </button>
            </div>

            <div className="conn-row">
              <div className="conn-row-label">Talents this is a prereq for</div>
              <div className="conn-pills">
                {myDependents.length === 0 && <span className="conn-empty">None</span>}
                {myDependents.map(tgtIdx => (
                  <span key={tgtIdx} className="conn-pill">
                    {talents[tgtIdx] ? talents[tgtIdx].name : `#${tgtIdx}`}
                    <button className="conn-pill-x"
                      title="Remove this connection"
                      onClick={() => onRemoveEdge && onRemoveEdge(myIdx, tgtIdx)}>×</button>
                  </span>
                ))}
              </div>
              <button className="btn btn-ghost conn-btn"
                onClick={() => onStartConnect && onStartConnect('makePrereqOf')}>
                ⤵ Make prereq of…
              </button>
            </div>
          </div>
        );
      })()}

      <div style={{ marginTop: 14, display: 'flex', gap: 8, flexWrap: 'wrap' }}>
        {hasEdits && !origName.startsWith('__new__') && (
          <button className="btn btn-ghost" onClick={onResetTalent}>↶ Revert this talent</button>
        )}
        {onDelete && (
          <button className="btn btn-ghost" style={{ color: '#c0392b', borderColor: '#c0392b' }}
            onClick={() => { if (window.confirm('Delete "' + talent.name + '"? This cannot be undone.')) onDelete(); }}>
            🗑 Delete Talent
          </button>
        )}
      </div>
    </div>
  );
}

function FilterBar({ search, setSearch, costFilter, setCostFilter, actionFilter, setActionFilter, atlasFilter, setAtlasFilter }) {
  const costs = [
    { id: 'free', label: 'Free' },
    { id: 'investiture', label: 'Investiture' },
    { id: 'focus', label: 'Focus' },
    { id: 'hp', label: 'HP' },
    { id: 'opportunity', label: 'Opportunity' },
  ];
  const actions = ['∞','★','⟲','◇','▶','▶▶','▶▶▶'];
  const atlases = [
    { id: 'leyline', label: 'Leyline' },
    { id: 'heroic', label: 'Heroic' },
    { id: 'deity', label: 'Deity' },
  ];

  return (
    <div className="filter-bar parchment">
      <input type="search" placeholder="Search all talents…"
        value={search} onChange={e => setSearch(e.target.value)}
        className="search-input" />

      {atlasFilter && (
        <div className="group">
          <span className="group-label">Atlas</span>
          {atlases.map(a => (
            <button key={a.id}
              className={'chip-btn' + (atlasFilter.has(a.id) ? ' active' : '')}
              onClick={() => {
                const s = new Set(atlasFilter);
                s.has(a.id) ? s.delete(a.id) : s.add(a.id);
                setAtlasFilter(s);
              }}>{a.label}</button>
          ))}
        </div>
      )}

      <div className="group">
        <span className="group-label">Cost</span>
        {costs.map(c => (
          <button key={c.id}
            className={'chip-btn' + (costFilter.has(c.id) ? ' active' : '')}
            onClick={() => {
              const s = new Set(costFilter);
              s.has(c.id) ? s.delete(c.id) : s.add(c.id);
              setCostFilter(s);
            }}>{c.label}</button>
        ))}
      </div>

      <div className="group">
        <span className="group-label">Action</span>
        {actions.map(a => (
          <button key={a}
            className={'chip-btn' + (actionFilter.has(a) ? ' active' : '')}
            onClick={() => {
              const s = new Set(actionFilter);
              s.has(a) ? s.delete(a) : s.add(a);
              setActionFilter(s);
            }}>{a}</button>
        ))}
      </div>
    </div>
  );
}

function DesignerStats({ talents, label }) {
  const stats = useM_p(() => {
    const total = talents.length || 1;
    const byAction = {};
    let free = 0;
    let totalWords = 0;
    for (const t of talents) {
      byAction[t.action] = (byAction[t.action] || 0) + 1;
      const costs = window.GameData.classifyCost(t.cost);
      if (costs.includes('free')) free++;
      totalWords += (t.description || '').split(/\s+/).length;
    }
    return {
      total, byAction,
      free: Math.round(100 * free / total),
      avgWords: Math.round(totalWords / total),
    };
  }, [talents]);

  const order = ['∞','★','⟲','◇','▶','▶▶','▶▶▶'];

  return (
    <div className="stats-row">
      <div className="stat"><div className="num">{stats.total}</div><div className="lbl">Nodes · {label}</div></div>
      <div className="stat"><div className="num">{stats.free}%</div><div className="lbl">Free (no cost)</div></div>
      <div className="stat"><div className="num">{stats.avgWords}</div><div className="lbl">Avg words/desc</div></div>
      {order.map(a => (
        <div key={a} className="stat">
          <div className="num">{Math.round(100 * (stats.byAction[a] || 0) / stats.total)}%</div>
          <div className="lbl">{a}</div>
        </div>
      ))}
    </div>
  );
}

function AllocationBar({ allocated, total, onClear, active, setActive }) {
  return (
    <div className="points-bar">
      <span>Build Mode</span>
      <button className={'chip-btn' + (active ? ' active' : '')} onClick={() => setActive(!active)}>
        {active ? 'ON' : 'OFF'}
      </button>
      {active && (
        <>
          <span style={{ opacity: 0.7, margin: '0 6px' }}>·</span>
          <span className="mono" style={{ fontSize: '0.8rem' }}>
            {allocated.size} / {total} learned
          </span>
          <button className="chip-btn" onClick={onClear}>Reset</button>
        </>
      )}
    </div>
  );
}

Object.assign(window, { TalentDetail, FilterBar, DesignerStats, AllocationBar });

</script>

<!-- Tweak store setup — must come before TweaksPanel uses it -->
<script>
(function() {
  // Persisted overrides live in this JSON block (rewritten by the host on edit).
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{ "loreOverrides": {} }/*EDITMODE-END*/;

  window.__TweakStore = {
    loreOverrides: JSON.parse(JSON.stringify(TWEAK_DEFAULTS.loreOverrides || {})),
    version: 0,
    subscribers: new Set(),
    subscribe(fn) { this.subscribers.add(fn); return () => this.subscribers.delete(fn); },
    notify() { this.version++; this.subscribers.forEach(fn => fn(this.version)); },
    getOverride(atlasId, groupKey) {
      return (this.loreOverrides[atlasId] || {})[groupKey] || null;
    },
    setOverride(atlasId, groupKey, patch) {
      const byAtlas = this.loreOverrides[atlasId] || {};
      const existing = byAtlas[groupKey] || {};
      byAtlas[groupKey] = Object.assign({}, existing, patch);
      this.loreOverrides[atlasId] = byAtlas;
      this.notify();
      try { localStorage.setItem('skilltrees:loreOverrides', JSON.stringify(this.loreOverrides)); } catch (e) {}
      if (window.parent !== window) {
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { loreOverrides: this.loreOverrides } }, '*');
      }
    },
    clearOverride(atlasId, groupKey) {
      const byAtlas = this.loreOverrides[atlasId];
      if (!byAtlas) return;
      delete byAtlas[groupKey];
      if (Object.keys(byAtlas).length === 0) delete this.loreOverrides[atlasId];
      this.notify();
      try { localStorage.setItem('skilltrees:loreOverrides', JSON.stringify(this.loreOverrides)); } catch (e) {}
      if (window.parent !== window) {
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { loreOverrides: this.loreOverrides } }, '*');
      }
    },
  };

  // Merge any localStorage-saved overrides on top (so reload-without-host still works)
  try {
    const saved = JSON.parse(localStorage.getItem('skilltrees:loreOverrides') || 'null');
    if (saved && typeof saved === 'object') {
      window.__TweakStore.loreOverrides = saved;
    }
  } catch (e) {}

  window.__TweaksActive = false;
  window.addEventListener('message', (e) => {
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.type === '__activate_edit_mode') {
      window.__TweaksActive = true;
      window.__TweakStore.notify();
    } else if (e.data.type === '__deactivate_edit_mode') {
      window.__TweaksActive = false;
      window.__TweakStore.notify();
    }
  });
  if (window.parent !== window) {
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }
})();
</script>

<!-- Tweaks panel -->
<script type="text/babel">
/* Tweaks panel — live editor for group-card lore/gameplay text.
   Reads/writes window.__TweakStore.loreOverrides; renders inside <TweaksPanel />. */

const { useState: useTS, useEffect: useTE, useMemo: useTM } = React;

function useTweakVersion() {
  const [v, setV] = useTS(window.__TweakStore.version);
  useTE(() => window.__TweakStore.subscribe(setV), []);
  return v;
}

function TweaksPanel() {
  const version = useTweakVersion();
  const active = window.__TweaksActive;
  const [atlasId, setAtlasId] = useTS('leyline');
  const [groupKey, setGroupKey] = useTS(null);
  const [loreDraft, setLoreDraft] = useTS('');
  const [playDraft, setPlayDraft] = useTS('');

  const atlases = (window.__ATLASES__ && window.__ATLASES__.atlases) || {};
  const groups = useTM(() => {
    const atl = atlases[atlasId];
    if (!atl) return [];
    const seen = {};
    for (const tr of atl.trees) {
      if (!seen[tr.group]) seen[tr.group] = { key: tr.group, label: tr.groupLabel };
    }
    return Object.values(seen);
  }, [atlasId, atlases]);

  // Load current values for this group into drafts
  useTE(() => {
    if (!groupKey) return;
    const base = (window.GroupLore[atlasId] || {})[groupKey] || {};
    const override = window.__TweakStore.getOverride(atlasId, groupKey) || {};
    setLoreDraft(override.lore != null ? override.lore : (base.lore || ''));
    setPlayDraft(override.gameplay != null ? override.gameplay : (base.gameplay || ''));
  }, [atlasId, groupKey, version]);

  // If atlas changes, pick first group
  useTE(() => {
    if (!groups.length) { setGroupKey(null); return; }
    if (!groups.find(g => g.key === groupKey)) setGroupKey(groups[0].key);
  }, [atlasId, groups]);

  if (!active) return null;

  const current = groupKey ? (window.GroupLore[atlasId] || {})[groupKey] || {} : {};
  const override = groupKey ? window.__TweakStore.getOverride(atlasId, groupKey) : null;
  const isOverridden = override && (override.lore != null || override.gameplay != null);

  function commitLore() {
    if (!groupKey) return;
    const base = (window.GroupLore[atlasId] || {})[groupKey] || {};
    if (loreDraft === (base.lore || '')) {
      // reverted to baseline — clear that field only
      const cur = window.__TweakStore.getOverride(atlasId, groupKey) || {};
      if (cur.lore != null) {
        const next = { ...cur }; delete next.lore;
        if (Object.keys(next).length === 0) window.__TweakStore.clearOverride(atlasId, groupKey);
        else window.__TweakStore.setOverride(atlasId, groupKey, next);
      }
      return;
    }
    window.__TweakStore.setOverride(atlasId, groupKey, { lore: loreDraft });
  }
  function commitPlay() {
    if (!groupKey) return;
    const base = (window.GroupLore[atlasId] || {})[groupKey] || {};
    if (playDraft === (base.gameplay || '')) {
      const cur = window.__TweakStore.getOverride(atlasId, groupKey) || {};
      if (cur.gameplay != null) {
        const next = { ...cur }; delete next.gameplay;
        if (Object.keys(next).length === 0) window.__TweakStore.clearOverride(atlasId, groupKey);
        else window.__TweakStore.setOverride(atlasId, groupKey, next);
      }
      return;
    }
    window.__TweakStore.setOverride(atlasId, groupKey, { gameplay: playDraft });
  }
  function revertThis() {
    if (!groupKey) return;
    window.__TweakStore.clearOverride(atlasId, groupKey);
  }

  const atlasTabs = ['leyline', 'heroic', 'deity'];

  return (
    <div className="parchment tweaks-panel">
      <div className="tweaks-panel-head">
        <h3>Tweaks · Card Text</h3>
        <span className="mono" style={{ color: 'var(--ink-4)', fontSize: '0.7rem' }}>
          {Object.keys(window.__TweakStore.loreOverrides).reduce((s, a) => s + Object.keys(window.__TweakStore.loreOverrides[a]).length, 0)} edits
        </span>
      </div>

      <div className="tweaks-target-picker">
        {atlasTabs.map(a => (
          <button key={a}
            className={'chip-btn' + (a === atlasId ? ' active' : '')}
            onClick={() => setAtlasId(a)}>
            {a[0].toUpperCase() + a.slice(1)}
          </button>
        ))}
      </div>

      <div className="tweaks-row">
        <label>Group</label>
        <select
          className="edit-select"
          value={groupKey || ''}
          onChange={e => setGroupKey(e.target.value)}>
          {groups.map(g => (
            <option key={g.key} value={g.key}>{g.label}</option>
          ))}
        </select>
      </div>

      {groupKey ? (
        <>
          <div className="tweaks-row">
            <label>Lore {isOverridden && override.lore != null && <span style={{ color: 'var(--rubric)' }}>● edited</span>}</label>
            <textarea
              rows={5}
              value={loreDraft}
              onChange={e => setLoreDraft(e.target.value)}
              onBlur={commitLore} />
          </div>
          <div className="tweaks-row">
            <label>Gameplay {isOverridden && override.gameplay != null && <span style={{ color: 'var(--rubric)' }}>● edited</span>}</label>
            <textarea
              rows={4}
              value={playDraft}
              onChange={e => setPlayDraft(e.target.value)}
              onBlur={commitPlay} />
          </div>
          {isOverridden && (
            <button className="btn btn-ghost" onClick={revertThis} style={{ width: '100%', fontSize: '0.85rem' }}>
              ↶ Revert this card
            </button>
          )}
        </>
      ) : (
        <div className="tweaks-empty">No groups available.</div>
      )}
    </div>
  );
}

window.TweaksPanel = TweaksPanel;

</script>

<!-- BuildStore: a global "learned" set for character-build mode (NEW) -->
<script>
(function() {
  // learned[treeId] = Set<int> of talent indices learned in that tree.
  // Index-based so it survives talent text edits; we re-key by name on save/load.
  const KEY = 'skilltrees:build:v1';

  function loadFromStorage() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
      const out = {};
      for (const tid in raw) out[tid] = new Set(raw[tid]);
      return out;
    } catch { return {}; }
  }
  function saveToStorage(state) {
    const flat = {};
    for (const tid in state) flat[tid] = [...state[tid]];
    try { localStorage.setItem(KEY, JSON.stringify(flat)); } catch (e) {}
  }

  const subs = new Set();
  const state = { learned: loadFromStorage(), version: 0 };

  function notify() { state.version++; subs.forEach(fn => fn(state.version)); }

  window.BuildStore = {
    get: () => state.learned,
    version: () => state.version,
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    getTreeSet(treeId) { return state.learned[treeId] || new Set(); },
    setTreeSet(treeId, set) {
      if (!set || set.size === 0) delete state.learned[treeId];
      else state.learned[treeId] = new Set(set);
      saveToStorage(state.learned);
      notify();
    },
    totalLearned() {
      let n = 0; for (const tid in state.learned) n += state.learned[tid].size; return n;
    },
    clearAll() { state.learned = {}; saveToStorage(state.learned); notify(); },
    // Cross-atlas rank helper — count learned talents in any tree whose atlas-color matches.
    // treesById is set later by the boot script.
    rankFor(color /* 'white'|'blue'|... */) {
      const tb = window.__ATLASES__ && window.__ATLASES__.treesById;
      if (!tb) return 0;
      let n = 0;
      for (const tid in state.learned) {
        const tree = tb[tid];
        if (!tree) continue;
        if (tree.color === color) n += state.learned[tid].size;
        else if (tree.colorsStr) {
          // dual-color domains like "Black/Green" — count for either
          const cs = tree.colorsStr.toLowerCase().split(/[\/,]/).map(s => s.trim());
          if (cs.includes(color)) n += state.learned[tid].size;
        }
      }
      return n;
    },
  };
})();
</script>

    .map(c => c.trim().toLowerCase())
    .filter(c => ['white','blue','black','red','green'].includes(c));

}

function GroupGrid({ atlas, onPickTree }) {

  const groups = useM(() => {

                {g.domain && !g.colorsStr && <div className="small-caps group-colors-label">{g.domain}</div>}

}

function loadTalentEdits(treeId) {
  try { return JSON.parse(localStorage.getItem(`skilltrees:talents:${treeId}`) || '{}'); }
  catch { return {}; }
}
function saveTalentEdits(treeId, obj) {
  if (!obj || Object.keys(obj).length === 0) localStorage.removeItem(`skilltrees:talents:${treeId}`);
  else localStorage.setItem(`skilltrees:talents:${treeId}`, JSON.stringify(obj));
}

function TreePage({ tree: rawTree, siblings, onPickTree, onBack }) {
  const [selected, setSelected] = useS(null);
  const [allocMode, setAllocMode] = useS(false);
  const [editMode, setEditMode] = useS(false);
  // BuildStore-backed allocation: subscribe so global Build edits reflect here too
  const [, bumpBuild] = useS(0);
  useE(() => window.BuildStore.subscribe(bumpBuild), []);
  const allocated = window.BuildStore.getTreeSet(rawTree.id);
  const setAllocated = (s) => window.BuildStore.setTreeSet(rawTree.id, s);
  const [talentEdits, setTalentEdits] = useS(() => loadTalentEdits(rawTree.id));
  const resetRef = React.useRef(null);
  const resetConnRef = React.useRef(null);
  const exportRef = React.useRef(null);
  // FIX 2: version bump whenever connections change in TreeView
  const [connVersion, setConnVersion] = useS(0);
  // Connect mode (edit-mode-only): { sourceTid, direction: 'addPrereq' | 'makePrereqOf' }
  const [connectMode, setConnectMode] = useS(null);

  useE(() => {
    if (window.migrateEditsToTids) window.migrateEditsToTids(rawTree.id, rawTree.talents);
    setTalentEdits(loadTalentEdits(rawTree.id));
  }, [rawTree.id]);

  // FIX 4: Merge edits — supports __deleted and __new__ keys; keyed by tid
  const tree = useM(() => {
    const merged = rawTree.talents
      .map(t => {
        const e = talentEdits[t.tid];
        if (e && e.__deleted) return null;
        return e ? { ...t, ...e, _origKey: t.tid, tid: t.tid } : { ...t, _origKey: t.tid };
      })
      .filter(Boolean);
    // Append brand-new talents
    for (const [key, val] of Object.entries(talentEdits)) {
      if (key.startsWith('__new__')) {
        merged.push({
          name: 'New Talent', action: '∞', cost: '—',
          prereqs: '', description: '', flavor: '', tags: '',
          atlas: rawTree.atlas, color: rawTree.color,
          group: rawTree.group, tree: rawTree.name,
          ...val,
          _origKey: key,
          tid: key,
        });
      }
    }
    return { ...rawTree, talents: merged };
  }, [rawTree, talentEdits]);

  function editTalent(origKey, patch) {
    setTalentEdits(prev => {
      const next = { ...prev, [origKey]: { ...(prev[origKey] || {}), ...patch } };
      saveTalentEdits(rawTree.id, next);
      return next;
    });
  }
  function resetTalentEdits() {
    setTalentEdits({});
    saveTalentEdits(rawTree.id, {});
  }
  // FIX 4: add a blank new talent. Use a tid-shaped key so all storage is uniform.
  function addNewTalent() {
    const key = '__new__' + Date.now();
    setTalentEdits(prev => {
      const next = { ...prev, [key]: { name: 'New Talent', action: '∞', cost: '—', description: '', flavor: '', tags: '', prereqs: '' } };
      saveTalentEdits(rawTree.id, next);
      return next;
    });
  }
  // FIX 4: delete a talent (existing → mark __deleted; new → remove key)
  function deleteTalent(origKey) {
    setTalentEdits(prev => {
      const next = { ...prev };
      if (origKey.startsWith('__new__')) {
        delete next[origKey];
      } else {
        next[origKey] = { ...(next[origKey] || {}), __deleted: true };
      }
      saveTalentEdits(rawTree.id, next);
      return next;
    });
    setSelected(null);
  }

  const layout = useM(() => window.Layout.layoutTree(tree.talents), [tree]);

  // effEdges + effPrereqs (re-reads connections from localStorage on every connVersion bump)
  const effEdges = useM(() => {
    const conns = (typeof loadConnections !== 'undefined') ? loadConnections(tree.id) : null;
    if (conns == null) return layout.edges;
    // conns are [srcTid, tgtTid] pairs — resolve to indices
    const tidToIdx = {};
    tree.talents.forEach((t, i) => { if (t.tid) tidToIdx[t.tid] = i; });
    return conns
      .map(([s, t]) => [tidToIdx[s], tidToIdx[t]])
      .filter(([s, t]) => s != null && t != null);
  }, [connVersion, tree.id, layout, tree.talents]);

  const effPrereqs = useM(() => {
    const out = tree.talents.map(() => []);
    for (const [s, t] of effEdges) { if (t < out.length) out[t].push(s); }
    return out;
  }, [effEdges, tree.talents]);

  useE(() => { setSelected(null); }, [tree.id]);

  function toggleLearn(idx) {
    const s = new Set(allocated);
    if (s.has(idx)) {
      const toRemove = new Set([idx]);
      let changed = true;
      while (changed) {
        changed = false;
        tree.talents.forEach((_, i) => {
          if (toRemove.has(i)) return;
          // FIX 2: use effPrereqs (respects custom connections)
          if (s.has(i) && effPrereqs[i].some(p => toRemove.has(p))) {
            toRemove.add(i); changed = true;
          }
        });
      }
      for (const r of toRemove) s.delete(r);
    } else if (effPrereqs[idx].every(p => s.has(p))) {
      s.add(idx);
    }
    setAllocated(s);
  }

  const talent = selected != null ? tree.talents[selected] : null;
  // FIX 4: origKey works for both existing and __new__ talents
  const origName = selected != null ? (tree.talents[selected] && tree.talents[selected]._origKey) : null;
  // FIX 2: canLearn uses effPrereqs
  const canLearn = selected != null && effPrereqs[selected] && effPrereqs[selected].every(p => allocated.has(p));

        <div className="tree-panel parchment">
          <div className="tree-header">

            editMode={editMode}
            onResetLayout={resetRef}
            onResetConnections={resetConnRef}
            onExport={exportRef}
            onConnChange={() => setConnVersion(v => v + 1)}
            connectMode={connectMode}
            onConnectComplete={() => setConnectMode(null)}
          />
        </div>

        <div className="detail-panel parchment">
          <window.TalentDetail
            talent={talent}
            allocationMode={allocMode}
            isLearned={isLearned}
            canLearn={canLearn}
            onClose={() => setSelected(null)}
            onToggleLearn={() => toggleLearn(selected)}
            editMode={editMode}
            onEdit={(patch) => origName && editTalent(origName, patch)}
            origName={origName}
            hasEdits={origName && !!talentEdits[origName]}
            onResetTalent={() => {
              if (!origName) return;
              setTalentEdits(prev => {
                const next = { ...prev };
                delete next[origName];
                saveTalentEdits(rawTree.id, next);
                return next;
              });
            }}
            onDelete={() => origName && deleteTalent(origName)}
            talents={tree.talents}
            effPrereqs={effPrereqs}
            effEdges={effEdges}
            onStartConnect={(direction) => {
              const sel = tree.talents[selected];
              if (sel && sel.tid) setConnectMode({ sourceTid: sel.tid, direction });
            }}
            onRemoveEdge={(srcIdx, tgtIdx) => {
              const sTid = tree.talents[srcIdx] && tree.talents[srcIdx].tid;
              const tTid = tree.talents[tgtIdx] && tree.talents[tgtIdx].tid;
              if (!sTid || !tTid) return;
              const cur = loadConnections(tree.id);
              let next;
              if (cur == null) {
                // Materialize from layout, minus this edge
                next = layout.edges
                  .map(([a, b]) => [tree.talents[a] && tree.talents[a].tid, tree.talents[b] && tree.talents[b].tid])
                  .filter(([a, b]) => a && b && !(a === sTid && b === tTid));
              } else {
                next = cur.filter(([a, b]) => !(a === sTid && b === tTid));
              }
              saveConnections(tree.id, next);
              setConnVersion(v => v + 1);
            }}
          />
        </div>
      </div>
    </div>
  );
}

// FIX 1: Export all trees — reads overrides/connections/edits from localStorage
function exportAllTrees(treesById) {
  const result = {};
  for (const [tid, rawTree] of Object.entries(treesById)) {
    // run migration once
    if (window.migrateEditsToTids) window.migrateEditsToTids(rawTree.id, rawTree.talents);
    // load stored edits
    let talentEdits = {};
    try { talentEdits = JSON.parse(localStorage.getItem('skilltrees:talents:' + tid) || '{}'); } catch {}
    // merge talents (same logic as TreePage)
    const merged = rawTree.talents
      .map(t => {
        const e = talentEdits[t.tid];
        if (e && e.__deleted) return null;
        return e ? { ...t, ...e, _origKey: t.tid, tid: t.tid } : { ...t, _origKey: t.tid };
      })
      .filter(Boolean);
    for (const [key, val] of Object.entries(talentEdits)) {
      if (key.startsWith('__new__')) {
        merged.push({ name: 'New Talent', action: '∞', cost: '—',
          prereqs: '', description: '', flavor: '', tags: '',
          atlas: rawTree.atlas, color: rawTree.color,
          group: rawTree.group, tree: rawTree.name,
          ...val, _origKey: key, tid: key });
      }
    }
    // layout for positions
    const layout = window.Layout.layoutTree(merged);
    // load connection/position overrides
    let connOverride = null;
    try { const raw = localStorage.getItem('skilltrees:conns:' + tid); connOverride = raw ? JSON.parse(raw) : null; } catch {}
    let posOverrides = {};
    try { posOverrides = JSON.parse(localStorage.getItem('skilltrees:layout:' + tid) || '{}'); } catch {}
    // effective edges (tid-keyed → resolve to indices in merged list)
    let effEdges;
    if (connOverride != null) {
      const tidToIdx = {};
      merged.forEach((t, i) => { if (t.tid) tidToIdx[t.tid] = i; });
      effEdges = connOverride
        .map(([s, t]) => [tidToIdx[s], tidToIdx[t]])
        .filter(([s, t]) => s != null && t != null);
    } else {
      effEdges = layout.edges;
    }
    const positions = {};
    merged.forEach((t, i) => {
      const p = (t.tid && posOverrides[t.tid]) || layout.positions[i];
      if (p) positions[t.name] = { x: +p.x.toFixed(4), y: +p.y.toFixed(4) };
    });
    result[tid] = {
      tree: { id: rawTree.id, name: rawTree.fullName || rawTree.name, atlas: rawTree.atlas, group: rawTree.group, color: rawTree.color },
      talents: merged.map(t => ({ tid: t.tid, name: t.name, action: t.action, cost: t.cost, description: t.description, flavor: t.flavor, tags: t.tags, prereqs: t.prereqs })),
      connections: effEdges.map(([s, t]) => ({ prereq: merged[s] ? merged[s].name : s, talent: merged[t] ? merged[t].name : t })),
      positions,
    };
  }
  return result;
}

/* ---------- BuildView: NEW capability — character build sheet ---------- */
function BuildView({ atlases, treesById, onOpenTree }) {
  const [, bump] = useS(0);
  useE(() => window.BuildStore.subscribe(bump), []);

  // Roll up everything learned across all trees
  const sections = useM(() => {
    const learned = window.BuildStore.get();
    const out = [];
    for (const atlasId in atlases) {
      const atlas = atlases[atlasId];
      const groups = {};
      for (const tree of atlas.trees) {
        const s = learned[tree.id];
        if (!s || s.size === 0) continue;
        const items = [...s].sort((a, b) => a - b).map(i => tree.talents[i]).filter(Boolean);
        if (!items.length) continue;
        const gKey = tree.group;
        groups[gKey] = groups[gKey] || { key: gKey, label: tree.groupLabel, color: tree.color, colorsStr: tree.colorsStr, trees: [] };
        groups[gKey].trees.push({ tree, items });
      }
      const groupArr = Object.values(groups);
      if (groupArr.length) out.push({ atlas, groups: groupArr });
    }
    return out;
  }, [window.BuildStore.version()]);

  const total = window.BuildStore.totalLearned();

  // Color rank tally for the leyline
  const colorRanks = ['white','blue','black','red','green'].map(c => ({
    color: c, rank: window.BuildStore.rankFor(c),
  }));

  // Action-type breakdown
  const actionTally = {};
  for (const sec of sections) for (const g of sec.groups) for (const tg of g.trees) {
    for (const t of tg.items) {
      const k = (t.action || '—').toString();
      actionTally[k] = (actionTally[k] || 0) + 1;
    }
  }

  function exportBuild() {
    const learned = window.BuildStore.get();
    const flat = [];
    for (const tid in learned) {
      const tr = treesById[tid];
      if (!tr) continue;
      for (const i of learned[tid]) {
        const t = tr.talents[i];
        if (!t) continue;
        flat.push({
          atlas: tr.atlas, group: tr.groupLabel, tree: tr.name,
          name: t.name, action: t.action, cost: t.cost,
          prereqs: t.prereqs, description: t.description, tags: t.tags,
        });
      }
    }
    const blob = new Blob([JSON.stringify({
      meta: { exported: new Date().toISOString(), totalTalents: flat.length },
      colorRanks: Object.fromEntries(colorRanks.map(c => [c.color, c.rank])),
      talents: flat,
    }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'character-build.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  }

  return (
    <div className="fade-in build-view" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div className="parchment" style={{ padding: '20px 26px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, flexWrap: 'wrap' }}>
          <div>
            <div className="small-caps" style={{ fontSize: '0.78rem', color: 'var(--ink-4)', letterSpacing: '0.1em' }}>Character Build</div>
            <h2 className="rubric" style={{ fontSize: '2rem', marginTop: 4 }}>The Sheet</h2>
            <div style={{ fontStyle: 'italic', color: 'var(--ink-2)', marginTop: 6, maxWidth: 720 }}>
              Every talent you've learned across the four atlases — gathered into one ledger. Open allocation mode in any tree, click a talent to learn it; the sheet updates live.
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <button className="btn" onClick={exportBuild} disabled={total === 0} style={{ opacity: total === 0 ? 0.5 : 1 }}>⇩ Export Build</button>
            <button className="btn btn-ghost" onClick={() => { if (confirm('Clear all learned talents from this build?')) window.BuildStore.clearAll(); }} disabled={total === 0} style={{ opacity: total === 0 ? 0.5 : 1 }}>↶ Clear All</button>
          </div>
        </div>

        {/* Stat strip */}
        <div className="build-stats">
          <div className="build-stat">
            <div className="build-stat-num rubric">{total}</div>
            <div className="build-stat-label small-caps">Talents</div>
          </div>
          {colorRanks.filter(c => c.rank > 0).map(c => (
            <div key={c.color} className="build-stat">
              <div className="build-stat-num" style={{ display: 'flex', alignItems: 'center', gap: 6, justifyContent: 'center' }}>
                <span className={'color-pip pip-' + c.color} /> {c.rank}
              </div>
              <div className="build-stat-label small-caps">{c.color} rank</div>
            </div>
          ))}
          {Object.keys(actionTally).length > 0 && (
            <div className="build-stat build-stat-actions">
              <div className="build-stat-label small-caps" style={{ marginBottom: 4 }}>Action Mix</div>
              <div className="action-mix">
                {Object.entries(actionTally).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
                  <span key={k} className="action-chip">{k} <span className="mono">·{v}</span></span>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>

      {total === 0 && (
        <div className="parchment build-empty">
          <div style={{ fontSize: '3rem', color: 'var(--parch-4)', marginBottom: 8 }}>✦</div>
          <h3 className="rubric" style={{ marginBottom: 6 }}>The page lies blank</h3>
          <p style={{ fontStyle: 'italic', color: 'var(--ink-3)', maxWidth: 480, margin: '0 auto' }}>
            Open any tree, toggle <strong>allocation mode</strong>, and start learning talents. They appear here, organised by atlas.
          </p>
        </div>
      )}

      {sections.map(sec => (
        <div key={sec.atlas.id} className="parchment build-section" data-color={sec.atlas.trees[0] && sec.atlas.trees[0].color}>
          <div className="build-section-head">
            <h3 className="rubric">{sec.atlas.name}</h3>
            <span className="mono build-count-badge">
              {sec.groups.reduce((s, g) => s + g.trees.reduce((ss, t) => ss + t.items.length, 0), 0)} talents
            </span>
          </div>
          {sec.groups.map(g => (
            <div key={g.key} className="build-group" data-color={g.color}>
              <div className="build-group-head">
                <span className="small-caps build-group-label">{g.label}</span>
                {g.colorsStr && <span className="mono" style={{ color: 'var(--ink-4)', fontSize: '0.72rem', marginLeft: 8 }}>{g.colorsStr}</span>}
              </div>
              {g.trees.map(({ tree, items }) => (
                <div key={tree.id} className="build-tree">
                  <button className="build-tree-name" onClick={() => onOpenTree(tree.id)}>
                    {tree.name} <span className="mono" style={{ color: 'var(--ink-4)' }}>· {items.length}</span>
                  </button>
                  <ul className="build-talent-list">
                    {items.map((t, i) => (
                      <li key={i} className="build-talent">
                        <div className="build-talent-head">
                          <span className="build-talent-name">{t.name}</span>
                          <span className="mono build-talent-meta">{t.action}{t.cost && t.cost !== '—' ? ' · ' + t.cost : ''}</span>
                        </div>
                        <div className="build-talent-desc">{t.description}</div>
                      </li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

        <TreePage
          tree={treesById[activeTree]}
          siblings={(() => {
            const t = treesById[activeTree];
            return atlases[t.atlas].trees.filter(s => s.group === t.group);
          })()}
          onPickTree={pickTree}
          onBack={() => setView(VIEW_ATLAS)} />
      )}

      {view === VIEW_SEARCH && (
        <SearchView allTalents={allTalents} treesById={treesById} onOpenTree={pickTree} />
      )}

      {view === VIEW_STATS && (
        <StatsView atlases={atlases} />
      )}

      {view === VIEW_BUILD && (
        <BuildView atlases={atlases} treesById={treesById} onOpenTree={pickTree} />
      )}

      <footer style={{ textAlign: 'center', color: 'var(--parch-3)', fontSize: '0.8rem', fontStyle: 'italic', padding: 16 }}>
        The Atlas · Edha campaign · CosmereRPG framework
      </footer>
      {window.TweaksPanel && <window.TweaksPanel />}
    </div>
  );
}

window.App = App;

</script>

<!-- Boot -->
<script type="text/babel">
(function() {
  const data = window.__DATA__;
  const atlases = window.Atlases.buildAtlases(data);
  const treesById = {};
  const allTalents = [];
  for (const a of Object.values(atlases)) {
    for (const tr of a.trees) {
      treesById[tr.id] = tr;
      for (const t of tr.talents) allTalents.push(t);
    }
  }
  window.__ATLASES__ = { atlases, treesById, allTalents };
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App atlases={atlases} allTalents={allTalents} treesById={treesById} />);
})();
</script>
</body>
</html>
