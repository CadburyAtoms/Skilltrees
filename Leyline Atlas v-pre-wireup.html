Frenzy","Name":"Battle Fever","Action":"∞","Cost":"","Prerequisites":"Incite","Description":"Each time damage is dealt within Attunement Range, you and allies gain +1 to your next test (max = Rank). Resets at start of your turn."},{"Atlas":"leyline","Path":"Red","Specialty":"Frenzy","Name":"Shatter Focus","Action":"⟲","Cost":"","Prerequisites":"Red 2+; Emotional Overload or Battle Fever","Description":"When a creature within Attunement Range fails a test, it loses 1 focus. Once per round."},{"Atlas":"leyline","Path":"Red","Specialty":"Frenzy","Name":"Reckless Gambit","Action":"★","Cost":"Opportunity","Prerequisites":"Shatter Focus","Description":"When a creature within Attunement Range takes damage, spend Opportunity to grant it advantage on its next test. It then suffers Exhausted[2]."},{"Atlas":"leyline","Path":"Red","Specialty":"Frenzy","Name":"Contagious Fury","Action":"★","Cost":"","Prerequisites":"Shatter Focus","Description":"When you succeed on an Influence test that forces a creature to act, the next creature to attack that target rolls the Plot Die."},{"Atlas":"leyline","Path":"Red","Specialty":"Frenzy","Name":"Frenzied Tempo","Action":"∞","Cost":"","Prerequisites":"Reckless Gambit or Contagious Fury","Description":"When you take a Fast turn, your Influence tests gain an advantage until end of turn."},{"Atlas":"leyline","Path":"Red","Specialty":"Frenzy","Name":"Tyrant's Crescendo","Action":"★","Cost":"","Prerequisites":"Frenzied Tempo; Red 3+","Description":"When a creature within Attunement Range takes damage for the second time in a round, it becomes Disoriented."},{"Atlas":"leyline","Path":"Green","Specialty":"Key","Name":"Green Leyline Attunement","Action":"∞","Cost":"","Prerequisites":"","Description":"When you Draw Mana, create difficult terrain within [Size] of a point in Attunement Range."},{"Atlas":"leyline","Path":"Green","Specialty":"Territory","Name":"Primal Awareness","Action":"∞","Cost":"","Prerequisites":"","Description":"You can't be Surprised on natural terrain. Gain Advantage on Perception tests to detect or track creatures."},{"Atlas":"leyline","Path":"Green","Specialty":"Territory","Name":"Grasping Vines","Action":"★","Cost":"","Prerequisites":"Primal Awareness","Description":"When you hit a creature in your difficult terrain with a Physical test, it is also Restrained until end of your next turn."},{"Atlas":"leyline","Path":"Green","Specialty":"Territory","Name":"Territorial Instinct","Action":"★","Cost":"Opportunity","Prerequisites":"Primal Awareness","Description":"When an enemy in your Attunement Range tries to Disengage, spend Opportunity to reduce its movement to 0 this turn."},{"Atlas":"leyline","Path":"Green","Specialty":"Territory","Name":"Thorn Field","Action":"∞","Cost":"","Prerequisites":"Grasping Vines or Territorial Instinct","Description":"Your difficult terrain deals half [Tier][Die] Keen damage to creatures that enter it or start their turn in it."},{"Atlas":"leyline","Path":"Green","Specialty":"Territory","Name":"Verdant Resilience","Action":"∞","Cost":"","Prerequisites":"Thorn Field; Green 2+","Description":"At the start of your turn, if you didn't move on your last turn, regain HP equal to your tier."},{"Atlas":"leyline","Path":"Green","Specialty":"Territory","Name":"Territorial Claim","Action":"★","Cost":"Opportunity","Prerequisites":"Verdant Resilience","Description":"When you create difficult terrain, spend Opportunity to prevent creatures in it from willingly moving away until end of your next turn."},{"Atlas":"leyline","Path":"Green","Specialty":"Territory","Name":"Pack Sense","Action":"★","Cost":"","Prerequisites":"Territorial Claim","Description":"When an ally tests against a creature in your difficult terrain, they add half [Die] to the result."},{"Atlas":"leyline","Path":"Green","Specialty":"Territory","Name":"Apex Predator","Action":"∞","Cost":"","Prerequisites":"Pack Sense; Green 3+","Description":"While three or more enemies are within your Attunement Range, gain an advantage on all Physical and Cognitive tests."},{"Atlas":"leyline","Path":"Green","Specialty":"Restoration","Name":"Mender's Instinct","Action":"∞","Cost":"","Prerequisites":"","Description":"When an ally in Attunement Range drops below half HP, you know their condition. Your next healing talent on them heals additional HP equal to tier."},{"Atlas":"leyline","Path":"Green","Specialty":"Restoration","Name":"Verdant Mend","Action":"▶","Cost":"1 Investiture","Prerequisites":"Mender's Instinct","Description":"Touch a willing creature and restore HP equal to [Tier][Die] x 2."},{"Atlas":"leyline","Path":"Green","Specialty":"Restoration","Name":"Root and Branch","Action":"★","Cost":"","Prerequisites":"Mender's Instinct","Description":"When two or more enemies end their turn adjacent to each other within Attunement Range, gain Temporary HP equal to tier."},{"Atlas":"leyline","Path":"Green","Specialty":"Restoration","Name":"Natural Recovery","Action":"★","Cost":"","Prerequisites":"Verdant Mend or Root and Branch","Description":"When you restore HP with a Green Restoration talent, also remove one condition: Disoriented, Weakened, or Prone."},{"Atlas":"leyline","Path":"Green","Specialty":"Restoration","Name":"Hardy","Action":"∞","Cost":"","Prerequisites":"Natural Recovery; Green 2+","Description":"Gain +1 maximum HP per level, including previous levels."},{"Atlas":"leyline","Path":"Green","Specialty":"Restoration","Name":"Collected","Action":"∞","Cost":"","Prerequisites":"Natural Recovery; Green 2+","Description":"Increase your Cognitive and Spiritual defenses by 2."},{"Atlas":"leyline","Path":"Green","Specialty":"Restoration","Name":"Reknit Form","Action":"▶▶","Cost":"1 Investiture; 1 Focus","Prerequisites":"Hardy or Collected","Description":"Touch a creature to remove one Injury. Shallow: automatic. Vicious: DC 15. Permanent: DC 20."},{"Atlas":"leyline","Path":"Green","Specialty":"Restoration","Name":"Vital Surge","Action":"★","Cost":"","Prerequisites":"Reknit Form; Green 3+","Description":"When you restore HP to a creature below half HP, it also gains Temporary HP equal to half [Tier][Die]."},{"Atlas":"leyline","Path":"Green","Specialty":"Instinct","Name":"Predator's Instinct","Action":"∞","Cost":"","Prerequisites":"","Description":"Gain Advantage tracking wounded or Injured creatures. You sense fear in conversation without testing."},{"Atlas":"leyline","Path":"Green","Specialty":"Instinct","Name":"Pack Hunter","Action":"★","Cost":"","Prerequisites":"Predator's Instinct","Description":"When you or an ally moves adjacent to a creature another ally is adjacent to, both gain an advantage on their next test against it."},{"Atlas":"leyline","Path":"Green","Specialty":"Instinct","Name":"Scent the Weak","Action":"★","Cost":"","Prerequisites":"Predator's Instinct","Description":"You know which creature within Attunement Range has the lowest HP. Your first test against it each round gains advantage."},{"Atlas":"leyline","Path":"Green","Specialty":"Instinct","Name":"Pack Pressure","Action":"∞","Cost":"","Prerequisites":"Green 2+; Pack Hunter or Scent the Weak","Description":"When you and an ally are both adjacent to a creature, gain an advantage on Physical tests against it and add half [Tier][Die] damage."},{"Atlas":"leyline","Path":"Green","Specialty":"Instinct","Name":"Primal Sight","Action":"∞","Cost":"","Prerequisites":"Pack Pressure","Description":"You are immune to magical illusions and concealment within Attunement Range. Automatically detect deceptive Influence targeting you or adjacent allies."},{"Atlas":"leyline","Path":"Green","Specialty":"Instinct","Name":"Surefooted","Action":"∞","Cost":"","Prerequisites":"Pack Pressure","Description":"Increase your Speed by 10 ft. Reduce damage from falls and difficult terrain by half [Tier][Die]."},{"Atlas":"leyline","Path":"Green","Specialty":"Instinct","Name":"Packmate's Warning","Action":"⟲","Cost":"","Prerequisites":"Primal Sight or Surefooted","Description":"When an ally within 10 ft is targeted by an attack they can't see, grant them +2 to their defense against it."},{"Atlas":"leyline","Path":"Green","Specialty":"Instinct","Name":"Natural Order","Action":"∞","Cost":"","Prerequisites":"Packmate's Warning; Green 3+","Description":"Enemies within your Attunement Range cannot benefit from illusions, magical concealment, or advantage gained from deception."},{"Atlas":"deity","Path":"Death","Specialty":"Key","Name":"Death's Threshold","Action":"∞","Cost":"","Prerequisites":"Green 2+; Black 2+","Description":"When you reduce a creature to 0 HP, recover Investiture equal to your tier. You can sense living creatures within your Attunement Range that are below half their maximum HP."},{"Atlas":"deity","Path":"Death","Specialty":"Death","Name":"Withering Touch","Action":"▶","Cost":"2 Investiture","Prerequisites":"Death's Threshold","Description":"Melee attack. On hit, deal Vital damage equal to [Tier][Die] + Willpower. The target cannot regain HP until the start of your next turn."},{"Atlas":"deity","Path":"Death","Specialty":"Death","Name":"Consuming Decay","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Death's Threshold","Description":"Choose a creature in Attunement Range that is Weakened or below half HP. It takes Vital damage equal to [Tier][Die] at the start of each of its turns for the scene. You heal HP equal to half the Vital damage dealt. One instance per creature."},{"Atlas":"deity","Path":"Death","Specialty":"Death","Name":"Necrotic Cascade","Action":"▶","Cost":"1 Investiture","Prerequisites":"Withering Touch","Description":"When a creature in your Attunement Range drops to 0 HP, each enemy within 10 ft of it takes Spirit damage equal to [Tier][Die]. Triggers automatically after initial activation."},{"Atlas":"deity","Path":"Death","Specialty":"Death","Name":"Gentle Passage","Action":"▶","Cost":"1 Investiture","Prerequisites":"Withering Touch","Description":"Touch a willing or unconscious creature. Remove one Injury. The creature falls into restful sleep for 1 minute (or until damaged). On waking, it regains HP equal to [Tier][Die] + Awareness."},{"Atlas":"deity","Path":"Death","Specialty":"Death","Name":"Compost","Action":"▶","Cost":"1 Investiture","Prerequisites":"Consuming Decay","Description":"Target a dead creature or destroyed object in Attunement Range. Over 1 minute, it decomposes entirely. You and each ally within 15 ft regain HP equal to tier + [Tier][Die]. Lush difficult terrain appears in the space."},{"Atlas":"deity","Path":"Death","Specialty":"Death","Name":"Natural Conclusion","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Gentle Passage or Compost","Description":"Choose a creature in Attunement Range suffering from a disease, curse, or persistent magical effect. End one such effect. If the effect was sustained by another creature's Investiture, that creature takes Spirit damage equal to [Tier][Die]."},{"Atlas":"deity","Path":"Death","Specialty":"Death","Name":"Speak with the Fallen","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Natural Conclusion","Description":"Touch the remains of a creature that died within the last 24 hours. Ask up to 3 questions; the spirit answers truthfully but briefly. Each additional use on the same remains within 24 hours costs +2 Investiture."},{"Atlas":"deity","Path":"Death","Specialty":"Death","Name":"Raise Dead","Action":"▶▶▶","Cost":"4 Investiture","Prerequisites":"Natural Conclusion","Description":"Touch a creature that died within the last hour. It returns to life with 1 HP and one additional Injury. The raised creature acts on your initiative and is Disoriented (disadvantage on all tests) until end of its next turn. Once per scene."},{"Atlas":"deity","Path":"Death","Specialty":"Death","Name":"Death Ward","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Speak with the Fallen","Description":"Choose a creature in Attunement Range. For the scene, the first time it would drop to 0 HP, it instead drops to 1 HP and gains temporary HP equal to [Tier][Die] + Presence. Effect then ends."},{"Atlas":"deity","Path":"Chaos","Specialty":"Key","Name":"Chaos Attunement","Action":"∞","Cost":"","Prerequisites":"Blue 2+; Black 2+","Description":"When you activate a Chaos talent, roll a d6. On 5-6, Investiture cost reduced by 1 (min 1). On 1, the effect also targets you or an ally (GM determines how). You sense sustained magical effects within Attunement Range."},{"Atlas":"deity","Path":"Chaos","Specialty":"Chaos","Name":"Unravel","Action":"▶","Cost":"2 Investiture","Prerequisites":"Chaos Attunement","Description":"Target a creature in Attunement Range benefiting from a magical buff, stance, or sustained ability. Intellect test vs target's Spiritual Defense. On success, end one such effect; target takes Spirit damage equal to [Tier][Die]."},{"Atlas":"deity","Path":"Chaos","Specialty":"Chaos","Name":"Entropic Field","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Chaos Attunement","Description":"Create a 15 ft radius zone at a point in Attunement Range. For the scene, no creature in the zone can benefit from advantage, and all sustained magical effects in the zone cost +1 Investiture per turn to maintain."},{"Atlas":"deity","Path":"Chaos","Specialty":"Chaos","Name":"Sever the Pattern","Action":"▶","Cost":"1 Investiture","Prerequisites":"Unravel","Description":"When a creature in Attunement Range activates a talent, use Reaction to force a Willpower test vs your Cognitive Defense. On failure, the talent activates but targets a random valid target (including caster's allies)."},{"Atlas":"deity","Path":"Chaos","Specialty":"Chaos","Name":"Probability Spike","Action":"▶","Cost":"1 Investiture","Prerequisites":"Unravel","Description":"Choose a creature in Attunement Range. Its next test is altered: if the result is even, add [Tier][Die]; if odd, subtract [Tier][Die]. The creature is unaware until it manifests."},{"Atlas":"deity","Path":"Chaos","Specialty":"Chaos","Name":"Chaos Theory","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Entropic Field or Sever the Pattern","Description":"For the remainder of this round, when any creature in Attunement Range rolls a die, you may swap the result with the next die rolled by any creature in range. Usable a number of times equal to your Intellect modifier."},{"Atlas":"deity","Path":"Chaos","Specialty":"Chaos","Name":"Madman's Insight","Action":"▶","Cost":"1 Investiture","Prerequisites":"Probability Spike","Description":"Once per round, when you fail a Cognitive test, reroll it (must accept new result). If the reroll also fails, gain an advantage on your next Physical test as your mind reroutes through instinct."},{"Atlas":"deity","Path":"Chaos","Specialty":"Chaos","Name":"Twist Fate","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Chaos Theory or Madman's Insight","Description":"When a creature in Attunement Range makes a test, use Reaction to force a reroll. You choose which result is used. Cannot target the same creature more than once per scene."},{"Atlas":"deity","Path":"Chaos","Specialty":"Chaos","Name":"Reality Stutter","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Twist Fate","Description":"Choose a point in Attunement Range. Every creature within 15 ft is teleported to a random unoccupied space within 30 ft. Teleported creatures are Disoriented until end of their next turn. You may exclude yourself."},{"Atlas":"deity","Path":"Chaos","Specialty":"Chaos","Name":"Schrodinger's Gambit","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Twist Fate","Description":"Declare two different legal actions. Roll d6: on 1-3 the first occurs, on 4-6 the second. Whichever occurs has one attribute doubled (damage, healing, range, or duration — choose one). Occurs immediately."},{"Atlas":"deity","Path":"Order","Specialty":"Key","Name":"Lawkeeper's Eye","Action":"∞","Cost":"","Prerequisites":"White 2+; Blue 2+","Description":"Sense lies spoken within Attunement Range (feel dissonance, don't learn truth). Creatures that break a promise or oath in range are Marked (you know their location for 1 hour)."},{"Atlas":"deity","Path":"Order","Specialty":"Order","Name":"Binding Clause","Action":"▶","Cost":"1 Investiture","Prerequisites":"Lawkeeper's Eye","Description":"Choose a creature in Attunement Range. Declare a prohibited action. Willpower test vs your Cognitive Defense. On failure, the prohibited action spend 2 focus. Lasts until scene end or creature succeeds Willpower test at start of its turn."},{"Atlas":"deity","Path":"Order","Specialty":"Order","Name":"Contempt of Court","Action":"⟲","Cost":"","Prerequisites":"Binding Clause","Description":"When a creature violates a Binding Clause or breaks a witnessed oath, it takes Spirit damage equal to [Tier][Die] x 2 and is Stunned until end of its next turn. Triggers automatically, no Reaction needed."},{"Atlas":"deity","Path":"Order","Specialty":"Order","Name":"Legal Precedent","Action":"◇","Cost":"","Prerequisites":"Binding Clause","Description":"When you successfully apply Binding Clause, apply the same clause to one additional creature in range as free action (same test required). Your Binding Clauses cannot be dispelled by non-deity magic."},{"Atlas":"deity","Path":"Order","Specialty":"Order","Name":"Chain of Command","Action":"▶","Cost":"1 Investiture","Prerequisites":"Contempt of Court or Legal Precedent","Description":"Choose up to 3 allies in Attunement Range. For the scene, when you Assist one, all designated creatures gain the benefit. Designated creatures gain +1 to tests when adjacent to another designated creature."},{"Atlas":"deity","Path":"Order","Specialty":"Order","Name":"Institutional Authority","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Chain of Command","Description":"For the scene, allies in Attunement Range that can see you gain +1 to all defenses. Bonus increases to +2 if also affected by Chain of Command."},{"Atlas":"deity","Path":"Order","Specialty":"Order","Name":"Collective Discipline","Action":"⟲","Cost":"","Prerequisites":"Chain of Command","Description":"When an ally in Attunement Range would fail a Cognitive test, use Reaction: it uses your Willpower modifier instead. Usable Presence times per scene."},{"Atlas":"deity","Path":"Order","Specialty":"Order","Name":"Sacred Oath","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Institutional Authority or Collective Discipline","Description":"You and a willing creature in touch range swear a Sacred Oath (defined at casting). For the scene, both gain +1 to all tests while pursuing the oath's goal. Acting against the oath deals [Tier][Die] x 2 Spirit damage and ends it."},{"Atlas":"deity","Path":"Order","Specialty":"Order","Name":"Divine Judgment","Action":"▶▶▶","Cost":"3 Investiture","Prerequisites":"Sacred Oath","Description":"Choose a creature in range that has broken an oath, lied to you, or violated a declared law. For the scene: disadvantage on all tests, -2 defenses, cannot benefit from magical healing. Ends if creature publicly confesses and accepts your penalty."},{"Atlas":"deity","Path":"Order","Specialty":"Order","Name":"Unbreakable Pact","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Sacred Oath","Description":"Upgrade an existing Sacred Oath. Both oath-sworn share telepathic link, can spend each other's Investiture (with permission). When one drops to 0 HP, the other takes a free turn. Cannot be broken except by mutual consent."},{"Atlas":"deity","Path":"Life","Specialty":"Key","Name":"Pulse of Life","Action":"∞","Cost":"","Prerequisites":"Green 2+; Blue 2+","Description":"When you heal a creature, it gains temporary HP equal to tier. You can sense current HP and Injury status of any creature within Attunement Range."},{"Atlas":"deity","Path":"Life","Specialty":"Life","Name":"Surgical Precision","Action":"▶","Cost":"1 Investiture","Prerequisites":"Pulse of Life","Description":"Touch a creature. Intellect test (DC 15). On success, heal [Tier][Die] x 2 and remove one condition (Weakened, Disoriented, or Slowed). On failure, heal [Tier][Die] only. May self-target."},{"Atlas":"deity","Path":"Life","Specialty":"Life","Name":"Vital Diagram","Action":"▶","Cost":"1 Investiture","Prerequisites":"Pulse of Life","Description":"Choose a creature in Attunement Range. For the scene, know its exact HP, max HP, conditions, and Physical/Spiritual defenses. You and allies attacking it deal bonus Vital damage equal to your Intellect."},{"Atlas":"deity","Path":"Life","Specialty":"Life","Name":"Overgrowth","Action":"▶","Cost":"1 Investiture","Prerequisites":"Surgical Precision or Vital Diagram","Description":"Choose a creature in Attunement Range. It regains [Tier][Die] + Awareness HP and grows natural armor (+1 Deflect until end of scene, stacks to 3). If at full HP, excess becomes temporary HP."},{"Atlas":"deity","Path":"Life","Specialty":"Life","Name":"Immunological Purge","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Overgrowth","Description":"Touch a creature with disease, poison, or parasitic effect. End all such effects. For the scene, the creature is immune to further applications of those specific effects."},{"Atlas":"deity","Path":"Life","Specialty":"Life","Name":"Adaptive Mutation","Action":"▶","Cost":"2 Investiture","Prerequisites":"Overgrowth","Description":"Touch a willing creature. Choose one biological adaptation: Bone Spurs (melee attacks deal additional Keen damage equal to tier), Venom Glands (melee hits inflict Afflicted[half [Tier][Die] Vital]), or Dense Tissue (+2 Deflect and immune to forced movement). Scene duration. One mutation per creature. Dismiss and reapply as full action."},{"Atlas":"deity","Path":"Life","Specialty":"Life","Name":"Primal Regeneration","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Immunological Purge or Adaptive Mutation","Description":"Touch a willing creature. For the scene, at start of each turn it regains tier + 1 HP. Regeneration ends if it takes Vital or Spirit damage. Also regrows missing limbs/organs over 1 hour."},{"Atlas":"deity","Path":"Life","Specialty":"Life","Name":"Forced Evolution","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Primal Regeneration","Description":"Touch a willing creature. For the scene: max HP increases by [Tier][Die], +1 Strength, +1 Speed, and natural/unarmed attacks deal Vital damage equal to tier. When effect ends, creature takes an Injury."},{"Atlas":"deity","Path":"Life","Specialty":"Life","Name":"Champion of Life","Action":"▶▶▶","Cost":"3 Investiture","Prerequisites":"Forced Evolution","Description":"Touch a willing creature (may be self). For scene: regenerate [Tier][Die] HP per turn, immune to disease and poison, natural attacks deal bonus Energy damage equal to tier. Whenever you heal a creature within reach, you may make a free unarmed strike against an enemy within reach. When effect ends, target takes an Injury."},{"Atlas":"deity","Path":"Life","Specialty":"Life","Name":"Lifeline","Action":"▶","Cost":"1 Investiture","Prerequisites":"Primal Regeneration","Description":"Choose a creature in Attunement Range. For the scene, when it takes damage, you may take up to half instead (Spirit damage, bypasses Deflect). When you take damage this way, target heals HP equal to tier."},{"Atlas":"deity","Path":"Sovereignty","Specialty":"Key","Name":"Sovereign's Mandate","Action":"∞","Cost":"","Prerequisites":"Black 2+; White 2+","Description":"At the start of each turn, choose one: one enemy in Attunement Range loses temporary HP equal to your ranks in Sovereignty (diminish), OR one ally in Attunement Range gains temporary HP equal to ranks in Sovereignty (elevate). You are immune to disease."},{"Atlas":"deity","Path":"Sovereignty","Specialty":"Sovereignty","Name":"Sovereign's Awareness","Action":"▶","Cost":"1 Investiture","Prerequisites":"Sovereign's Mandate","Description":"Scene: sense all creatures within Attunement Range. Know their relative HP (full / above half / below half / critical), active conditions, and whether they are sustained by magical effects. You cannot be deceived about a creature's status while this is active."},{"Atlas":"deity","Path":"Sovereignty","Specialty":"Sovereignty","Name":"Blight","Action":"▶","Cost":"1 Investiture","Prerequisites":"Sovereign's Mandate","Description":"Choose a creature in Attunement Range. Test Sovereignty vs Spiritual. On a success, reduce the the die size for all damage rolls until the character finishes a long rest. "},{"Atlas":"deity","Path":"Sovereignty","Specialty":"Sovereignty","Name":"Edict of Decline","Action":"▶","Cost":"1 Investiture","Prerequisites":"Sovereign's Awareness or Blight","Description":"Choose a creature in Attunement Range. Scene: it cannot benefit from buffs, temporary HP, or positive stat modifications from external sources. It can still heal and use its own talents normally. Target may Willpower test vs your Cognitive Defense at start of each turn to end the effect."},{"Atlas":"deity","Path":"Sovereignty","Specialty":"Sovereignty","Name":"Boon","Action":"▶","Cost":"1 Investiture","Prerequisites":"Edict of Decline","Description":"Choose an ally in Attunement Range. Increase the die size for all damage rolls made by that character until the end of the scene."},{"Atlas":"deity","Path":"Sovereignty","Specialty":"Sovereignty","Name":"Decree","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Edict of Decline","Description":"Declare a law for a 30 ft radius centered on you (scene). Choose one: \"None shall flee\" (leaving takes [Tier][Die] Spirit damage), \"None shall mend\" (healing halved), \"None shall hide\" (disadvantage on Stealth tests), \"None shall stand alone\" (isolated creatures take Spirit damage equal to your Sovereignty modifier per turn). Change decree once per round as free action."},{"Atlas":"deity","Path":"Sovereignty","Specialty":"Sovereignty","Name":"Equilibrium","Action":"▶","Cost":"1 Investiture","Prerequisites":"Boon or Decree","Description":"Choose two creatures in Attunement Range. Average their current HP totals (round down). Both are set to the new total. Cannot reduce below 1 HP or raise above maximum. One creature must be willing or unconscious."},{"Atlas":"deity","Path":"Sovereignty","Specialty":"Sovereignty","Name":"Sovereign's Investiture","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Equilibrium","Description":"Touch a willing creature. Scene: it gains +2 to all tests. When the effect ends, the creature is Exhausted[4] and takes an Injury."},{"Atlas":"deity","Path":"Sovereignty","Specialty":"Sovereignty","Name":"Seal of Exile","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Equilibrium","Description":"Choose up to 3 creatures in Attunement Range. Scene, choose one: Imprisonment (targets cannot leave your Decree area voluntarily; if forced out, must return next action) or Banishment (targets cannot enter your Decree area voluntarily; if forced in, must leave next action). Requires active Decree."},{"Atlas":"deity","Path":"Sovereignty","Specialty":"Sovereignty","Name":"Final Judgment","Action":"▶▶▶","Cost":"3 Investiture","Prerequisites":"Sovereign's Investiture or Seal of Exile","Description":"Scene: at the start of each of your turns, designate one creature in Attunement Range as Elevated (+1 all tests, +1 defenses, regain HP equal to tier per turn) or Condemned (-1 all tests, -1 defenses, Spirit damage equal to tier per turn)."},{"Atlas":"deity","Path":"Knowledge","Specialty":"Key","Name":"Beginner's Luck","Action":"∞","Cost":"","Prerequisites":"Red 2+; Green 2+","Description":"The first time each scene you attempt something you've never done before (GM discretion), gain an advantage. You can sense when a creature or object in Attunement Range is concealing information."},{"Atlas":"deity","Path":"Knowledge","Specialty":"Knowledge","Name":"Pattern Recognition","Action":"▶","Cost":"1 Investiture","Prerequisites":"Beginner's Luck","Description":"After observing a creature for 1 round, learn one (your choice): highest stat, most damaging attack, or one vulnerability/resistance. Each subsequent round reveals an additional fact."},{"Atlas":"deity","Path":"Knowledge","Specialty":"Knowledge","Name":"Predator's Taxonomy","Action":"▶","Cost":"1 Investiture","Prerequisites":"Pattern Recognition","Description":"After using Pattern Recognition on a creature, for the scene: you and allies in Attunement Range gain +1 to attacks vs that creature. First hit each round deals bonus damage equal to Awareness."},{"Atlas":"deity","Path":"Knowledge","Specialty":"Knowledge","Name":"Environmental Reading","Action":"▶","Cost":"1 Investiture","Prerequisites":"Beginner's Luck","Description":"Sense ecological history of current location. Learn: creatures that passed through in last 24 hours, environmental hazards within 120 ft, hidden passages/traps/buried objects within 60 ft."},{"Atlas":"deity","Path":"Knowledge","Specialty":"Knowledge","Name":"Reckless Experiment","Action":"▶","Cost":"1 Investiture","Prerequisites":"Environmental Reading or Pattern Recognition","Description":"Declare a hypothesis about a creature/situation. Act to test it. If correct, advantage on all related tests for the scene. If wrong, take [Tier][Die] damage but learn the correct answer."},{"Atlas":"deity","Path":"Knowledge","Specialty":"Knowledge","Name":"Trial and Error","Action":"∞","Cost":"","Prerequisites":"Reckless Experiment","Description":"When you fail a test, gain cumulative +1 to that type of test for the scene (max +3). Bonus resets on success."},{"Atlas":"deity","Path":"Knowledge","Specialty":"Knowledge","Name":"Passionate Breakthrough","Action":"▶▶","Cost":"","Prerequisites":"Reckless Experiment","Description":"Once per scene, on a critical hit or critical success: regain 2 Investiture, advantage on next two tests, and learn one secret about the target or situation (GM provides significant hidden information)."},{"Atlas":"deity","Path":"Knowledge","Specialty":"Knowledge","Name":"Shared Revelation","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Passionate Breakthrough or Trial and Error","Description":"Share something learned through Pattern Recognition, Reckless Experiment, or similar. Up to 3 allies in Attunement Range gain the same knowledge and associated mechanical benefits for the scene."},{"Atlas":"deity","Path":"Knowledge","Specialty":"Knowledge","Name":"The Eureka Moment","Action":"▶▶▶","Cost":"3 Investiture","Prerequisites":"Shared Revelation","Description":"Scene: whenever you or an ally in Attunement Range learns new information (talents, tests, observation), all allies in range heal 1 HP and gain +1 to next test."},{"Atlas":"deity","Path":"Knowledge","Specialty":"Knowledge","Name":"Forbidden Knowledge","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Shared Revelation","Description":"Ask the GM one question about the current scene, encounter, or creature. The GM must answer truthfully and completely. You take Spirit damage equal to [Tier][Die] (cannot be reduced or prevented). Knowledge is permanent."},{"Atlas":"deity","Path":"Fate","Specialty":"Key","Name":"Thread Sight","Action":"∞","Cost":"","Prerequisites":"White 2+; Green 2+","Description":"At the start of each scene, the GM privately tells you one true statement about what will happen for the scene (vague but accurate). You cannot be Surprised."},{"Atlas":"deity","Path":"Fate","Specialty":"Fate","Name":"Read the Threads","Action":"▶","Cost":"1 Investiture","Prerequisites":"Thread Sight","Description":"Choose a creature in Attunement Range. Glimpse its immediate future: know what action it intends next turn. Gain +2 to defenses against that creature until end of your next turn."},{"Atlas":"deity","Path":"Fate","Specialty":"Fate","Name":"Inevitable Outcome","Action":"▶","Cost":"1 Focus","Prerequisites":"Read the Threads","Description":"After you or an ally in Attunement Range makes a test (before GM announces result), declare success. Costs 1 focus in addition to Investiture. Once per scene."},{"Atlas":"deity","Path":"Fate","Specialty":"Fate","Name":"Prescient Dodge","Action":"∞","Cost":"1 Investiture","Prerequisites":"Read the Threads","Description":"When hit by a creature you've used Read the Threads on, spend 1 Investiture to reduce damage by [Tier][Die] + Awareness. If reduced to 0, move 5 ft without provoking."},{"Atlas":"deity","Path":"Fate","Specialty":"Fate","Name":"Prophecy of Order","Action":"▶","Cost":"1 Investiture","Prerequisites":"Inevitable Outcome or Prescient Dodge","Description":"Declare a prediction about the scene. If it comes true, all allies who heard it gain an advantage on next test and heal tier HP. If it fails, you lose 1 focus."},{"Atlas":"deity","Path":"Fate","Specialty":"Fate","Name":"Ordained Formation","Action":"▶","Cost":"1 Investiture","Prerequisites":"Prophecy of Order","Description":"Designate up to 4 specific spaces in Attunement Range. Allies in those positions gain +1 to all defenses and +1 to attack tests. Lasts for scene or until ally moves away."},{"Atlas":"deity","Path":"Fate","Specialty":"Fate","Name":"Fate's Shield","Action":"▶","Cost":"1 Investiture","Prerequisites":"Prophecy of Order","Description":"Choose an ally in Attunement Range. Next time it takes damage this scene, reduce by [Tier][Die] + Presence. If source was predicted by Thread Sight, reduce by additional [Tier][Die]."},{"Atlas":"deity","Path":"Fate","Specialty":"Fate","Name":"Weave the Thread","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Ordained Formation or Fate's Shield","Description":"Choose two willing creatures in Attunement Range. Fates linked for scene: when one takes damage, other may take up to half instead. When one is healed, other heals half the amount."},{"Atlas":"deity","Path":"Fate","Specialty":"Fate","Name":"Rewrite Fate","Action":"▶▶▶","Cost":"3 Investiture","Prerequisites":"Weave the Thread","Description":"Once this scene, after any die roll by any creature in Attunement Range, replace the result with any value from 1 to die maximum. The roller is unaware fate intervened."},{"Atlas":"deity","Path":"Fate","Specialty":"Fate","Name":"Thread of Inevitability","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Weave the Thread","Description":"Choose a creature in Attunement Range. Declare one thing that WILL happen to it this scene. The first time it could naturally occur, it automatically succeeds (no test). Wasted if it never naturally occurs."},{"Atlas":"deity","Path":"Civilization","Specialty":"Key","Name":"Builder's Oath","Action":"∞","Cost":"","Prerequisites":"Red 2+; White 2+","Description":"Repair mundane objects by touch (1 min per repair). Deal double damage to structures and constructs. Allies in Attunement Range gain +1 HP when completing a short rest. Spend 10 minutes and 1 Investiture to create a Basic Construct (HP = tier x 2, Speed 20 ft, no attacks, follows simple verbal commands, noncombat)."},{"Atlas":"deity","Path":"Civilization","Specialty":"Civilization","Name":"Forge Servant","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Builder's Oath","Description":"Create a Combat Construct within touch range. It acts on your initiative after your turn, following verbal commands. One at a time (see Expanded Workshop). Stats: HP = [Tier][Die] + Strength x 2, Deflect = tier, Speed 20 ft, Attack = 1 melee/turn dealing [Tier][Die] Impact, defenses = yours minus 2. Immune to Influence, fear, disease, poison. Cannot heal naturally. No focus or Investiture."},{"Atlas":"deity","Path":"Civilization","Specialty":"Civilization","Name":"Emergency Repairs","Action":"▶","Cost":"1 Investiture","Prerequisites":"Forge Servant","Description":"Touch an object, weapon, armor, or Construct — fully repaired. If used on a Construct, restore [Tier][Die] + tier HP. If the Construct has a Specialized Design role, restore its role ability if disabled. Alternatively, create a temporary mundane weapon or tool from materials (1 hour)."},{"Atlas":"deity","Path":"Civilization","Specialty":"Civilization","Name":"Tempered Edge","Action":"▶","Cost":"1 Investiture","Prerequisites":"Forge Servant","Description":"Touch a weapon (yours, an ally's, or a Construct's). For scene, deals bonus Energy damage equal to tier and counts as magical. Crits deal additional [Tier][Die] Energy."},{"Atlas":"deity","Path":"Civilization","Specialty":"Civilization","Name":"Expanded Workshop","Action":"∞","Cost":"","Prerequisites":"Emergency Repairs or Tempered Edge","Description":"You can maintain up to tier Combat Constructs simultaneously. Each Construct beyond the first has half the base HP. All Constructs share your initiative and act in any order after your turn."},{"Atlas":"deity","Path":"Civilization","Specialty":"Civilization","Name":"Specialized Design","Action":"▶","Cost":"1 Investiture","Prerequisites":"Expanded Workshop","Description":"Assign a Construct a specialization: Sentinel (+tier Deflect, may intercept attacks on adjacent allies), Striker (attacks deal additional [Tier][Die] damage, +10 ft Speed), or Hauler (double base HP, can grapple using your Strength test, provides cover to adjacent allies). Role lasts until reassigned."},{"Atlas":"deity","Path":"Civilization","Specialty":"Civilization","Name":"Hearthfire","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Specialized Design","Description":"Create a Hearthfire at a point in touch range. Scene: allies within 15 ft gain +1 to Willpower tests. Adjacent allies may spend 1 Action to regain [Tier][Die] HP. Constructs adjacent to Hearthfire regain tier HP at start of your turn. Extinguished by 10+ Energy damage."},{"Atlas":"deity","Path":"Civilization","Specialty":"Civilization","Name":"Bonds of Community","Action":"▶▶▶","Cost":"3 Investiture","Prerequisites":"Hearthfire","Description":"Scene: allies and Constructs in Attunement Range are citizens. Citizens use Help at 30 ft range. When a citizen drops to 0 HP or a Construct is destroyed, all other citizens gain tier temporary HP and advantage on next test."},{"Atlas":"deity","Path":"Civilization","Specialty":"Civilization","Name":"Trade Routes","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Hearthfire","Description":"Establish a route between two points in Attunement Range (max 60 ft apart). Scene: allies and Constructs teleport between points as free action once per turn. Items passed instantaneously."},{"Atlas":"deity","Path":"Civilization","Specialty":"Civilization","Name":"Master Artificer","Action":"▶▶▶","Cost":"3 Investiture","Prerequisites":"Bonds of Community or Trade Routes","Description":"Scene: your Constructs gain +tier to attack tests and all defenses, and +10 ft Speed. You issue commands to all Constructs as free action. Destroyed Constructs may be rebuilt as a single action (still costs Investiture)."},{"Atlas":"deity","Path":"Power","Specialty":"Key","Name":"Will to Power","Action":"∞","Cost":"","Prerequisites":"Black 2+; Red 2+","Description":"When you deal damage and reduce a creature below half max HP for the first time, gain 1 temporary HP per tier. Gain Advantage on Presence tests to intimidate, command, or lead."},{"Atlas":"deity","Path":"Power","Specialty":"Power","Name":"Kneel","Action":"▶","Cost":"1 Investiture","Prerequisites":"Will to Power","Description":"Choose a creature in Attunement Range. Presence test vs Cognitive Defense. On success, target is Compelled (must use next action to move toward you or do nothing) until start of your next turn."},{"Atlas":"deity","Path":"Power","Specialty":"Power","Name":"Crown of Thorns","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Will to Power","Description":"For the scene, whenever a creature in Attunement Range fails a test against your Cognitive Defense, it takes Spirit damage equal to your Presence. This damage cannot be reduced."},{"Atlas":"deity","Path":"Power","Specialty":"Power","Name":"Absolute Authority","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Kneel","Description":"Choose a Compelled, Frightened, or Weakened creature in range. Willpower test vs your Spiritual Defense. On failure, you choose its next turn's action (cannot directly self-harm). On success, Weakened until end of its next turn."},{"Atlas":"deity","Path":"Power","Specialty":"Power","Name":"Momentum of Victory","Action":"▶","Cost":"1 Investiture","Prerequisites":"Crown of Thorns or Absolute Authority","Description":"When you reduce a creature to 0 HP or score a critical hit, immediately move up to 15 ft and make a free melee attack against a different creature in reach. This attack deals bonus damage equal to tier."},{"Atlas":"deity","Path":"Power","Specialty":"Power","Name":"Warlord's Fury","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Momentum of Victory","Description":"For the scene, melee attacks deal additional damage equal to the number of creatures you've reduced to 0 HP this scene (max bonus = tier x 2)."},{"Atlas":"deity","Path":"Power","Specialty":"Power","Name":"Unstoppable Advance","Action":"▶","Cost":"1 Investiture","Prerequisites":"Momentum of Victory","Description":"Until end of your next turn, you cannot be slowed, immobilized, or knocked prone. You may move through enemy spaces. Each enemy you move through takes Impact damage equal to [Tier][Die]."},{"Atlas":"deity","Path":"Power","Specialty":"Power","Name":"Investiture of Command","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Warlord's Fury or Unstoppable Advance","Description":"Choose up to 3 allies in Attunement Range. Each gains temporary HP equal to [Tier][Die] and advantage on next attack. You take Spirit damage equal to your tier (cannot be reduced)."},{"Atlas":"deity","Path":"Power","Specialty":"Power","Name":"Mantle of the Aspirant","Action":"▶▶▶","Cost":"3 Investiture","Prerequisites":"Investiture of Command","Description":"Scene: +2 to all defenses, melee attacks deal bonus Spirit damage equal to tier, allies in Attunement Range gain +1 to all tests. When you take damage, may redirect up to tier damage to willing allies in range."},{"Atlas":"deity","Path":"Power","Specialty":"Power","Name":"Usurper's Claim","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Investiture of Command","Description":"Target a creature in range sustaining a magical effect. Willpower test vs its Spiritual Defense. On success, seize control of that effect for the scene — you choose targets, parameters, and when it ends. Original caster cannot end it."},{"Atlas":"deity","Path":"Destruction","Specialty":"Key","Name":"Ruin Sight","Action":"∞","Cost":"","Prerequisites":"Blue 2+; Red 2+","Description":"Identify structural weakness of any object/construct in Attunement Range (1 round study or touch). Attacks vs objects deal double damage. When you damage a creature, learn its Deflect value."},{"Atlas":"deity","Path":"Destruction","Specialty":"Destruction","Name":"Pinpoint Fracture","Action":"▶","Cost":"2 Investiture","Prerequisites":"Ruin Sight","Description":"Choose a creature in Attunement Range you've damaged this scene. Your next attack ignores Deflect and deals bonus Keen damage equal to Intellect."},{"Atlas":"deity","Path":"Destruction","Specialty":"Destruction","Name":"Cascading Failure","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Ruin Sight","Description":"When you damage a creature and reduce it past an HP threshold (full, 3/4, 1/2, 1/4), its Deflect is permanently reduced by 1 for the scene. Stacks."},{"Atlas":"deity","Path":"Destruction","Specialty":"Destruction","Name":"Precision Demolition","Action":"▶","Cost":"1 Investiture","Prerequisites":"Pinpoint Fracture or Cascading Failure","Description":"Choose an object, barrier, or terrain feature in Attunement Range. Destroyed instantly if HP < [Tier][Die] x 3. If it survives, takes triple damage from your next attack. Works on magical barriers."},{"Atlas":"deity","Path":"Destruction","Specialty":"Destruction","Name":"Shatter","Action":"▶","Cost":"1 Investiture","Prerequisites":"Precision Demolition","Description":"Melee or ranged attack. On hit, deal normal damage plus bonus Energy damage equal to [Tier][Die]. Target pushed 10 ft. If target collides with object or creature, both take Impact damage equal to tier."},{"Atlas":"deity","Path":"Destruction","Specialty":"Destruction","Name":"Detonation Point","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Precision Demolition","Description":"Choose a point in Attunement Range. 20 ft radius explosion deals Energy damage equal to [Tier][Die] x 2. Creatures failing a Speed test are knocked prone. Objects under 20 HP are destroyed."},{"Atlas":"deity","Path":"Destruction","Specialty":"Destruction","Name":"Walking Ruin","Action":"▶","Cost":"1 Investiture","Prerequisites":"Shatter or Detonation Point","Description":"For the scene, spaces you move through become difficult terrain. Creatures starting turns in your trail take Impact damage equal to tier. You gain +10 ft movement speed."},{"Atlas":"deity","Path":"Destruction","Specialty":"Destruction","Name":"Controlled Demolition","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Walking Ruin","Description":"Choose a 15 ft area in Attunement Range. Selectively destroy chosen objects/terrain/barriers while leaving others untouched. Chosen creatures take Energy damage equal to [Tier][Die]. Excluded creatures are unharmed."},{"Atlas":"deity","Path":"Destruction","Specialty":"Destruction","Name":"The Unmooring","Action":"▶▶▶","Cost":"3 Investiture","Prerequisites":"Controlled Demolition","Description":"Scene: once per turn when you destroy an object/barrier or reduce a creature to 0 HP, choose: an ally within 30 ft heals [Tier][Die] HP, OR create 10 ft of clear stable ground (removing hazards/terrain)."},{"Atlas":"deity","Path":"Destruction","Specialty":"Destruction","Name":"Fault Line","Action":"▶▶","Cost":"2 Investiture","Prerequisites":"Controlled Demolition","Description":"60 ft line, 5 ft wide from you. Creatures in line take Energy damage equal to [Tier][Die] + Strength, Speed test or fall prone. Line becomes difficult terrain for the scene. Structures along line take triple damage."},{"Atlas":"heroic","Path":"Agent","Specialty":"Key","Name":"Opportunist","Action":"★","Cost":"","Prerequisites":"","Description":"Once per round, you can reroll your plot die"},{"Atlas":"heroic","Path":"Agent","Specialty":"Investigator","Name":"Watchful Eye","Action":"⟲","Cost":"","Prerequisites":"Deduction 1+","Description":"Use Opportunist on the plot die of a willing ally within 20 ft"},{"Atlas":"heroic","Path":"Agent","Specialty":"Investigator","Name":"Get 'Em Talking","Action":"▶▶","Cost":"1 Focus","Prerequisites":"Insight 2+","Description":"Spend 1 focus to test Deduction vs. Spiritual to learn the target's motivation. for the scene, you can raise the stakes on tests to leverage this motivation"},{"Atlas":"heroic","Path":"Agent","Specialty":"Investigator","Name":"Quick Analysis","Action":"◇","Cost":"2 Focus","Prerequisites":"Watchful Eye","Description":"Spend 2 focus to gain ▶▶ for Cognitive tests with Use a Skill, Gain Advantage, or an Agent talent."},{"Atlas":"heroic","Path":"Agent","Specialty":"Investigator","Name":"Baleful","Action":"∞","Cost":"","Prerequisites":"Get 'Em Talking","Description":"To resist your influence, a character must spend additional focus equal to your tier."},{"Atlas":"heroic","Path":"Agent","Specialty":"Investigator","Name":"Gather Evidence","Action":"∞","Cost":"","Prerequisites":"Quick Analysis; Insight 2+","Description":"Gain Legal Codes expertise. When you succeed on a cognitive test against a target, you become Focused."},{"Atlas":"heroic","Path":"Agent","Specialty":"Investigator","Name":"Hardy","Action":"∞","Cost":"","Prerequisites":"Baleful","Description":"Gain +1 max health per level (including previous levels)."},{"Atlas":"heroic","Path":"Agent","Specialty":"Investigator","Name":"Sleuth's Instincts","Action":"∞","Cost":"","Prerequisites":"Hardy; Deduction 3+","Description":"Gain an advantage on cognitive tests against characters whose motivation you know. You know when those characters lie to you."},{"Atlas":"heroic","Path":"Agent","Specialty":"Investigator","Name":"Close the Case","Action":"▶▶▶","Cost":"3 Focus","Prerequisites":"Hardy; Deduction 3+","Description":"Spend 3 focus to test Deduction vs. Cognitive, gaining an advantage if you know the target's motivation. On failure, the target gains an advantage against you. On success, they back down."},{"Atlas":"heroic","Path":"Agent","Specialty":"Spy","Name":"Sure Outcome","Action":"★","Cost":"2 Focus","Prerequisites":"Insight 2+","Description":"When you use Opportunist, spend 2 focus to change Opportunity to Complication 4, or any Complication to Opportunity."},{"Atlas":"heroic","Path":"Agent","Specialty":"Spy","Name":"Plausible Excuse","Action":"⟲","Cost":"2 Focus","Prerequisites":"Deception 1+","Description":"Gain Sleight of Hand expertise. When discovered skulking, spend 2 focus to feign innocence."},{"Atlas":"heroic","Path":"Agent","Specialty":"Spy","Name":"Collected","Action":"∞","Cost":"","Prerequisites":"Sure Outcome","Description":"Increase your Cognitive and Spiritual defenses by 2."},{"Atlas":"heroic","Path":"Agent","Specialty":"Spy","Name":"Cover Story","Action":"∞","Cost":"","Prerequisites":"Plausible Excuse","Description":"Gain a false identity and a relevant culture expertise."},{"Atlas":"heroic","Path":"Agent","Specialty":"Spy","Name":"Subtle Taketown","Action":"▶▶","Cost":"","Prerequisites":"Cover Story; Insight 3+","Description":"Make an unarmed attack with Insight vs. an unsuspecting target's Cognitive, raising the stakes. On a hit, they can't communicate."},{"Atlas":"heroic","Path":"Agent","Specialty":"Spy","Name":"Mighty","Action":"∞","Cost":"","Prerequisites":"Cover Story","Description":"When you hit with a weapon or unarmed attack, for each action spent, deal extra damage equal to 1 + your tier."},{"Atlas":"heroic","Path":"Agent","Specialty":"Spy","Name":"Mercurial Façade","Action":"★","Cost":"","Prerequisites":"Subtle Takedown; Deception 3+","Description":"Disguise yourself using Deception without needing physical supplies. The first character to see through your disguise is Surprised."},{"Atlas":"heroic","Path":"Agent","Specialty":"Spy","Name":"High Society Contacts","Action":"★","Cost":"2 Focus","Prerequisites":"Cover Story; [Patron in high society]","Description":"Gain High Society expertise. Spend 2 focus to add Opportunity to a test to interact in high society."},{"Atlas":"heroic","Path":"Agent","Specialty":"Thief","Name":"Risky Behavior","Action":"★","Cost":"1 Focus","Prerequisites":"","Description":"Spend 1 focus to raise the stakes on your test."},{"Atlas":"heroic","Path":"Agent","Specialty":"Thief","Name":"Cheap Shot","Action":"▶","Cost":"1 Focus","Prerequisites":"","Description":"Spend 1 focus to make an unarmed attack with Thievery vs. Cognitive, raising the stakes. On a hit, the target is Stunned."},{"Atlas":"heroic","Path":"Agent","Specialty":"Thief","Name":"Double Down","Action":"★","Cost":"","Prerequisites":"Risky Behavior","Description":"You can reroll again with Opportunist, but on Complication, you lose 2 focus."},{"Atlas":"heroic","Path":"Agent","Specialty":"Thief","Name":"Surefooted","Action":"∞","Cost":"","Prerequisites":"Cheap Shot","Description":"Your movement increases by 10. Reduce damage from falling and dangerous terrain by twice your tier."},{"Atlas":"heroic","Path":"Agent","Specialty":"Thief","Name":"Underworld Contacts","Action":"★","Cost":"2 Focus","Prerequisites":"Double Down; Patron or follower in criminal underworld","Description":"Gain Criminal Groups expertise. Spend 2 focus to add Opportunity to a social test against criminals."},{"Atlas":"heroic","Path":"Agent","Specialty":"Thief","Name":"Shadow Step","Action":"◇","Cost":"2 Focus","Prerequisites":"Surefooted; Thievery 3+","Description":"After you Disengage, spend 2 focus to test Thievery vs. each enemy's Cognitive to hide from them. You gain an advantage if in cover or obscured."},{"Atlas":"heroic","Path":"Agent","Specialty":"Thief","Name":"Fast Talker","Action":"◇","Cost":"2 Focus","Prerequisites":"Double Down; Insight 3+","Description":"Spend 2 focus to gain ▶▶ for Spiritual tests with Use a Skill, Gain Advantage, or an Agent talent."},{"Atlas":"heroic","Path":"Agent","Specialty":"Thief","Name":"Trickster's Hand","Action":"◇","Cost":"2 Focus","Prerequisites":"Surefooted; Thievery 3+","Description":"Spend 2 focus to gain ▶▶ for Physical tests with Use a Skill, Gain Advantage, or an Agent Talent."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Key","Name":"Rousing Presence","Action":"▶","Cost":"","Prerequisites":"","Description":"An ally becomes Determined until end of scene."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Diplomat","Name":"Steadfast Challenge","Action":"▶","Cost":"1 Focus","Prerequisites":"Discipline 1+","Description":"Spend 1 focus to test Discipline vs. an enemy's Spiritual. On success, they are Disoriented and gain a disadvantage on tests against you."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Diplomat","Name":"Collected","Action":"∞","Cost":"","Prerequisites":"","Description":"Increase your Cognitive and Spiritual defenses by 2."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Diplomat","Name":"Withering Retort","Action":"⟲","Cost":"","Prerequisites":"Steadfast Challenge; Discipline 2+","Description":"Use your Steadfast Challenge before an attack and increase your deflect against the attack by your ranks in Discipline."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Diplomat","Name":"Well Dressed","Action":"★","Cost":"","Prerequisites":"Steadfast Challenge","Description":"Gain Fashion expertise. While wearing Presentable armor or fashionable clothing, gain an advantage on your first Deception, Leadership, or Persuasion test."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Diplomat","Name":"Calm Appeal","Action":"∞","Cost":"1 Focus","Prerequisites":"Withering Retort; Discipline 2+","Description":"When your Steadfast Challenge makes a target Disoriented, spend 1 focus to pacify them. Resisting your Steadfast Challenge costs additional focus equal to your ranks in Discipline."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Diplomat","Name":"High Society Contacts","Action":"★","Cost":"2 Focus","Prerequisites":"Well Dressed; [Patron in high society]","Description":"Gain High Society expertise. Spend 2 focus to add Opportunity to a test to interact in high society."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Diplomat","Name":"Peaceful Solution","Action":"◇","Cost":"","Prerequisites":"Calm Appeal; Discipline 3+","Description":"If all non-minion enemies are pacified, you ase tensions and end combat."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Diplomat","Name":"Practiced Oratory","Action":"★","Cost":"Variable Focus","Prerequisites":"High Society Contacts; Persuasion 3+","Description":"When you use Rousing Resence or Steadfast Challenge, spend focus up to your ranks in Persuasion to add that many targets."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Faithful","Name":"Customary Garb","Action":"∞","Cost":"","Prerequisites":"","Description":"While wearing Prsentable armor or appropriate clothing, increase your Physical and Spriritual defenses by 2."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Faithful","Name":"Galvanzie","Action":"▶▶","Cost":"","Prerequisites":"","Description":"An ally rolls their recovery die and recovers that much focus."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Faithful","Name":"Devoted Presence","Action":"★","Cost":"1 Focus","Prerequisites":"Customary Garb; Lore 1+","Description":"When you use Rousing Presence, spend 1 focus to remove Prone, Slowed, Stunned, and Surprised from your target"},{"Atlas":"heroic","Path":"Envoy","Specialty":"Faithful","Name":"Composed","Action":"∞","Cost":"","Prerequisites":"Galvanize","Description":"Increase your max and current focus by your tier."},{"Atlas":"heroic","Path":"Envoy","Specialty":"Faithful","Name":"Stalwart Presence","Action":"★","Cost":"1 Focus","Prerequisites":"Devoted <!-- Layout engine -->
<script>
// Sugiyama-style layered layout for normalized talents.
// Exports window.Layout = { layoutTree, splitPrereqs }

function splitPrereqs(s) {
  if (!s || s === '—' || s === '-') return [];
  return s.split(/,|;|\sand\s|\sor\s/).map(x => x.trim()).filter(Boolean);
}

function layoutTree(talents) {
  const N = talents.length;
  const nameIdx = {};
  talents.forEach((t, i) => { nameIdx[t.name.toLowerCase()] = i; });

  const prereqs = talents.map(t => {
    const raw = splitPrereqs(t.prereqs);
    return raw
      .map(p => nameIdx[p.toLowerCase()])
      .filter(x => x !== undefined);
  });

  // Depth via memoized DFS, cycle-safe.
  const depth = new Array(N).fill(-1);
  function computeDepth(i, stack) {
    if (depth[i] !== -1) return depth[i];
    if (stack.has(i)) return 0;
    stack.add(i);
    if (prereqs[i].length === 0) { depth[i] = 0; stack.delete(i); return 0; }
    const dd = 1 + Math.max(...prereqs[i].map(p => computeDepth(p, stack)));
    depth[i] = dd;
    stack.delete(i);
    return dd;
  }
  for (let i = 0; i < N; i++) computeDepth(i, new Set());

  // Group by depth
  const maxDepth = Math.max(0, ...depth);
  const byDepth = [];
  for (let d = 0; d <= maxDepth; d++) byDepth.push([]);
  depth.forEach((d, i) => byDepth[d].push(i));

  // Children lookup
  const children = talents.map(() => []);
  prereqs.forEach((ps, i) => ps.forEach(p => children[p].push(i)));

  // Initial order within each layer: by index
  let order = byDepth.map(row => row.slice());

  // Assign x-positions (evenly spaced) given current order
  function xOf(row, n) {
    return row.map((_, idx) => n === 1 ? 0.5 : (idx + 0.5) / n);
  }

  // Sugiyama: iteratively reorder using barycenter of neighbors.
  // Sweep down (use parents), sweep up (use children), alternate.
  const ITERATIONS = 24;
  for (let iter = 0; iter < ITERATIONS; iter++) {
    const downPass = iter % 2 === 0;
    if (downPass) {
      for (let d = 1; d <= maxDepth; d++) {
        const prevRow = order[d - 1];
        const prevPos = {};
        prevRow.forEach((node, k) => { prevPos[node] = k; });
        const row = order[d];
        row.sort((a, b) => bary(a) - bary(b));
        function bary(node) {
          const ps = prereqs[node];
          if (!ps.length) return row.indexOf(node);
          const ks = ps.map(p => prevPos[p]).filter(k => k !== undefined);
          if (!ks.length) return row.indexOf(node);
          return ks.reduce((s, k) => s + k, 0) / ks.length;
        }
      }
    } else {
      for (let d = maxDepth - 1; d >= 0; d--) {
        const nextRow = order[d + 1];
        const nextPos = {};
        nextRow.forEach((node, k) => { nextPos[node] = k; });
        const row = order[d];
        row.sort((a, b) => bary(a) - bary(b));
        function bary(node) {
          const cs = children[node];
          if (!cs.length) return row.indexOf(node);
          const ks = cs.map(c => nextPos[c]).filter(k => k !== undefined);
          if (!ks.length) return row.indexOf(node);
          return ks.reduce((s, k) => s + k, 0) / ks.length;
        }
      }
    }
  }

  // Final x: evenly distribute each layer
  const pos = new Array(N);
  for (let d = 0; d <= maxDepth; d++) {
    const row = order[d];
    const n = row.length;
    row.forEach((node, idx) => {
      const x = n === 1 ? 0.5 : (idx + 1) / (n + 1);
      const y = maxDepth === 0 ? 0.5 : d / maxDepth;
      pos[node] = { x, y };
    });
  }

  return {
    positions: pos,
    depth,
    maxDepth,
    prereqs,
    children,
    edges: prereqs.flatMap((ps, i) => ps.map(p => [p, i])),
  };
}

window.Layout = { layoutTree, splitPrereqs };

</script>

<!-- Atlas normalizer -->
<script>
/* Dataset normalizer — turns the 4 datasets into a unified atlas structure.
   Each tree = { atlas, color, group, name, subtitle, talents[], prereqKey }
   Each talent has normalized field names: name, action, cost, prereqs, description, flavor, tags, sourceAtlas
*/

// (HEROIC_PATHS / HEROIC_COLOR are defined inside the new buildAtlases below.)
const _legacy_radiant_orders = ['Dustbringer','Edgedancer','Elsecaller','Lightweaver','Skybreaker','Stoneward','Truthwatcher','Willshaper','Windrunner'];
const _legacy_radiant_color = {
  Dustbringer: 'red', Edgedancer: 'green', Elsecaller: 'blue',
  Lightweaver: 'white', Skybreaker: 'black', Stoneward: 'green',
  Truthwatcher: 'blue', Willshaper: 'red', Windrunner: 'white',
};
// Deity: use first color from 'Colors' field as theme color, default white
function deityColor(colorsStr) {
  if (!colorsStr) return 'white';
  const c = colorsStr.split(/[\/,]/)[0].trim().toLowerCase();
  if (['white','blue','black','red','green'].includes(c)) return c;
  return 'white';
}

// Action glyph -> human-readable label
const ACTION_LABELS = {
  '∞':   'Passive',
  '★':   'Reaction',
  '⟲':   'Recurring',
  '◇':   'Free Action',
  '▶':   '1 Action',
  '▶▶':  '2 Actions',
  '▶▶▶': '3 Actions',
};
window.ACTION_LABELS = ACTION_LABELS;

function normalizeTalent(raw, atlas, extra = {}) {
  return {
    name:        raw['Talent Name'] || raw.Name,
    action:      raw['Action Type'] || raw.Action || '',
    cost:        raw.Cost || '—',
    prereqs:     raw.Prerequisites || '',
    description: raw.Description || '',
    flavor:      raw['Flavor Text'] || '',
    tags:        raw.Tags || '',
    atlas,
    ...extra,
  };
}

// Parse prereq strings like "Green 2+; Black 2+" or "Death's Threshold; Black 3+"
// to derive deity color theming (first color mentioned).
function deriveDeityColor(prereqStrs) {
  const joined = prereqStrs.join(' ; ');
  const m = joined.match(/(white|blue|black|red|green)\s*\d/i);
  if (m) return m[1].toLowerCase();
  return 'white';
}

// Build trees from unified TalentData rows.
// Convention: Path = group, Specialty = sub-tree. The "Key" talent (Specialty == 'Key')
// is always included as the root of each specialty tree under that path.
function buildPathSpecTrees(rows, atlas, opts = {}) {
  const trees = [];
  const byPath = {};
  for (const r of rows) (byPath[r.Path] = byPath[r.Path] || []).push(r);

  for (const path of Object.keys(byPath).sort((a,b) => {
    const order = opts.order || [];
    const ai = order.indexOf(a), bi = order.indexOf(b);
    if (ai !== -1 || bi !== -1) {
      if (ai === -1) return 1; if (bi === -1) return -1;
      return ai - bi;
    }
    return a.localeCompare(b);
  })) {
    const pathRows = byPath[path];
    const keyTalent = pathRows.find(r => r.Specialty === 'Key');
    const specialties = [...new Set(pathRows.filter(r => r.Specialty !== 'Key').map(r => r.Specialty))];

    for (const spec of specialties) {
      const specRows = pathRows.filter(r => r.Specialty === spec);
      const allRows = keyTalent ? [keyTalent, ...specRows] : specRows;
      const color = opts.color ? opts.color(path, spec, allRows) : 'white';
      trees.push({
        id: `${atlas}/${path}/${spec}`,
        atlas,
        color,
        group: path,
        groupLabel: opts.groupLabel ? opts.groupLabel(path) : path,
        name: spec,
        fullName: `${path} · ${spec}`,
        talents: allRows.map(r => normalizeTalent(r, atlas, {
          color, group: path, tree: spec,
        })),
      });
    }
  }
  return trees;
}

// Heroic path -> theme color mapping (kept for theming compatibility)
const HEROIC_COLOR = {
  Agent: 'blue', Envoy: 'white', Hunter: 'green',
  Leader: 'white', Scholar: 'blue', Warrior: 'red',
};
const HEROIC_PATHS = ['Agent','Envoy','Hunter','Leader','Scholar','Warrior'];

// Stable atlas-prefix tids: 3-letter prefix + 3-digit zero-padded counter.
const TID_PREFIX = {
  // leyline by color
  white: 'whi', blue: 'blu', black: 'bla', red: 'red', green: 'grn',
  // heroic by path
  Agent: 'agt', Envoy: 'env', Hunter: 'hun', Leader: 'led', Scholar: 'sch', Warrior: 'war',
  // deity by domain
  Death: 'dth', Chaos: 'cha', Order: 'ord', Life: 'lif', Sovereignty: 'sov',
  Knowledge: 'knw', Fate: 'fat', Civilization: 'civ', Power: 'pwr', Destruction: 'dst',
};
function tidPrefix(atlas, group) {
  if (atlas === 'leyline') return TID_PREFIX[group.toLowerCase()] || group.toLowerCase().slice(0,3);
  return TID_PREFIX[group] || group.toLowerCase().slice(0,3);
}
function makeTid(prefix, n) {
  return prefix + String(n).padStart(3, '0');
}

function buildAtlases(rows) {
  // rows is a flat array of unified records (Atlas/Path/Specialty/Name/Action/Cost/Prerequisites/Description)
  const byAtlas = { leyline: [], heroic: [], deity: [] };
  for (const r of rows) {
    if (byAtlas[r.Atlas]) byAtlas[r.Atlas].push(r);
  }

  const leylineTrees = buildPathSpecTrees(byAtlas.leyline, 'leyline', {
    order: ['White','Blue','Black','Red','Green'],
    color: (path) => path.toLowerCase(),
    groupLabel: (path) => `${path} Leyline`,
  });

  const heroicTrees = buildPathSpecTrees(byAtlas.heroic, 'heroic', {
    order: HEROIC_PATHS,
    color: (path) => HEROIC_COLOR[path] || 'white',
    groupLabel: (path) => `${path} Path`,
  });

  // Deity: 10 paths, each path has Specialty=Key + Specialty=<same name>.
  // We collapse to one tree per deity-path; theme color derived from prereq mentions.
  const deityTrees = [];
  const byPath = {};
  for (const r of byAtlas.deity) (byPath[r.Path] = byPath[r.Path] || []).push(r);
  for (const path of Object.keys(byPath).sort()) {
    const rows = byPath[path];
    const color = deriveDeityColor(rows.map(r => r.Prerequisites || ''));
    deityTrees.push({
      id: `deity/${path}`,
      atlas: 'deity',
      color,
      group: path,
      groupLabel: path,
      domain: path,
      name: path,
      fullName: path,
      talents: rows.map(r => normalizeTalent(r, 'deity', {
        color, group: path, tree: path, domain: path,
      })),
    });
  }

  // Assign stable tids: per-atlas-group counter, Key-talent first.
  // For leyline/heroic, "group" is the Path and tids are shared across that path's specialty trees.
  // For deity, each tree is its own group.
  function assignTids(trees, atlas) {
    const counters = {}; // group -> next n
    const grouped = {};
    for (const t of trees) (grouped[t.group] = grouped[t.group] || []).push(t);
    for (const group of Object.keys(grouped)) {
      const groupTrees = grouped[group];
      const prefix = tidPrefix(atlas, group);
      counters[group] = 0;
      // Map from talent name -> tid, so duplicate Key talents across specialties share one tid
      const nameToTid = {};
      for (const tr of groupTrees) {
        for (const tal of tr.talents) {
          if (nameToTid[tal.name]) {
            tal.tid = nameToTid[tal.name];
            continue;
          }
          counters[group] += 1;
          tal.tid = makeTid(prefix, counters[group]);
          nameToTid[tal.name] = tal.tid;
        }
      }
    }
  }
  assignTids(leylineTrees, 'leyline');
  assignTids(heroicTrees,  'heroic');
  assignTids(deityTrees,   'deity');

  return {
    leyline: { id: 'leyline', name: 'Leyline', subtitle: 'Mortal arcana — five colors, three specialties each',  trees: leylineTrees },
    heroic:  { id: 'heroic',  name: 'Heroic',  subtitle: 'Skilled practitioners — six paths of mundane mastery', trees: heroicTrees },
    deity:   { id: 'deity',   name: 'Deity',   subtitle: 'Divine dominion — ten domains of investiture',         trees: deityTrees },
  };
}

window.Atlases = { buildAtlases, HEROIC_PATHS, HEROIC_COLOR };

</script>
