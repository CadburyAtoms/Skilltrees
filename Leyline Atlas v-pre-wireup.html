<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skilltrees · The Atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IM+Fell+English+SC&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Parchment palette */
  --parch-0: #f6ecd4;       /* brightest highlight */
  --parch-1: #efe2c1;       /* primary paper */
  --parch-2: #e6d6ab;       /* shadowed paper */
  --parch-3: #d8c290;       /* edge */
  --parch-4: #a48b58;       /* deep sepia */
  --ink-1:   #2a1d10;       /* primary ink */
  --ink-2:   #4a361e;       /* secondary ink */
  --ink-3:   #6b5436;       /* tertiary ink / rules */
  --ink-4:   #8d7552;       /* muted / meta */
  --rubric:  #8c2f24;       /* rubricated red */
  --rubric-deep: #5e1f18;

  /* Color-identity accents (themed per leyline color) */
  --c-white-1: #f4eacc;   --c-white-2: #c9a35c;   --c-white-ink: #6b4f1a;
  --c-blue-1:  #d7e4ee;   --c-blue-2:  #3d6c92;   --c-blue-ink: #1d3a55;
  --c-black-1: #cfc7bd;   --c-black-2: #2d2723;   --c-black-ink: #1a1714;
  --c-red-1:   #f0d1bf;   --c-red-2:   #a33a22;   --c-red-ink:  #5e1c10;
  --c-green-1: #cfd8b3;   --c-green-2: #4a6a33;   --c-green-ink:#2a3d1c;

  /* Currently-selected theme (set on [data-color] elements) */
  --accent-1: var(--parch-2);
  --accent-2: var(--ink-2);
  --accent-ink: var(--ink-1);
}

[data-color="white"] { --accent-1: var(--c-white-1); --accent-2: var(--c-white-2); --accent-ink: var(--c-white-ink); }
[data-color="blue"]  { --accent-1: var(--c-blue-1);  --accent-2: var(--c-blue-2);  --accent-ink: var(--c-blue-ink); }
[data-color="black"] { --accent-1: var(--c-black-1); --accent-2: var(--c-black-2); --accent-ink: var(--c-black-ink); }
[data-color="red"]   { --accent-1: var(--c-red-1);   --accent-2: var(--c-red-2);   --accent-ink: var(--c-red-ink); }
[data-color="green"] { --accent-1: var(--c-green-1); --accent-2: var(--c-green-2); --accent-ink: var(--c-green-ink); }

* { box-sizing: border-box; }
html, body, #root {
  margin: 0; padding: 0; min-height: 100vh;
  font-family: 'Cormorant Garamond', 'IM Fell English', Georgia, serif;
  font-size: 18px;
  color: var(--ink-1);
  background: #1a1410;
}

body {
  background:
    radial-gradient(ellipse at 20% 10%, #2a1e12 0%, #120c08 60%, #0a0705 100%);
  min-height: 100vh;
}

/* Parchment surface: warm paper with subtle speckle + edge vignette */
.parchment {
  background-color: var(--parch-1);
  background-image:
    radial-gradient(ellipse at 30% 20%, rgba(255,245,215,0.55), transparent 55%),
    radial-gradient(ellipse at 80% 80%, rgba(164,139,88,0.18), transparent 50%),
    radial-gradient(circle at 15% 85%, rgba(139,94,42,0.12), transparent 40%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.38  0 0 0 0 0.17  0 0 0 0.09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
    linear-gradient(180deg, var(--parch-0), var(--parch-1) 18%, var(--parch-2));
  box-shadow:
    inset 0 0 60px rgba(91, 62, 27, 0.25),
    inset 0 0 160px rgba(91, 62, 27, 0.12),
    0 10px 40px rgba(0,0,0,0.55),
    0 2px 0 rgba(0,0,0,0.3);
  position: relative;
  border-radius: 2px;
}

.parchment::before {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 0%, transparent 60%, rgba(70,40,10,0.18) 100%),
    radial-gradient(ellipse at 50% 100%, transparent 60%, rgba(70,40,10,0.18) 100%);
  border-radius: inherit;
}

/* Torn / rough edge */
.parchment.torn {
  -webkit-mask-image:
    radial-gradient(circle at 50% 50%, black 98%, transparent 100%);
}

h1, h2, h3, h4 {
  font-family: 'IM Fell English SC', 'Cormorant Garamond', serif;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--ink-1);
  margin: 0;
}

.rubric { color: var(--rubric); }
.small-caps { font-variant: small-caps; letter-spacing: 0.08em; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.72em; }

/* Rule lines reminiscent of old books */
.rule-line {
  border: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--parch-4), transparent);
  opacity: 0.6;
}

.drop-cap::first-letter {
  font-family: 'IM Fell English SC', serif;
  font-size: 3.2em; line-height: 0.85;
  float: left; padding: 0.05em 0.1em 0 0;
  color: var(--rubric);
}

/* Buttons — wax-seal style */
.btn {
  font-family: 'IM Fell English SC', serif;
  font-size: 1rem;
  letter-spacing: 0.1em;
  padding: 0.55em 1.1em;
  background: var(--parch-2);
  border: 1px solid var(--parch-4);
  color: var(--ink-1);
  cursor: pointer;
  transition: all 0.15s ease;
  border-radius: 2px;
}
.btn:hover { background: var(--parch-3); color: var(--ink-2); }
.btn.active { background: var(--ink-2); color: var(--parch-0); border-color: var(--ink-1); }
.btn-ghost { background: transparent; border-color: var(--parch-4); }
.btn-ghost:hover { background: var(--parch-2); }

input[type="text"], input[type="search"] {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem;
  padding: 0.4em 0.7em;
  background: rgba(255, 248, 225, 0.6);
  border: 1px solid var(--parch-4);
  color: var(--ink-1);
  border-radius: 2px;
  outline: none;
}
input[type="text"]:focus, input[type="search"]:focus {
  border-color: var(--ink-2);
  background: rgba(255, 248, 225, 0.85);
}

/* Color-identity chip / sigil */
.sigil {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1.5px solid var(--accent-2);
  background:
    radial-gradient(circle at 30% 30%, #fff, var(--accent-1) 50%, var(--accent-2) 120%);
  box-shadow:
    inset 0 0 4px rgba(0,0,0,0.3),
    0 1px 2px rgba(0,0,0,0.3);
  font-family: 'IM Fell English SC', serif;
  color: var(--accent-ink);
  font-size: 1rem;
  flex-shrink: 0;
}
[data-color="black"] .sigil { color: var(--parch-0); }

/* Talent node */
.talent-node { cursor: pointer; }
.talent-node .node-ring { transition: stroke-width 0.12s ease, filter 0.12s ease; }
.talent-node:hover .node-ring {
  stroke-width: 3.2;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.4));
}
.talent-node:hover .node-body {
  filter: brightness(1.06);
}

/* Subtle scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
::-webkit-scrollbar-thumb { background: var(--parch-4); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: padding-box; border: 2px solid transparent; }

/* App layout */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 1600px;
  margin: 0 auto;
  padding: 16px;
  gap: 14px;
}

/* Masthead */
.masthead {
  padding: 18px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.masthead .title-block h1 {
  font-size: 2.4rem; line-height: 1;
}
.masthead .title-block .subtitle {
  font-style: italic;
  color: var(--ink-3);
  margin-top: 6px;
  font-size: 1.05rem;
}

/* Atlas hub — 4 big cards */
.atlas-hub {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.atlas-card {
  padding: 22px 24px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.atlas-card:hover { transform: translateY(-3px); }
.atlas-card-head h2 { font-size: 1.8rem; margin-bottom: 4px; }
.atlas-card .count { font-family: 'IM Fell English SC', serif; font-size: 0.78rem; letter-spacing: 0.12em; color: var(--ink-4); margin-top: 10px; }
@media (max-width: 900px) { .atlas-hub { grid-template-columns: repeat(2, 1fr); } }

/* Group grid (inside an atlas) */
.group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.group-grid.leyline-grid { grid-template-columns: repeat(5, 1fr); }
@media (max-width: 1300px) { .group-grid.leyline-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 800px)  { .group-grid.leyline-grid { grid-template-columns: repeat(2, 1fr); } }

.group-card {
  padding: 20px 22px;
  text-align: left;
  position: relative;
  overflow: hidden;
}
.group-card-big {
  display: flex;
  flex-direction: column;
  gap: 10px;
  cursor: pointer;
  font: inherit;
  color: inherit;
  background-color: var(--parch-1);
  border: none;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  min-height: 240px;
}
.group-card-big:hover {
  transform: translateY(-3px);
  box-shadow:
    inset 0 0 60px rgba(91, 62, 27, 0.25),
    inset 0 0 160px rgba(91, 62, 27, 0.12),
    0 18px 48px rgba(0,0,0,0.6),
    0 2px 0 rgba(0,0,0,0.3);
}
.group-card-big:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: -4px;
}
.group-card-big::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, transparent 60%, var(--accent-2) 320%);
  opacity: 0.12;
  border-radius: inherit;
}
.group-card-head { display: flex; gap: 12px; align-items: center; margin-bottom: 4px; }
.group-card-head h3 { font-size: 1.45rem; line-height: 1.1; }

.sigil-lg {
  width: 48px; height: 48px;
  font-size: 1.5rem;
}

.group-lore {
  font-size: 1.02rem;
  line-height: 1.5;
  color: var(--ink-1);
  margin: 6px 0 4px;
}
.group-gameplay {
  font-size: 0.95rem;
  line-height: 1.5;
  color: var(--ink-2);
  margin: 0;
}
.group-gp-label {
  font-family: 'IM Fell English SC', serif;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  color: var(--accent-ink);
  margin-right: 6px;
  padding: 1px 8px;
  background: rgba(255,245,215,0.6);
  border: 1px solid var(--accent-2);
  border-radius: 99px;
  display: inline-block;
  vertical-align: 2px;
}

.group-card-foot {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid var(--parch-3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 0.85rem;
}
.group-card-foot .tree-names {
  font-style: italic;
  color: var(--ink-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.group-card-foot .group-count {
  color: var(--ink-4);
  flex-shrink: 0;
  font-size: 0.75rem;
}

/* Legacy color-hub (unused but keep fallback) */
.color-hub {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
}
.color-card {
  padding: 20px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.color-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 60%, var(--accent-2) 300%);
  opacity: 0.15;
  pointer-events: none;
}
.color-card:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(0,0,0,0.6), inset 0 0 60px rgba(91,62,27,0.25); }
.color-card.active { outline: 2px solid var(--accent-2); outline-offset: -2px; }
.color-card .sigil-xl {
  width: 56px; height: 56px; font-size: 1.6rem;
  margin-bottom: 8px;
}
.color-card h3 { font-size: 1.3rem; }
.color-card .tag {
  font-style: italic;
  color: var(--ink-3);
  font-size: 0.9rem;
  margin-top: 4px;
}
.color-card .count {
  font-family: 'IM Fell English SC', serif;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  color: var(--ink-4);
  margin-top: 10px;
}

/* Tree picker tabs */
.tree-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--parch-4);
  padding: 0 24px;
}
.tree-tab {
  font-family: 'IM Fell English SC', serif;
  font-size: 1rem;
  padding: 10px 20px;
  cursor: pointer;
  background: transparent;
  border: none;
  color: var(--ink-3);
  letter-spacing: 0.1em;
  position: relative;
  top: 1px;
}
.tree-tab.active {
  color: var(--ink-1);
  border-bottom: 2px solid var(--accent-2);
  background: linear-gradient(180deg, transparent, rgba(255,245,215,0.4));
}

/* Main body layout */
.body-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  gap: 14px;
  min-height: 600px;
}

/* Tree canvas area */
.tree-panel {
  padding: 24px 28px;
  position: relative;
  min-height: 640px;
}

.tree-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 14px;
  gap: 20px;
  flex-wrap: wrap;
}
.tree-header h2 {
  font-size: 2rem;
}
.tree-header .tree-theme {
  font-style: italic;
  color: var(--ink-3);
  font-size: 1.05rem;
}

.tree-svg-wrap {
  position: relative;
  aspect-ratio: 4/3;
  width: 100%;
  max-height: 640px;
}
.tree-svg-wrap.edit-mode {
  background:
    repeating-linear-gradient(0deg, transparent 0, transparent 23px, rgba(120,90,60,0.06) 24px),
    repeating-linear-gradient(90deg, transparent 0, transparent 23px, rgba(120,90,60,0.06) 24px);
  outline: 1.5px dashed var(--accent-2);
  outline-offset: -4px;
  user-select: none;
}
.talent-node.draggable { transition: none; }
.talent-node.dragging .node-ring { filter: drop-shadow(0 4px 6px rgba(60,30,10,0.35)); }
.edit-hint {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 14px;
  background: var(--parch-1);
  border: 1px solid var(--parch-3);
  font-family: 'IM Fell English SC', serif;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  pointer-events: none;
  border-radius: 1px;
  text-align: center;
  max-width: 90%;
}
.edge-delete-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 6px 12px;
  background: #c0392b;
  color: #fff;
  border: none;
  font-family: 'IM Fell English SC', serif;
  letter-spacing: 0.08em;
  font-size: 0.8rem;
  cursor: pointer;
  border-radius: 2px;
}
.cycle-warn {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: #e67e22;
  color: #fff;
  padding: 6px 14px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.85rem;
  border-radius: 2px;
  pointer-events: none;
}

/* Detail panel */
.detail-panel {
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  min-height: 640px;
}

.detail-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  flex: 1;
  color: var(--ink-4);
  font-style: italic;
}

.talent-detail h3 {
  font-size: 1.75rem;
  margin-bottom: 2px;
  line-height: 1.15;
}
.talent-detail .prereq-path {
  font-size: 0.9rem;
  color: var(--ink-4);
  letter-spacing: 0.05em;
  font-variant: small-caps;
  margin-bottom: 12px;
}
.talent-detail .action-cost {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.talent-detail .pill {
  padding: 4px 12px;
  border: 1px solid var(--ink-3);
  border-radius: 99px;
  font-size: 0.92rem;
  font-variant: small-caps;
  letter-spacing: 0.06em;
  color: var(--ink-2);
  background: rgba(255, 245, 215, 0.5);
}
.talent-detail .pill.cost { border-color: var(--accent-2); color: var(--accent-ink); }
.talent-detail .desc {
  font-size: 1.15rem;
  line-height: 1.55;
  margin-bottom: 14px;
}
.talent-detail .flavor {
  font-style: italic;
  font-size: 1.08rem;
  color: var(--ink-3);
  padding-left: 14px;
  border-left: 2px solid var(--accent-2);
  margin-bottom: 16px;
}
.talent-detail .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.talent-detail .tag-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  color: var(--ink-3);
  padding: 3px 10px;
  border: 1px dashed var(--parch-4);
  border-radius: 2px;
  background: rgba(255,245,215,0.4);
}

.talent-detail .prereq-block {
  margin: 10px 0 14px;
  font-size: 1rem;
}
.talent-detail .prereq-block .label {
  font-variant: small-caps;
  letter-spacing: 0.08em;
  color: var(--ink-4);
  font-size: 0.85rem;
  display: block;
  margin-bottom: 4px;
}

/* Sibling tree tabs in tree header */
.sibling-tabs {
  display: flex;
  gap: 4px;
  flex: 1 1 auto;
  justify-content: center;
  flex-wrap: wrap;
  padding: 0 18px;
  min-width: 0;
}
.sibling-tab {
  font-family: 'IM Fell English SC', 'Cormorant Garamond', serif;
  font-size: 0.95rem;
  letter-spacing: 0.08em;
  padding: 7px 14px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--ink-3);
  cursor: pointer;
  border-radius: 0;
  transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
}
.sibling-tab:hover {
  color: var(--ink-1);
  background: rgba(255, 245, 215, 0.35);
}
.sibling-tab.active {
  color: var(--rubric);
  border-bottom-color: var(--accent-2);
  cursor: default;
  background: rgba(255, 245, 215, 0.5);
}
@media (max-width: 1100px) {
  .sibling-tabs { order: 3; width: 100%; justify-content: flex-start; padding: 6px 0 0 0; }
}
.talent-editor .edit-name {
  font-family: 'IM Fell English SC', 'Cormorant Garamond', serif;
  font-size: 1.7rem;
  font-weight: 500;
  color: var(--rubric);
  background: rgba(255,248,225,0.7);
  border: 1px dashed var(--parch-4);
  padding: 4px 10px;
  width: 100%;
  letter-spacing: 0.02em;
}
.talent-editor .edit-name:focus {
  border-color: var(--accent-2);
  border-style: solid;
}
.talent-editor .edit-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 12px;
}
.talent-editor .edit-label {
  font-variant: small-caps;
  letter-spacing: 0.08em;
  color: var(--ink-4);
  font-size: 0.82rem;
}
.edit-input, .edit-select, .edit-textarea {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem;
  padding: 6px 10px;
  background: rgba(255,248,225,0.7);
  border: 1px dashed var(--parch-4);
  color: var(--ink-1);
  border-radius: 2px;
  outline: none;
  width: 100%;
}
.edit-textarea {
  resize: vertical;
  line-height: 1.45;
  font-size: 1.08rem;
}
.edit-textarea.edit-flavor { font-style: italic; }
.edit-select {
  font-family: 'IM Fell English SC', serif;
  letter-spacing: 0.06em;
  cursor: pointer;
}
.edit-input:focus, .edit-select:focus, .edit-textarea:focus {
  border-style: solid;
  border-color: var(--accent-2);
  background: rgba(255,248,225,0.95);
}

/* Connections editor (in-sidebar prereq wiring) */
.conn-block {
  margin: 14px 0;
  padding: 10px 12px;
  background: rgba(165, 124, 87, 0.06);
  border-left: 3px solid var(--accent-2);
  border-radius: 2px;
}
.conn-header {
  font-family: 'IM Fell English SC', serif;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  color: var(--rubric);
  font-variant: small-caps;
  margin-bottom: 8px;
}
.conn-row {
  margin-bottom: 10px;
}
.conn-row:last-child { margin-bottom: 0; }
.conn-row-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.85rem;
  color: var(--ink-3);
  font-style: italic;
  margin-bottom: 4px;
}
.conn-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 6px;
  min-height: 22px;
}
.conn-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 4px 2px 10px;
  background: var(--parch-1);
  border: 1px solid var(--parch-4);
  border-radius: 99px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.95rem;
  color: var(--ink-1);
}
.conn-pill-x {
  border: none;
  background: transparent;
  color: var(--ink-3);
  cursor: pointer;
  font-size: 1.1rem;
  line-height: 1;
  padding: 0 4px;
  border-radius: 99px;
}
.conn-pill-x:hover { color: #c0392b; background: rgba(192,57,43,0.1); }
.conn-empty {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: var(--ink-4);
  font-size: 0.9rem;
}
.conn-btn {
  font-size: 0.85rem !important;
  padding: 3px 10px !important;
}
.filter-bar {
  padding: 14px 20px;
  display: flex;
  gap: 14px;
  align-items: center;
  flex-wrap: wrap;
}
.filter-bar .group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-bar .group-label {
  font-family: 'IM Fell English SC', serif;
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  color: var(--ink-3);
  margin-right: 4px;
}
.chip-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  padding: 4px 12px;
  border: 1px solid var(--parch-4);
  background: transparent;
  color: var(--ink-2);
  border-radius: 99px;
  cursor: pointer;
}
.chip-btn.active { background: var(--ink-2); color: var(--parch-0); border-color: var(--ink-1); }

.search-input {
  flex: 1;
  min-width: 220px;
}

/* Designer stats */
.stats-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}
.stat {
  padding: 10px 12px;
  background: rgba(255, 245, 215, 0.45);
  border: 1px solid var(--parch-3);
}
.stat .num { font-family: 'IM Fell English SC', serif; font-size: 1.3rem; }
.stat .lbl { font-size: 0.7rem; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; }

/* Small screens */
@media (max-width: 1100px) {
  .body-layout { grid-template-columns: 1fr; }
  .color-hub { grid-template-columns: repeat(5, 1fr); }
}
@media (max-width: 800px) {
  .color-hub { grid-template-columns: repeat(3, 1fr); }
  .stats-row { grid-template-columns: repeat(3, 1fr); }
}

/* Allocation mode overlays on nodes */
.talent-node.learned .node-ring { stroke: var(--accent-2); stroke-width: 3; }
.talent-node.locked .node-body { opacity: 0.45; }

/* Points bar */
.points-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: rgba(0,0,0,0.1);
  border: 1px solid var(--parch-4);
  border-radius: 2px;
  font-family: 'IM Fell English SC', serif;
  font-size: 0.9rem;
  letter-spacing: 0.08em;
}

/* Cross-ref slide-out */
.xref-drawer {
  padding: 18px 22px;
}
.xref-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* View transitions */
.fade-in {
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}

/* Info callout */
.callout {
  padding: 10px 14px;
  background: rgba(210, 160, 90, 0.15);
  border-left: 3px solid var(--accent-2);
  font-size: 0.9rem;
  color: var(--ink-2);
  margin: 10px 0;
}

/* =========================================================
   Color pips — small swatches used on group cards + prereqs
   ========================================================= */

.color-pip {
  display: inline-block;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid rgba(0,0,0,0.35);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.55),
    inset 0 -2px 4px rgba(0,0,0,0.25),
    0 1px 2px rgba(0,0,0,0.35);
  flex-shrink: 0;
}
.color-pip.pip-white { background: radial-gradient(circle at 30% 25%, #fff8df, #e6c977 70%, #b48836 120%); }
.color-pip.pip-blue  { background: radial-gradient(circle at 30% 25%, #cfe3f3, #3d6c92 70%, #1d3a55 120%); }
.color-pip.pip-black { background: radial-gradient(circle at 30% 25%, #655c54, #2d2723 60%, #0b0907 120%); border-color: rgba(0,0,0,0.6); }
.color-pip.pip-red   { background: radial-gradient(circle at 30% 25%, #f4c2ad, #a33a22 65%, #5e1c10 120%); }
.color-pip.pip-green { background: radial-gradient(circle at 30% 25%, #d5dfb0, #4a6a33 65%, #2a3d1c 120%); }

.color-pips {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-shrink: 0;
}
.color-pips .color-pip { width: 28px; height: 28px; }
.color-pips .color-pip + .color-pip {
  margin-left: -10px;
}
.pips-2 .color-pips .color-pip:nth-child(2) {
  /* sit slightly below the first for a coin-stack feel */
  transform: translateY(4px);
}

/* Themed group cards — color band across the top (banner does the work) */
.group-card.color-card-themed {
  padding-top: 22px;
}
.group-card .group-card-banner {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 8px;
  background: var(--accent-2);
  pointer-events: none;
  z-index: 1;
}
/* Dual-color: banner split 50/50 with hard edge */
.group-card[data-color-2="white"] .group-card-banner { background: linear-gradient(90deg, var(--accent-2) 0 50%, var(--c-white-2) 50% 100%); }
.group-card[data-color-2="blue"]  .group-card-banner { background: linear-gradient(90deg, var(--accent-2) 0 50%, var(--c-blue-2)  50% 100%); }
.group-card[data-color-2="black"] .group-card-banner { background: linear-gradient(90deg, var(--accent-2) 0 50%, var(--c-black-2) 50% 100%); }
.group-card[data-color-2="red"]   .group-card-banner { background: linear-gradient(90deg, var(--accent-2) 0 50%, var(--c-red-2)   50% 100%); }
.group-card[data-color-2="green"] .group-card-banner { background: linear-gradient(90deg, var(--accent-2) 0 50%, var(--c-green-2) 50% 100%); }

.group-colors-label {
  font-size: 0.82rem;
  color: var(--accent-ink);
  letter-spacing: 0.12em;
  font-weight: 600;
  margin-top: 2px;
}

/* =========================================================
   Prereq block — moved up, typed chips
   ========================================================= */

.prereq-block-top {
  margin: 0 0 14px !important;
  padding: 10px 12px;
  background: rgba(140, 47, 36, 0.07);
  border: 1px solid rgba(140, 47, 36, 0.25);
  border-left: 3px solid var(--rubric);
  border-radius: 2px;
}
.prereq-block-top .label {
  color: var(--rubric) !important;
  font-weight: 600;
  font-size: 0.78rem !important;
  margin-bottom: 8px !important;
}
.prereq-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.prereq-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: 0.88rem;
  border-radius: 99px;
  border: 1px solid var(--parch-4);
  background: rgba(255, 248, 225, 0.75);
  color: var(--ink-2);
  font-family: 'Cormorant Garamond', serif;
}
.prereq-chip .color-pip {
  width: 14px; height: 14px;
}
.prereq-chip.prereq-color {
  padding: 3px 10px 3px 4px;
  font-weight: 600;
}
.prereq-chip.prereq-color .prereq-chip-label { color: var(--ink-1); }
.prereq-chip.prereq-color .prereq-rank {
  font-family: 'IM Fell English SC', serif;
  font-size: 0.78rem;
  color: var(--ink-3);
  padding: 0 4px;
  border-left: 1px solid var(--parch-4);
  margin-left: 2px;
  letter-spacing: 0.08em;
}
.prereq-chip.prereq-color.pip-white { background: linear-gradient(90deg, rgba(244,234,204,0.9), rgba(255,248,225,0.75) 60%); }
.prereq-chip.prereq-color.pip-blue  { background: linear-gradient(90deg, rgba(215,228,238,0.9), rgba(255,248,225,0.75) 60%); }
.prereq-chip.prereq-color.pip-black { background: linear-gradient(90deg, rgba(207,199,189,0.9), rgba(255,248,225,0.75) 60%); }
.prereq-chip.prereq-color.pip-red   { background: linear-gradient(90deg, rgba(240,209,191,0.9), rgba(255,248,225,0.75) 60%); }
.prereq-chip.prereq-color.pip-green { background: linear-gradient(90deg, rgba(207,216,179,0.9), rgba(255,248,225,0.75) 60%); }

.prereq-chip.prereq-stat {
  font-variant: small-caps;
  letter-spacing: 0.04em;
  background: rgba(255, 248, 225, 0.5);
  border-style: dashed;
}
.prereq-chip.prereq-talent {
  font-style: italic;
  background: rgba(140, 47, 36, 0.08);
  border-color: rgba(140, 47, 36, 0.35);
  color: var(--rubric-deep);
}

/* =========================================================
   Tweaks panel
   ========================================================= */

.tweaks-panel {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 340px;
  max-height: 70vh;
  overflow-y: auto;
  z-index: 1000;
  padding: 14px 16px;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.7),
    inset 0 0 60px rgba(91, 62, 27, 0.25);
}
.tweaks-panel-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--parch-3);
}
.tweaks-panel-head h3 {
  font-family: 'IM Fell English SC', serif;
  color: var(--rubric);
  letter-spacing: 0.12em;
  font-size: 1.1rem;
}
.tweaks-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 12px;
}
.tweaks-row label {
  font-family: 'IM Fell English SC', serif;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  color: var(--ink-3);
}
.tweaks-row textarea,
.tweaks-row input[type="text"] {
  width: 100%;
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.95rem;
  padding: 6px 8px;
  background: rgba(255,248,225,0.7);
  border: 1px dashed var(--parch-4);
  color: var(--ink-1);
  border-radius: 2px;
  outline: none;
  resize: vertical;
  line-height: 1.4;
}
.tweaks-row textarea:focus,
.tweaks-row input:focus {
  border-style: solid;
  border-color: var(--accent-2);
  background: rgba(255,248,225,0.95);
}
.tweaks-target-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--parch-3);
}
.tweaks-empty {
  font-style: italic;
  color: var(--ink-4);
  font-size: 0.88rem;
  text-align: center;
  padding: 20px 8px;
}

/* ── Edit-mode extras ── */
.tree-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 14px 4px;
  border-bottom: 1px solid var(--parch-3);
}
.cycle-warn {
  position: absolute;
  bottom: 52px;
  left: 50%;
  transform: translateX(-50%);
  background: #5c1b1b;
  color: #ffd4d4;
  border: 1px solid #c0392b;
  padding: 7px 18px;
  border-radius: 6px;
  font-size: 0.85rem;
  white-space: nowrap;
  z-index: 100;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
}
/* ---------- Build view (NEW) ---------- */
.build-pip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 7px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--rubric);
  color: var(--parch-0);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  font-weight: 700;
  vertical-align: 1px;
}
.btn.active .build-pip { background: var(--ink-1); color: var(--parch-0); }

.build-stats {
  display: flex;
  gap: 22px;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px dashed var(--parch-3);
  flex-wrap: wrap;
  align-items: stretch;
}
.build-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 78px;
  padding: 4px 10px;
}
.build-stat + .build-stat { border-left: 1px solid var(--parch-3); }
.build-stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2rem;
  font-weight: 700;
  line-height: 1;
  color: var(--ink-1);
}
.build-stat-label {
  margin-top: 6px;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: var(--ink-4);
  text-transform: uppercase;
}
.build-stat-actions { align-items: flex-start; min-width: 200px; padding-top: 4px; }
.action-mix {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 6px;
}
.action-chip {
  font-family: 'IM Fell English SC', serif;
  font-size: 0.78rem;
  background: var(--parch-0);
  border: 1px solid var(--parch-3);
  border-radius: 4px;
  padding: 3px 8px;
  color: var(--ink-2);
}
.action-chip .mono { color: var(--ink-4); margin-left: 4px; font-size: 0.7rem; }

.build-empty {
  text-align: center;
  padding: 60px 20px;
}
.build-section {
  padding: 18px 22px;
  border-left: 4px solid var(--accent-2, var(--parch-4));
}
.build-section[data-color="white"] { --accent-2: var(--c-white-2); }
.build-section[data-color="blue"]  { --accent-2: var(--c-blue-2); }
.build-section[data-color="black"] { --accent-2: var(--c-black-2); }
.build-section[data-color="red"]   { --accent-2: var(--c-red-2); }
.build-section[data-color="green"] { --accent-2: var(--c-green-2); }
.build-section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  border-bottom: 1px solid var(--parch-3);
  padding-bottom: 8px;
  margin-bottom: 14px;
}
.build-section-head h3 { font-size: 1.5rem; }
.build-count-badge { color: var(--ink-4); font-size: 0.78rem; }

.build-group { margin-bottom: 18px; }
.build-group-head {
  font-size: 0.82rem;
  letter-spacing: 0.12em;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.build-group-label { font-weight: 600; }

.build-tree { margin-bottom: 10px; padding-left: 12px; border-left: 1px dotted var(--parch-3); }
.build-tree-name {
  background: none; border: none; padding: 4px 0;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  text-align: left;
}
.build-tree-name:hover { color: var(--rubric); text-decoration: underline; }

.build-talent-list { list-style: none; padding: 0; margin: 6px 0 0 0; }
.build-talent {
  padding: 8px 10px 10px 18px;
  margin-bottom: 4px;
  background: linear-gradient(90deg, var(--parch-0) 0%, transparent 60%);
  border-radius: 3px;
  position: relative;
  display: block;
  min-height: 0;
}
.build-talent::before {
  content: '◆';
  position: absolute; left: 4px; top: 11px;
  color: var(--rubric);
  font-size: 0.6rem;
}
.build-talent-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  margin-bottom: 4px;
  line-height: 1.2;
}
.build-talent-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 600;
  color: var(--ink-1);
  flex: 1 1 auto;
  min-width: 0;
}
.build-talent-meta {
  font-size: 0.72rem;
  color: var(--ink-4);
  white-space: nowrap;
  flex: 0 0 auto;
  padding-top: 3px;
}
.build-talent-desc {
  font-size: 0.86rem;
  line-height: 1.5;
  color: var(--ink-2);
  display: block;
  margin-top: 0;
  word-break: break-word;
  overflow-wrap: anywhere;
}
